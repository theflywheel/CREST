user root;
events {}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    # The verifier's did:web resolver constructs an HTTPS URL on the DID
    # authority's default port.  This sidecar is the private development TLS
    # endpoint for certify.crest.test; it exposes one DID document and nothing
    # else from Certify.
    server {
        listen 443 ssl;
        server_name certify.crest.test;

        ssl_certificate     /etc/nginx/tls/companion-tls.crt;
        ssl_certificate_key /etc/nginx/tls/companion-tls.key;

        location = /v1/certify/.well-known/did.json {
            set $certify_backend inji-certify:8090;
            proxy_pass http://$certify_backend/v1/certify/.well-known/did.json;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
