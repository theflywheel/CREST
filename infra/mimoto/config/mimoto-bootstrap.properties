# Mimoto's bootstrap properties, vendored from inji-certify v0.14.0
# (docker-compose/docker-compose-injistack/config/mimoto-bootstrap.properties).
#
# This file is easy to miss and expensive to miss. It supplies
# spring.application.name, server.port, the servlet context path and the OpenAPI
# info block — none of which are in mimoto-default.properties, because upstream
# expects both files. Without it Mimoto dies during start-up reporting an
# unsatisfied dependency on `securityConfig`, which names nothing that is
# actually absent; the real message, four causes down, is
# `property spring.application.name not found`.
#
# CREST: marks a changed line — only the two URLs.

# CREST: upstream points both of these at an nginx sidecar that fronts Certify
# and also serves the wallet config documents as static files. We have no such
# sidecar; Inji Web already serves those same documents, and is built from the
# same files, so a mismatch between what Mimoto validates and what the wallet
# reads cannot arise.
spring.cloud.config.uri=${MIMOTO_CONFIG_URI:http://inji-web:3004/}
spring.cloud.config.name=mimoto,inji
spring.application.name=mimoto

#config.server.file.storage.uri=https://raw.githubusercontent.com/mosip/mosip-config/collab1/
config.server.file.storage.uri=${MIMOTO_CONFIG_URI:http://inji-web:3004/}

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh

# The port number on which the Mimoto service will be running
server.port=8099
# Base URL for all the APIs in Mimoto service
server.servlet.context-path=/v1/mimoto
# Sets the maximum allowed total size (in bytes) for all HTTP response headers generated by Tomcat, including the Location header for redirects
server.tomcat.max-http-response-header-size=65536

health.config.enabled=false

openapi.info.title=${spring.application.name}
openapi.info.description=${spring.application.name}
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
openapi.service.servers[0].url=${mosip.api.public.url}${server.servlet.context-path}
openapi.service.servers[0].description=${spring.application.name}
openapi.group.name=${openapi.info.title}
openapi.group.paths[0]=/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha