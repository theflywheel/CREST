# Local variant of infra/railway/nginx.apps.conf.template: same route policy —
# the /internal/ fence, the service allowlist, the alias names — with compose
# service upstreams and compose's DNS. Locally the doors also need the
# /api/crest-registry proxy for the eSignet login callback: the callback URL is
# <door origin>/api/crest-registry/v1/auth/callback so the session cookie is
# first-party, and a static-only nginx 404s the return leg of every login.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The fence (#102, §16 service-identity ruling).
    location ~ ^(?:/(?:console|worker|verify|enrolment|web))?/api/[a-z-]+/internal/ { return 404; }

    location ~ ^(?:/(?:console|worker|verify|enrolment|web))?/api/crest-(registry|definitions|evidence|verification)/(?<crest>.*)$ {
        set $upstream http://core:8080/$crest$is_args$args;
        proxy_pass $upstream;
        proxy_set_header Host core;
        proxy_read_timeout 30s;
    }
    location ~ ^(?:/(?:console|worker|verify|enrolment|web))?/api/crest-confirmation/(?<crest>.*)$ {
        set $upstream http://core:8080/$crest$is_args$args;
        proxy_pass $upstream;
        proxy_set_header Host core;
        proxy_read_timeout 30s;
    }
    location ~ ^(?:/(?:console|worker|verify|enrolment|web))?/api/crest-core/(?<rest>.*)$ {
        set $upstream http://core:8080/$rest$is_args$args;
        proxy_pass $upstream;
        proxy_set_header Host core;
        proxy_read_timeout 30s;
    }
    location ~ ^(?:/(?:console|worker|verify|enrolment|web))?/api/crest-payments/(?<rest>.*)$ {
        set $upstream http://payments:8080/$rest$is_args$args;
        proxy_pass $upstream;
        proxy_set_header Host payments;
        proxy_read_timeout 30s;
    }
    location ~ ^(?:/(?:console|worker|verify|enrolment|web))?/api/crest-mock-oidc/(?<rest>.*)$ {
        set $upstream http://mock-oidc:8080/$rest$is_args$args;
        proxy_pass $upstream;
        proxy_set_header Host mock-oidc;
        proxy_read_timeout 30s;
    }

    location ~ ^(?:/(?:console|worker|verify|enrolment|web))?/api/ { return 404; }

    location /docs/ { try_files $uri $uri.html $uri/index.html =404; }

    location / { try_files $uri $uri/ =404; }
}
