# CREST local stack.
#
# Two halves: substrate we run but do not build (Postgres, object store, DeDi,
# Inji, eSignet), and services we build. Start the substrate alone with
# `make substrate-up` — that is what the P0 spike (#1-#3) needs.
#
# Upstream tags were verified against Docker Hub on 2026-08-22 as part of the P0
# spike (#1, #3); see .env.example for what that audit changed and why.
#
# Host ports are deliberately in the 5xxxx range and overridable: developers
# routinely already run Postgres on 5432, and a stack that refuses to start on a
# colleague's laptop gets abandoned rather than debugged.

name: crest

x-service: &crest-service
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile.service
  restart: unless-stopped
  environment: &crest-env
    CREST_ENV: local
    LOG_LEVEL: debug
    ADDR: ":8080"
    DATABASE_URL: postgres://crest:crest@postgres:5432/crest?sslmode=disable
    DEDI_URL: http://dedi:8080
    CERTIFY_URL: http://inji-certify:8090
    S3_ENDPOINT: http://objectstore:8333
  depends_on:
    postgres:
      condition: service_healthy

x-healthcheck: &crest-healthcheck
  healthcheck:
    test: ["CMD", "/crest-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  # ── Substrate: run, don't build ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crest
      POSTGRES_PASSWORD: crest
      POSTGRES_DB: crest
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crest -d crest"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for consent artefacts, including voice consent
  # recordings from assisted enrolment (#24). SeaweedFS rather than MinIO — see
  # docs/COMPONENTS.md. Swappable: pkg/store speaks the S3 API, not this server.
  objectstore:
    image: chrislusf/seaweedfs:3.80
    command: "server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64"
    ports: ["${S3_PORT:-58333}:8333"]
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # DeDi-node, from the published multi-arch image. `make dedi-image` still
  # exists for running an unreleased build from a checkout.
  #
  # It keeps its own Postgres. The node owns a transparency log whose leaves are
  # signed and whose checkpoints must never be rolled back — sharing a database
  # with CREST would make a CREST migration able to rewrite registry history.
  dedi-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dedi
      POSTGRES_PASSWORD: dedi
      POSTGRES_DB: dedi
    volumes:
      - dedipgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dedi -d dedi"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["substrate", "full"]

  dedi:
    image: ${DEDI_IMAGE:-flywheelai/dedi-node:sha-2d020a3}
    ports: ["${DEDI_PORT:-58081}:8080"]
    environment:
      DEDI_DB_URL: postgres://dedi:dedi@dedi-postgres:5432/dedi?sslmode=disable
      DEDI_KEY_FILE: /keys/dedid.key
      DEDI_ORIGIN: ${DEDI_ORIGIN:-crest.local/log}
      DEDI_LISTEN: ":8080"
      # Writes are signed with a publisher key regardless; this names which key
      # may write to which namespace. Generated by `make dedi-keys`.
      DEDI_PUBLISHER_KEYS: ${DEDI_PUBLISHER_KEYS:-}
      DEDI_WILDCARD_NAMESPACES: ${DEDI_NAMESPACE:-crest.local}
    volumes:
      - ./dedi-keys:/keys:ro
    depends_on:
      dedi-postgres:
        condition: service_healthy
    profiles: ["substrate", "full"]

  inji-certify:
    image: ${INJI_CERTIFY_IMAGE:-mosipid/inji-certify:0.13.1}
    ports: ["${CERTIFY_PORT:-58090}:8090"]
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["substrate", "full"]

  # Inji Verify is two containers upstream, not one (P0 finding, #1). The tag we
  # had guessed for a single `inji-verify` image does not exist.
  inji-verify-service:
    image: ${INJI_VERIFY_SERVICE_IMAGE:-mosipid/inji-verify-service:0.16.0}
    ports: ["${VERIFY_SERVICE_PORT:-58091}:8080"]
    profiles: ["substrate", "full"]

  inji-verify-ui:
    image: ${INJI_VERIFY_UI_IMAGE:-mosipid/inji-verify-ui:0.16.0}
    # amd64 only upstream — pinned so the platform mismatch is a stated choice
    # rather than a warning nobody reads.
    platform: linux/amd64
    ports: ["${VERIFY_UI_PORT:-58092}:3000"]
    depends_on: [inji-verify-service]
    profiles: ["substrate", "full"]

  # The browser wallet. #1 needs somewhere to hold a credential, and the mobile
  # wallet ships through app stores rather than as an image.
  inji-web:
    image: ${INJI_WEB_IMAGE:-mosipid/inji-web:0.15.0}
    ports: ["${INJI_WEB_PORT:-58093}:3000"]
    profiles: ["full"]

  # Both eSignet images are rebuilt with our own entrypoint. The stock one runs
  # an HSM-client installer that cannot succeed here and leaves the container
  # looping — see infra/compose/esignet-start.sh and docs/p0-findings.md (C7).
  esignet:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.esignet
      args:
        ESIGNET_IMAGE: ${ESIGNET_IMAGE:-mosipid/esignet-with-plugins:1.8.0}
    ports: ["${ESIGNET_PORT:-58088}:8088"]
    environment:
      # Not SPRING_PROFILES_ACTIVE: the image passes this one to the JVM itself.
      active_profile_env: default,local
      plugin_name_env: esignet-mock-plugin.jar
      MOSIP_ESIGNET_DATABASE_URL: jdbc:postgresql://postgres:5432/mosip_esignet?currentSchema=esignet
      MOSIP_ESIGNET_DATABASE_USERNAME: ${POSTGRES_USER:-crest}
      MOSIP_ESIGNET_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-crest}
      MOSIP_ESIGNET_MOCK_DOMAIN_URL: http://esignet-mock-identity:8082
      MOSIP_ESIGNET_INTEGRATION_KEY_BINDER: MockKeyBindingWrapperService
      MOSIP_ESIGNET_HOST: localhost:${ESIGNET_PORT:-58088}
      MOSIP_ESIGNET_DOMAIN_URL: http://localhost:${ESIGNET_PORT:-58088}
      SPRING_CACHE_TYPE: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_ENABLED: "false"
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["substrate", "full"]

  esignet-mock-identity:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.mock-identity
      args:
        ESIGNET_MOCK_IMAGE: ${ESIGNET_MOCK_IMAGE:-mosipid/mock-identity-system:0.13.0}
    ports: ["${ESIGNET_MOCK_PORT:-58082}:8082"]
    environment:
      active_profile_env: default,local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-crest}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-crest}
      MOSIP_MOCK_IDA_KYC_TRANSACTION_TIMEOUT_SECS: "900"
      MOSIP_ESIGNET_HOST: localhost:${ESIGNET_PORT:-58088}
      redis.host: redis
      redis.port: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["substrate", "full"]

  # eSignet caches sessions here. Only the substrate profile needs it; CREST's
  # own services do not use Redis and should not learn to.
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports: ["${REDIS_PORT:-56379}:6379"]
    profiles: ["substrate", "full"]

  # ── Mocks: ours, so the stack is usable without paid externals ───────────

  mock-sms:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.tool
      args:
        TOOL: sms
    ports: ["${MOCK_SMS_PORT:-59101}:8080"]
    environment:
      ADDR: ":8080"

  mock-rail:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.tool
      args:
        TOOL: rail
    ports: ["${MOCK_RAIL_PORT:-59102}:8080"]
    environment:
      ADDR: ":8080"

  # ── CREST services: ours ─────────────────────────────────────────────────

  registry:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: registry
    ports: ["${REGISTRY_PORT:-59001}:8080"]

  definitions:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: definitions
    ports: ["${DEFINITIONS_PORT:-59002}:8080"]

  evidence:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: evidence
    ports: ["${EVIDENCE_PORT:-59003}:8080"]

  confirmation:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: confirmation
    ports: ["${CONFIRMATION_PORT:-59004}:8080"]
    environment:
      <<: *crest-env
      NOTIFY_URL: http://notify:8080

  verification:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: verification
    ports: ["${VERIFICATION_PORT:-59005}:8080"]

  payments:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: payments
    ports: ["${PAYMENTS_PORT:-59006}:8080"]
    environment:
      <<: *crest-env
      RAIL_URL: http://mock-rail:8080

  notify:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: notify
    ports: ["${NOTIFY_PORT:-59007}:8080"]
    environment:
      <<: *crest-env
      SMS_URL: http://mock-sms:8080

volumes:
  pgdata:
  objectdata:
  dedipgdata:
