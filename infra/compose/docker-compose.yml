# CREST local stack.
#
# Two halves: substrate we run but do not build (Postgres, object store, DeDi,
# Inji, eSignet), and services we build. Start the substrate alone with
# `make substrate-up` — that is what the P0 spike (#1-#3) needs.
#
# Upstream tags were verified against Docker Hub on 2026-08-22 as part of the P0
# spike (#1, #3); see .env.example for what that audit changed and why.
#
# Host ports are deliberately in the 5xxxx range and overridable: developers
# routinely already run Postgres on 5432, and a stack that refuses to start on a
# colleague's laptop gets abandoned rather than debugged.

name: crest

x-service: &crest-service
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile.service
  restart: unless-stopped
  environment: &crest-env
    CREST_ENV: local
    LOG_LEVEL: debug
    ADDR: ":8080"
    DATABASE_URL: postgres://crest:crest@postgres:5432/crest?sslmode=disable
    # The registry substrate (#20). Empty by default, which selects the
    # Postgres fallback: the DeDi node lives in the `substrate` profile and
    # needs publisher keys generated from a checkout (`make dedi-keys`), so a
    # plain `make test-e2e` must not require one. Set DEDI_URL and
    # DEDI_PUBLISHER_KEY together to run against the node — a URL with no key
    # is refused at start-up rather than downgraded silently, because a
    # deployment that meant to publish to a log and quietly did not is the
    # worst of the three states.
    DEDI_URL: "${DEDI_URL:-}"
    DEDI_NAMESPACE: "${DEDI_NAMESPACE:-crest}"
    DEDI_KEY_ID: "${DEDI_KEY_ID:-crest}"
    DEDI_PUBLISHER_KEY: "${DEDI_PUBLISHER_KEY:-}"

    # Who this deployment is (#70). Required outside local, and deliberately
    # without a default there: a deployment that invented its own identifier
    # would publish under a name nobody agreed to, and two that both defaulted
    # would collide in one namespace — which on an append-only log is not a
    # mistake anyone can take back.
    CREST_INSTANCE_ID: "${CREST_INSTANCE_ID:-crest:instance:local}"
    CREST_INSTANCE_NAME: "${CREST_INSTANCE_NAME:-Local development deployment}"
    CREST_OPERATOR_PARTY_ID: "${CREST_OPERATOR_PARTY_ID:-did:crest:party:01JCREST000000000000000RGN}"

    # Who approves a registering organisation. Configuration, not
    # infrastructure: a pilot with three partner NGOs and a national rollout
    # would reasonably disagree, and both are still CREST (the layering test).
    REGISTRY_ORG_APPROVAL: "${REGISTRY_ORG_APPROVAL:-manual}"

    CERTIFY_URL: http://inji-certify:8090

    # The object store holding consent artefacts. Credentials come from the
    # environment in every deployment including this one — the values in
    # .env.example are local-only and the file says so.
    S3_ENDPOINT: http://objectstore:8333
    S3_BUCKET: "${S3_BUCKET:-crest-artefacts}"
    S3_ACCESS_KEY: "${S3_ACCESS_KEY:-crest-local}"
    S3_SECRET_KEY: "${S3_SECRET_KEY:-crest-local-secret}"

    # Services find each other by name. There is no service discovery and there
    # should not be one yet: seven names in a compose file is a dependency graph
    # a person can read, and the day it stops being readable is the day it needs
    # something better.
    # The four member names all resolve to the one core service (#150); the
    # env names survive so nothing that reads them has to know about the
    # merge. There is no NOTIFY_URL: notifications are dropped, not mocked.
    PARTIES_URL: http://core:8080
    DEFINITIONS_URL: http://core:8080
    EVIDENCE_URL: http://core:8080
    # The confirmation window lives in the payments application (#129).
    CONFIRMATION_URL: http://payments:8080
    PAYMENTS_URL: http://payments:8080
    VERIFICATION_URL: http://core:8080
    RAIL_URL: http://mock-rail:8080

    # Who authenticates a caller (#89, §4.1). The local stack points at
    # mock-oidc, which mints real ES256 tokens against a real JWKS — the
    # services verify them with the same code they run in production, because
    # a development bypass is a production hole with the switch turned off.
    #
    # A deployment points these at eSignet instead. The JWKS URL is given
    # rather than discovered: #64 is open against eSignet serving URLs its own
    # discovery document advertises, and a service that will not start because
    # discovery is wrong is worse than one that was told the answer. eSignet's
    # is http://esignet:8088/v1/esignet/oauth/.well-known/jwks.json.
    CREST_OIDC_ISSUER: "${CREST_OIDC_ISSUER:-http://mock-oidc:8080}"
    CREST_OIDC_JWKS_URL: "${CREST_OIDC_JWKS_URL:-http://mock-oidc:8080/.well-known/jwks.json}"
    CREST_OIDC_AUDIENCE: "${CREST_OIDC_AUDIENCE:-crest}"
    # This deployment's own salt over the provider's pairwise subject. #52 and
    # #63 are open against eSignet's: it partitions by relying party rather
    # than by client, and derives without a per-deployment salt, so two
    # deployments reading the same eSignet could correlate their workers by
    # subject. Salting here means they cannot, whatever eSignet does. Local
    # value is not pretending to be a secret; a real deployment sets its own
    # and never rotates it without re-binding every party.
    CREST_SUBJECT_SALT: "${CREST_SUBJECT_SALT:-local-development-subject-salt-not-for-any-real-deployment}"
    # Short because mock-oidc mints a fresh signing key every time it starts,
    # so a restart must not leave the services rejecting valid tokens for a
    # quarter of an hour. A deployment against a real provider leaves these at
    # their defaults.
    # Extra token issuers beside the primary (issuer|jwks|audience, comma-
    # separated). Locally this is how the eSignet substrate's tokens are
    # accepted by CREST — the wallet's self-bind (#155 phase C) needs the
    # binding's token verifiable here.
    CREST_OIDC_EXTRA_PROVIDERS: "${CREST_OIDC_EXTRA_PROVIDERS:-}"
    # The eSignet login surface (#155 phase A). Off by default locally —
    # ESIGNET_URL unset means the surface is not served and the doors show
    # the dev login. Set all four to run the real surface against the local
    # substrate (the key comes from `go run ./tools/esignet`).
    ESIGNET_URL: "${ESIGNET_URL:-}"
    ESIGNET_UI_URL: "${ESIGNET_UI_URL:-}"
    ESIGNET_CLIENT_KEY: "${ESIGNET_CLIENT_KEY:-}"
    CREST_AUTH_DOORS: "${CREST_AUTH_DOORS:-}"
    CREST_OIDC_JWKS_CACHE: "${CREST_OIDC_JWKS_CACHE:-30s}"
    CREST_OIDC_JWKS_MIN_REFRESH: "${CREST_OIDC_JWKS_MIN_REFRESH:-5s}"
    # The dev web app's origin (apps/web, served on 59100). CORS is off unless
    # a deployment names its origins - never a wildcard (#102).
    CREST_CORS_ORIGINS: "${CREST_CORS_ORIGINS:-http://localhost:59100,http://localhost:59110}"

    # The seven-day window, and a clock the harness can move through it. Both
    # are refused in production — see pkg/service.chooseClock for why a
    # driveable clock in a live deployment is a way to close a worker's window
    # early on them.
    CONFIRMATION_WINDOW: "${CONFIRMATION_WINDOW:-168h}"
    CLOCK_DRIVEABLE: "${CLOCK_DRIVEABLE:-true}"
    CLOCK_START: "${CLOCK_START:-2026-03-01T08:00:00Z}"

    # The scheduled auto-confirm sweep, off by default *here only*. Every
    # scenario that tests the T=7 exit advances the clock and then asks for the
    # sweep, and a background sweeper would have already taken the window —
    # turning a real assertion into a race. A deployment runs the default
    # (every minute), because there nobody is going to post to /v1/sweep.
    # `make test-e2e-sweep` brings this stack up with it on, to prove the loop
    # is actually wired.
    SWEEP_EVERY: "${SWEEP_EVERY:-0}"

    # Deployment secrets, with local values that are not pretending to be
    # secrets. A real deployment sets all three; key custody is G1 #7.
    NATIONAL_ID_SALT: "${NATIONAL_ID_SALT:-local-development-salt-not-for-any-real-deployment}"
    NATIONAL_ID_SALT_REF: "${NATIONAL_ID_SALT_REF:-local-1}"
    ISSUER_ID: "${ISSUER_ID:-did:crest:issuer:local}"
    STATUS_LIST_URL: "${STATUS_LIST_URL:-http://core:8080/v1/status-list}"
  depends_on:
    postgres:
      condition: service_healthy

x-healthcheck: &crest-healthcheck
  healthcheck:
    test: ["CMD", "/crest-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  # ── Substrate: run, don't build ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crest
      POSTGRES_PASSWORD: crest
      POSTGRES_DB: crest
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crest -d crest"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for consent artefacts, including voice consent
  # recordings from assisted enrolment (#24). SeaweedFS rather than MinIO — see
  # docs/COMPONENTS.md. Swappable: pkg/store speaks the S3 API, not this server.
  objectstore:
    image: chrislusf/seaweedfs:3.80
    #
    # -s3.config supplies an identity, which makes the server REFUSE anonymous
    # requests. Without it SeaweedFS serves an open bucket, and a signing bug
    # in pkg/store would pass every test by being ignored — while a deployment
    # that copied this file would hold workers' consent recordings in a store
    # anyone who can reach it can read.
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64"
    ports: ["${S3_PORT:-58333}:8333"]
    volumes:
      - objectdata:/data
      - ./objectstore/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # 403 is the healthy answer now that anonymous access is refused, so the
      # check is "does it reply at all", not "does it serve me a listing". The
      # previous check treated a correctly secured server as a broken one.
      # Matches any status line, because a 403 means the server is up and
      # correctly refusing anonymous access. The first version of this check
      # demanded a readable listing, and so treated a properly secured store as
      # broken.
      #
      # 127.0.0.1 rather than localhost, which is the part that took three CI
      # runs to find. SeaweedFS binds IPv4; where localhost resolves to ::1
      # first — as it does on the CI runner and not on this laptop — busybox
      # wget never reaches it, and the check fails forty times against a server
      # whose own logs say "Start Seaweed S3 API Server". Two other hypotheses
      # were tested and disproved first: that the amd64 busybox rejects a flag
      # the arm64 one accepts, and that the server was simply slow to start.
      # Neither was true, and the CI log timeline is what ruled the second out.
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1'"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 40

  # DeDi-node, from the published multi-arch image. `make dedi-image` still
  # exists for running an unreleased build from a checkout.
  #
  # It keeps its own Postgres. The node owns a transparency log whose leaves are
  # signed and whose checkpoints must never be rolled back — sharing a database
  # with CREST would make a CREST migration able to rewrite registry history.
  dedi-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dedi
      POSTGRES_PASSWORD: dedi
      POSTGRES_DB: dedi
    volumes:
      - dedipgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dedi -d dedi"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["substrate", "full"]

  dedi:
    image: ${DEDI_IMAGE:-flywheelai/dedi-node:sha-2d020a3}
    ports: ["${DEDI_PORT:-58081}:8080"]
    environment:
      DEDI_DB_URL: postgres://dedi:dedi@dedi-postgres:5432/dedi?sslmode=disable
      DEDI_KEY_FILE: /keys/dedid.key
      DEDI_ORIGIN: ${DEDI_ORIGIN:-crest.local/log}
      DEDI_LISTEN: ":8080"
      # Writes are signed with a publisher key regardless; this names which key
      # may write to which namespace. Generated by `make dedi-keys`.
      DEDI_PUBLISHER_KEYS: ${DEDI_PUBLISHER_KEYS:-}
      DEDI_WILDCARD_NAMESPACES: ${DEDI_NAMESPACE:-crest.local}
    volumes:
      - ./dedi-keys:/keys:ro
    depends_on:
      dedi-postgres:
        condition: service_healthy
    profiles: ["substrate", "full"]

  # Certify, rebuilt with CREST's configuration baked in — Railway has no bind
  # mounts, and an image that is configured differently there is not the image
  # this stack proves. See infra/compose/Dockerfile.certify.
  inji-certify:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.certify
      args:
        INJI_CERTIFY_IMAGE: ${INJI_CERTIFY_IMAGE:-mosipid/inji-certify-with-plugins:0.14.0}
    ports: ["${CERTIFY_PORT:-58090}:8090"]
    environment:
      # did:web maps host and path. Certify serves its own DID document at
      # ${CERTIFY_DOMAIN_URL}/v1/certify/.well-known/did.json, so the issuer
      # resolves from the deployment rather than from a GitHub Pages repository
      # somebody has to remember to update. The `%3A` is a literal colon: a
      # did:web with a port must percent-encode it.
      CERTIFY_DOMAIN_URL: http://localhost:${CERTIFY_PORT:-58090}
      CERTIFY_DID_URL: did:web:localhost%3A${CERTIFY_PORT:-58090}:v1:certify
      # Three values, not one, because they answer different questions: what
      # the token's `iss` literally says, where Certify can fetch the signing
      # keys, and what audience it will accept. Locally the first is the URL the
      # browser used and the second is the compose network name.
      CERTIFY_AUTHZ_URL: http://localhost:${ESIGNET_PORT:-58088}
      CERTIFY_AUTHZ_JWKS: http://esignet:8088/v1/esignet/oauth/.well-known/jwks.json
      CERTIFY_DB_HOST: postgres
      CERTIFY_DB_USER: ${POSTGRES_USER:-crest}
      CERTIFY_DB_PASSWORD: ${POSTGRES_PASSWORD:-crest}
      CERTIFY_KEYSTORE_PASSWORD: ${CERTIFY_KEYSTORE_PASSWORD:-local}
      # The live data provider (#155 phase C): issuance reads confirmed-claim
      # facts from CREST over the compose network. Set
      # CERTIFY_DATA_PROVIDER=MockCSVDataProviderPlugin to run the substrate
      # with no CREST services, which is spike #1's configuration.
      CERTIFY_DATA_PROVIDER: ${CERTIFY_DATA_PROVIDER:-CrestDataProviderPlugin}
      CERTIFY_CREST_DATA_URL: http://core:8080
      CERTIFY_CREST_ISSUER: ${CERTIFY_CREST_ISSUER:-http://localhost:${ESIGNET_PORT:-58088}}
    volumes:
      # The issuer key lives here. A named volume rather than the container
      # filesystem because `docker compose up --build` would otherwise mint a
      # new issuer key and silently invalidate every credential already issued —
      # the key_alias rows in the database point into this file.
      - certifykeys:/home/inji/CERTIFY_PKCS12
      # The work-event fixture, keyed by a pairwise subject this deployment
      # minted. Separate from the keystore volume because one is a secret and
      # the other is a fixture, and they have different reasons to be wiped.
      - certifydata:/home/inji/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["substrate", "full"]

  # Inji Verify is two containers upstream, not one (P0 finding, #1). The tag we
  # had guessed for a single `inji-verify` image does not exist.
  inji-verify-service:
    image: ${INJI_VERIFY_SERVICE_IMAGE:-mosipid/inji-verify-service:0.16.0}
    ports: ["${VERIFY_SERVICE_PORT:-58091}:8080"]
    environment:
      # The same variables the deployed service runs on (docs/DEPLOYMENT.md);
      # without them the datasource URL's placeholders reach the JDBC driver
      # literally and every request 500s while the container looks healthy.
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: inji_verify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: ${POSTGRES_USER:-crest}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-crest}
      active_profile_env: default
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["substrate", "full"]

  inji-verify-ui:
    image: ${INJI_VERIFY_UI_IMAGE:-mosipid/inji-verify-ui:0.16.0}
    # amd64 only upstream — pinned so the platform mismatch is a stated choice
    # rather than a warning nobody reads.
    platform: linux/amd64
    ports: ["${VERIFY_UI_PORT:-58092}:3000"]
    depends_on: [inji-verify-service]
    profiles: ["substrate", "full"]

  # The browser wallet. #1 needs somewhere to hold a credential, and the mobile
  # wallet ships through app stores rather than as an image.
  inji-web:
    image: ${INJI_WEB_IMAGE:-mosipid/inji-web:0.15.0}
    ports: ["${INJI_WEB_PORT:-58093}:3000"]
    profiles: ["full"]

  # Both eSignet images are rebuilt with our own entrypoint. The stock one runs
  # an HSM-client installer that cannot succeed here and leaves the container
  # looping — see infra/compose/esignet-start.sh and docs/p0-findings.md (C7).
  esignet:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.esignet
      args:
        ESIGNET_IMAGE: ${ESIGNET_IMAGE:-mosipid/esignet-with-plugins:1.8.0}
    ports: ["${ESIGNET_PORT:-58088}:8088"]
    environment:
      # Not SPRING_PROFILES_ACTIVE: the image passes this one to the JVM itself.
      active_profile_env: default,local
      plugin_name_env: esignet-mock-plugin.jar
      MOSIP_ESIGNET_DATABASE_URL: jdbc:postgresql://postgres:5432/mosip_esignet?currentSchema=esignet
      MOSIP_ESIGNET_DATABASE_USERNAME: ${POSTGRES_USER:-crest}
      MOSIP_ESIGNET_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-crest}
      MOSIP_ESIGNET_MOCK_DOMAIN_URL: http://esignet-mock-identity:8082
      MOSIP_ESIGNET_INTEGRATION_KEY_BINDER: MockKeyBindingWrapperService
      # The credential scope Certify advertises. eSignet will not mint an access
      # token for a scope it has never heard of, and the resource mapping is
      # what puts Certify's credential endpoint in the token's audience —
      # without it the token is valid and Certify still rejects it, which reads
      # like an authentication bug rather than a configuration gap.
      MOSIP_ESIGNET_SUPPORTED_CREDENTIAL_SCOPES: "{'crest_work_event_vc_ldp'}"
      MOSIP_ESIGNET_CREDENTIAL_SCOPE_RESOURCE_MAPPING: "{'crest_work_event_vc_ldp': 'http://localhost:${CERTIFY_PORT:-58090}/v1/certify/issuance/credential'}"
      MOSIP_ESIGNET_HOST: localhost:${ESIGNET_PORT:-58088}
      MOSIP_ESIGNET_DOMAIN_URL: http://localhost:${ESIGNET_PORT:-58088}
      SPRING_CACHE_TYPE: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_ENABLED: "false"
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      # FINDING (#4): the `local` profile writes its PKCS12 keystore into the
      # container's working directory, while the key aliases that point into it
      # live in the database. Recreate the container without recreating the
      # database — an ordinary redeploy — and eSignet refuses to start with
      # `No such alias`, because the aliases outlived the keys. Pinning the
      # keystore to a volume is what makes a redeploy survivable.
      MOSIP_KERNEL_KEYMANAGER_HSM_CONFIG_PATH: /home/mosip/keys/esignet_local.p12
    volumes:
      - esignetkeys:/home/mosip/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["substrate", "full"]

  esignet-mock-identity:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.mock-identity
      args:
        ESIGNET_MOCK_IMAGE: ${ESIGNET_MOCK_IMAGE:-mosipid/mock-identity-system:0.13.0}
    ports: ["${ESIGNET_MOCK_PORT:-58082}:8082"]
    environment:
      active_profile_env: default,local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-crest}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-crest}
      MOSIP_MOCK_IDA_KYC_TRANSACTION_TIMEOUT_SECS: "900"
      MOSIP_ESIGNET_HOST: localhost:${ESIGNET_PORT:-58088}
      redis.host: redis
      redis.port: "6379"
      # Same FINDING (#4) as eSignet above: keymanager's aliases live in the
      # database while the `local` profile's PKCS12 lives on the container
      # filesystem. Without the volume, recreating this container strands the
      # aliases and the service refuses to start with `No such alias` — which
      # is exactly what took production down when Railway recycled it.
      MOSIP_KERNEL_KEYMANAGER_HSM_CONFIG_PATH: /home/mosip/keys/mock_local.p12
    volumes:
      - mockidentitykeys:/home/mosip/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["substrate", "full"]

  # eSignet caches sessions here. Only the substrate profile needs it; CREST's
  # own services do not use Redis and should not learn to.
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports: ["${REDIS_PORT:-56379}:6379"]
    profiles: ["substrate", "full"]

  # ── Mocks: ours, so the stack is usable without paid externals ───────────

  mock-rail:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.tool
      args:
        TOOL: rail
    ports: ["${MOCK_RAIL_PORT:-59102}:8080"]
    environment:
      ADDR: ":8080"

  # The local identity provider (#89). Stands in for eSignet, which is in the
  # `substrate` profile: a plain `make test-e2e` must be able to prove that an
  # unproven caller is refused without booting Redis, a mock identity system
  # and eSignet's three open findings alongside it. tools/mocks/oidc says why
  # this is a real issuer rather than a bypass.
  mock-oidc:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.tool
      args:
        TOOL: oidc
    ports: ["${MOCK_OIDC_PORT:-59103}:8080"]
    environment:
      ADDR: ":8080"
      OIDC_ISSUER: "${CREST_OIDC_ISSUER:-http://mock-oidc:8080}"
      # Dev-only: lets the browser app derive its salted subject for
      # self-proof binding (GET /dev/pairwise). Same value as the services'.
      CREST_SUBJECT_SALT: "${CREST_SUBJECT_SALT:-local-development-subject-salt-not-for-any-real-deployment}"

  # The Actor Journeys web app (apps/web): static files, no build step. The
  # services admit its origin via CREST_CORS_ORIGINS; login is the mock OIDC
  # issuer in dev.
  web:
    image: nginx:1.27-alpine
    volumes:
      - ../../apps/web:/usr/share/nginx/html:ro
    ports: ["${WEB_PORT:-59100}:80"]

  # The journey apps (frontend/ workspace, assembled by make apps-build):
  # the reference design rebuilt as separate products, one door. The docroot
  # is assembled by `make apps-build` (frontend/scripts/assemble.mjs): the
  # rebuilt doors from their Vite dist, the rest straight from apps/.
  apps:
    image: nginx:1.27-alpine
    volumes:
      - ../../frontend/dist-site:/usr/share/nginx/html:ro
    ports: ["${APPS_PORT:-59110}:80"]

  # ── CREST services: ours ─────────────────────────────────────────────────

  # One infrastructure service (#150): parties, definitions, evidence and
  # verification are member packages of the core binary — schemas, outboxes
  # and route families intact, deployment shape merged. It stores consent
  # artefacts (#24) so it needs the object store, and it signs credentials
  # (#137) so it needs Vault (#130); refusing to start without either is the
  # point.
  core:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: core
    ports: ["${CORE_PORT:-59000}:8080"]
    environment:
      <<: *crest-env
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: crest-dev-root
      VAULT_SECRET_PATH: secret/data/crest/issuer
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      vault:
        condition: service_healthy

  # Key custody (#130): the issuance seed lives in Vault, and verification —
  # the one service that signs since #137 — fetches it at startup. Dev mode
  # locally (in-memory, root token fixed) so a clean stack is reproducible;
  # the deployed Vault runs Raft storage on a volume with operator-held
  # unseal keys, which is the point.
  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    entrypoint: >
      sh -c 'vault server -dev -dev-root-token-id=crest-dev-root
      -dev-listen-address=0.0.0.0:8200 &
      sleep 2 &&
      VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=crest-dev-root
      vault kv put secret/crest/issuer
      issuer_seed="${ISSUER_SEED:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}" &&
      wait'
    ports: ["${VAULT_PORT:-59200}:8200"]
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=crest-dev-root vault kv get -field=issuer_seed secret/crest/issuer"]
      interval: 2s
      timeout: 3s
      retries: 30

  payments:
    <<: [*crest-service, *crest-healthcheck]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args:
        SERVICE: payments
    ports: ["${PAYMENTS_PORT:-59006}:8080"]

volumes:
  pgdata:
  certifykeys:
  certifydata:
  esignetkeys:
  mockidentitykeys:
  objectdata:
  dedipgdata:
