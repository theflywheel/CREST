# Inji Verify's UI, vendored from the 0.16.0 image with one change: the upstream
# it proxies to.
#
# Upstream hardcodes `verify-service`, a compose service name. On Railway the
# verifier is a separate service reachable over the project's private network,
# and nginx refuses to start at all when it cannot resolve an upstream at
# config-load time — the container crash-loops with `host not found in
# upstream` and never serves the UI.
#
# Railway's private network is IPv6-only, so the verifier is started with
# SERVER_ADDRESS=:: — a Spring service bound to 0.0.0.0 is simply unreachable
# there, and the symptom is a timeout rather than anything naming the cause.
server {
    listen 8000;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location /v1/verify {
        proxy_pass http://crest-verify.railway.internal:8080/v1/verify;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
        proxy_set_header   Connection close;
    }

    location /.well-known/did.json {
        proxy_pass http://crest-verify.railway.internal:8080/v1/verify/.well-known/did.json;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
        proxy_set_header   Connection close;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
