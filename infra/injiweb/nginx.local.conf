# Local-compose variant of nginx.conf: identical except the /v1/mimoto/
# upstream, which points at the compose-network Mimoto instead of the Railway
# public hostname. Compose private DNS resolves service names at nginx
# config-load time as long as the service exists, so the Railway public-DNS
# workaround is unnecessary here.
server {
    listen 3004;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.json$ {
        root /home/mosip;
        autoindex on;
    }

    location ~* /.*-template\.html$ {
          root /home/mosip;
          try_files $uri =404;
    }

    location /v1/mimoto/ {
        proxy_pass http://mimoto:8099/v1/mimoto/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
