# Inji Web's nginx, vendored from the 0.15.0 image with one change: the upstream
# it proxies to.
#
# Upstream hardcodes `mimoto-service`, a compose service name. nginx refuses to
# start when it cannot resolve an upstream at config-load time, so on Railway
# the container crash-loops with `host not found in upstream` and never serves
# a page — the same failure Inji Verify's UI has, for the same reason.
#
# It proxies to Mimoto's PUBLIC name rather than its private one, which costs a
# hop and buys the only thing that matters here: Mimoto fetches its issuer
# config from this server at start-up, and this server resolves Mimoto at
# start-up. Over private DNS, which only answers for a running service, that is
# a deadlock neither can leave. Public DNS always answers.
server {
    listen 3004;
    # Serve static files, if any
    # Default location for normal static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Serve files from /home/mosip with autoindex enabled
    location ~* \.json$ {
        root /home/mosip;
        autoindex on;
    }

  # Serve any HTML file ending with -template.html from /home/mosip and return 404 if not found
    location ~* /.*-template\.html$ {
          root /home/mosip;  # Serve from /home/mosip specifically for files matching *-template.html
          try_files $uri =404;  # Check if file exists, return 404 if not
    }
    # Proxy API requests to mimoto-service
    location /v1/mimoto/ {
        proxy_pass https://crest-mimoto-production.up.railway.app/v1/mimoto/;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        # Handle OPTIONS requests (for pre-flight checks)
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
