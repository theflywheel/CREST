# Inji Web's nginx, vendored from the 0.15.0 image with one change: the upstream
# it proxies to.
#
# Upstream hardcodes `mimoto-service`, a compose service name. nginx refuses to
# start when it cannot resolve an upstream at config-load time, so on Railway
# the container crash-loops with `host not found in upstream` and never serves
# a page — the same failure Inji Verify's UI has, for the same reason.
#
# It used to proxy to Mimoto's PUBLIC name to dodge that start-up resolution
# (Mimoto fetches its issuer config from this server at start-up, and this
# server resolved Mimoto at start-up — over private DNS, which only answers for
# a running service, that was a deadlock). On the deployed fleet the public hop
# never answered at all: every /v1/mimoto/ request through this proxy hung until
# the client gave up, while Mimoto answered its public name directly
# (2026-09-10, walking #66's "held" leg). The fix is the one the doors already
# use (infra/railway/nginx.conf.template, docs/DEPLOYMENT.md "nginx must be told
# to re-resolve"): a resolver plus a VARIABLE upstream, so the private name is
# resolved per request rather than at config load — no start-up deadlock, no
# public hop, and a redeployed Mimoto on a new private address is found within
# ten seconds. Once proxy_pass holds a variable, nginx stops substituting the
# matched prefix, so $request_uri is passed explicitly.
resolver [fd12::10] valid=10s;

# Railway's edge terminates TLS and sets X-Forwarded-Proto; a request that
# arrives without one (local compose, a health probe) falls back to this hop's
# own scheme rather than forwarding an empty header.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 3004;
    listen [::]:3004;
    # Serve static files, if any
    # Default location for normal static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Serve files from /home/mosip with autoindex enabled
    location ~* \.json$ {
        root /home/mosip;
        autoindex on;
    }

  # Serve any HTML file ending with -template.html from /home/mosip and return 404 if not found
    location ~* /.*-template\.html$ {
          root /home/mosip;  # Serve from /home/mosip specifically for files matching *-template.html
          try_files $uri =404;  # Check if file exists, return 404 if not
    }
    # Proxy API requests to Mimoto over Railway's private network
    location /v1/mimoto/ {
        set $mimoto http://crest-mimoto.railway.internal:8099;
        proxy_pass $mimoto$request_uri;
        # The wallet's OWN host, not Mimoto's: Spring decides whether a
        # request is cross-origin by comparing the browser's Origin with the
        # Host it received, and refuses "Invalid CORS request" (403, before any
        # handler runs) when they differ. Passing the upstream's private name
        # here made every browser POST from the wallet look foreign to Mimoto.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The hop to Mimoto is plain HTTP on the private network while the
        # browser's Origin is https. Spring only reconciles the two when it is
        # told to trust forwarded headers (SERVER_FORWARD_HEADERS_STRATEGY=
        # framework on crest-mimoto, docs/DEPLOYMENT.md) and the proxy sends
        # them; Railway's edge already sets X-Forwarded-Proto to https, so
        # pass it through rather than overwrite it with this hop's scheme.
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        # Handle OPTIONS requests (for pre-flight checks)
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
