# The Certify door (#203, P0 C11/C12/C15).
#
# Inji Certify advertises credential_issuer as the bare host but serves its
# metadata under the servlet path (/v1/certify/.well-known/...). A conformant
# OpenID4VCI client appends /.well-known/openid-credential-issuer to the
# advertised issuer and gets a 404; only Mimoto works, because CREST wrote the
# servlet path into its credential_issuer_host. This proxy serves the metadata
# at the advertised issuer and passes everything else through, so any wallet —
# not just Inji's — can discover the issuer. Fronting Certify the way
# crest-esignet-ui fronts eSignet. See docs/p0-findings.md.
pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 1024; }
http {
  # Written at start-up from the container's own resolv.conf (see
  # certify-door-start.sh): a redeployed Certify comes back on a new private
  # address, and a literal upstream resolved once at config load would keep
  # dialling the old one. The upstream is a variable for the same reason.
  include /tmp/resolver.conf;
  include /tmp/upstream.conf;

  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  server {
    listen 8080;
    listen [::]:8080;
    server_tokens off;

    # The metadata a wallet discovers, served at the advertised issuer. Each
    # is proxied to the servlet-path URL Certify actually answers. A variable
    # proxy_pass carrying a URI is sent exactly as written — no prefix rewrite.
    location = /.well-known/openid-credential-issuer {
      proxy_pass $certify/v1/certify/.well-known/openid-credential-issuer;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-Host $host;
    }
    location = /.well-known/oauth-authorization-server {
      proxy_pass $certify/v1/certify/.well-known/oauth-authorization-server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-Host $host;
    }
    # The issuer's did:web and JWKS resolve at the servlet path already
    # (did:web:...:v1:certify:.well-known), and are left there; these root
    # aliases are a convenience for a client that looks for them at the host.
    location = /.well-known/did.json {
      proxy_pass $certify/v1/certify/.well-known/did.json;
      proxy_set_header Host $host;
    }
    location = /.well-known/jwks.json {
      proxy_pass $certify/v1/certify/.well-known/jwks.json;
      proxy_set_header Host $host;
    }

    # Everything else — including /v1/certify/* (issuance, the did document a
    # credential's issuer resolves to) — passes straight through.
    location / {
      proxy_pass $certify$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
