# Certify's base configuration, vendored from inji-certify v0.14.0
# (docker-compose/docker-compose-injistack/config/certify-default.properties).
#
# Vendored rather than mounted from upstream so that "what is this deployment
# configured to do" has one answer in this repository. Changes from upstream are
# marked CREST: and are confined to four things - the database, the
# authorization server, the domain URL, and the keystore location. Everything
# else is upstream's, including the key policy and cache names, because a
# divergence there is a maintenance cost with no CREST reason behind it.
#
# Every CREST: value comes from the environment so that one image serves both
# the compose stack and Railway. A properties file with a hostname baked into it
# is a file that gets edited during a deploy, and an edit during a deploy is not
# reviewable.
#
# Re-vendoring: diff against the upstream file at the tag in .env.example
# (INJI_CERTIFY_IMAGE) and re-apply the CREST: lines.

# This Source Code Form is subject to the terms of the Mozilla Public
# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.

## Application Name
spring.application.name=certify
spring.cloud.config.uri=http://localhost:8888

server.port=8090
server.servlet.path=/v1/certify

openapi.info.title=Certify Service
openapi.info.description=Rest Endpoints for operations related to certify
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
mosip.certify.domain.url=${CERTIFY_DOMAIN_URL:http://certify:8090}
# CREST: was http://certify:${server.port}. did:web resolves from this, so it
# and mosip.certify.data-provider-plugin.did-url must move together.
openapi.service.server.url=${mosip.certify.domain.url}${server.servlet.path}
openapi.service.server.description=Certify Service
springdoc.swagger-ui.disable-swagger-default-url=true
spring.mvc.servlet.path=${server.servlet.path}

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.main.allow-bean-definition-overriding=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER



## -------------------------------------- Authentication & Authorization -----------------------------------------------

mosip.certify.security.auth.post-urls={}
mosip.certify.security.auth.put-urls={}
mosip.certify.security.auth.get-urls={}

mosip.certify.security.ignore-csrf-urls=**/actuator/**,/favicon.ico,**/error,\
  **/swagger-ui/**,**/v3/api-docs/**,**/issuance/**,**/system-info/**,**/credential-configurations/**,\
  **/.well-known/**,**/ledger-search/**,**/credentials/**,**/oauth/**,**/pre-authorized-data/**,**/credential-offer-data/**

mosip.certify.security.ignore-auth-urls=**/actuator/**,**/error,**/swagger-ui/**,\
  **/v3/api-docs/**, **/issuance/**,**/rendering-template/**,**/system-info/**,**/credential-configurations/**,\
  **/.well-known/**,**/ledger-search/**,**/credentials/**,**/oauth/**,**/pre-authorized-data/**,**/credential-offer-data/**

# This property specifies URL patterns for which CORS (Cross-Origin Resource Sharing) is enabled for HTTP GET requests. It allows the application to accept cross-origin GET requests on the specified endpoints, improving security and flexibility for frontend integrations.
# For example, /rendering-template/** enables CORS for all GET requests matching this pattern.
mosip.certify.security.cors-enabled-get-method-urls=/rendering-template/**


## ------------------------------------------ Discovery openid-configuration -------------------------------------------
mosip.certify.discovery.issuer-id=${mosip.certify.domain.url}${server.servlet.path}
# CREST: our own eSignet, not the MOSIP collab sandbox. Certify trusts this
# server to have authenticated the worker; pointing it at a sandbox means a
# credential is only as good as somebody else's demo instance.
mosip.certify.authorization.url=${CERTIFY_AUTHZ_URL:http://esignet:8088}

##--------------change this later---------------------------------
mosip.certify.supported.jwt-proof-alg={'RS256','PS256', 'ES256', 'Ed25519'}
mosip.certify.plugin-mode=DataProvider


##----- These are reference to the oauth resource server providing jwk----------------------------------##
mosip.certify.cnonce-expire-seconds=40

mosip.certify.identifier=${mosip.certify.domain.url}
mosip.certify.authn.filter-urls={ '${server.servlet.path}/issuance/credential', '${server.servlet.path}/issuance/vd11/credential', '${server.servlet.path}/issuance/vd12/credential' }
# CREST: the token's `iss` verbatim. eSignet issues tokens with `iss` set to
# its domain URL with no path - NOT ${authz}/v1/esignet, which is what upstream
# derives and what makes Certify answer a flat 401.
mosip.certify.authn.issuer-uri=${CERTIFY_AUTHZ_ISSUER:${mosip.certify.authorization.url}}
# CREST: separately settable from the issuer, because they answer different
# questions - the issuer is a string compared against the token, the JWKS is a
# URL Certify has to fetch. Locally those differ: the token says
# `http://localhost:58088` (what the browser reached) while Certify must fetch
# over the compose network at `http://esignet:8088`. Deployed they are the same.
mosip.certify.authn.jwk-set-uri=${CERTIFY_AUTHZ_JWKS:${mosip.certify.authorization.url}/v1/esignet/oauth/.well-known/jwks.json}
# CREST: the audience eSignet puts in the token comes from its own
# credential.scope-resource-mapping, so this value and that one must agree
# exactly. They are configured in two different services, which is precisely
# why a mismatch surfaces as a 401 rather than as a configuration error.
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential' }

## ---------------------------------------- Actuator Property --------------------------------------------------------
management.endpoint.env.show-values=ALWAYS
management.endpoints.web.exposure.include=*

#------------------------------------ Key-manager specific properties --------------------------------------------------
#Crypto asymmetric algorithm name
mosip.kernel.crypto.asymmetric-algorithm-name=RSA/ECB/OAEPWITHSHA-256ANDMGF1PADDING
#Crypto symmetric algorithm name
mosip.kernel.crypto.symmetric-algorithm-name=AES/GCM/NoPadding
#Keygenerator asymmetric algorithm name
mosip.kernel.keygenerator.asymmetric-algorithm-name=RSA
#Keygenerator symmetric algorithm name
mosip.kernel.keygenerator.symmetric-algorithm-name=AES
#Asymmetric algorithm key length
mosip.kernel.keygenerator.asymmetric-key-length=2048
#Symmetric algorithm key length
mosip.kernel.keygenerator.symmetric-key-length=256
#Encrypted data and encrypted symmetric key separator
mosip.kernel.data-key-splitter=#KEY_SPLITTER#
#GCM tag length
mosip.kernel.crypto.gcm-tag-length=128
#Hash algo name
mosip.kernel.crypto.hash-algorithm-name=PBKDF2WithHmacSHA512
#Symmtric key length used in hash
mosip.kernel.crypto.hash-symmetric-key-length=256
#No of iterations in hash
mosip.kernel.crypto.hash-iteration=100000
#Sign algo name
mosip.kernel.crypto.sign-algorithm-name=RS256
#Certificate Sign algo name
mosip.kernel.certificate.sign.algorithm=SHA256withRSA

# CREST: this p12 IS the issuer key. It is minted on first boot and the
# key_alias rows in the database point at aliases inside it, so a fresh keystore
# with an old database means every previously issued credential stops verifying.
# It must sit on a persistent volume - see docs/DEPLOYMENT.md.
mosip.kernel.keymanager.hsm.config-path=${CERTIFY_KEYSTORE_PATH:CERTIFY_PKCS12/local.p12}
mosip.kernel.keymanager.hsm.keystore-type=PKCS12
# CREST: a real deployment sets this
mosip.kernel.keymanager.hsm.keystore-pass=${CERTIFY_KEYSTORE_PASSWORD:local}

#Type of keystore, Supported Types: PKCS11, PKCS12, Offline, JCE
#mosip.kernel.keymanager.hsm.keystore-type=PKCS11
# For PKCS11 provide Path of config file.
# For PKCS12 keystore type provide the p12/pfx file path. P12 file will be created internally so provide only file path & file name.
# For Offline & JCE property can be left blank, specified value will be ignored.
#mosip.kernel.keymanager.hsm.config-path=/config/softhsm-application.conf
# Passkey of keystore for PKCS11, PKCS12
# For Offline & JCE proer can be left blank. JCE password use other JCE specific properties.
#mosip.kernel.keymanager.hsm.keystore-pass=${softhsm.certify.mock.security.pin}


mosip.kernel.keymanager.certificate.default.common-name=www.example.com
mosip.kernel.keymanager.certificate.default.organizational-unit=EXAMPLE-CENTER
mosip.kernel.keymanager.certificate.default.organization=IIITB
mosip.kernel.keymanager.certificate.default.location=BANGALORE
mosip.kernel.keymanager.certificate.default.state=KA
mosip.kernel.keymanager.certificate.default.country=IN

mosip.kernel.keymanager.softhsm.certificate.common-name=www.example.com
mosip.kernel.keymanager.softhsm.certificate.organizational-unit=Example Unit
mosip.kernel.keymanager.softhsm.certificate.organization=IIITB
mosip.kernel.keymanager.softhsm.certificate.country=IN

# Application Id for PMS master key.
mosip.kernel.partner.sign.masterkey.application.id=PMS
mosip.kernel.partner.allowed.domains=DEVICE

mosip.kernel.keymanager-service-validate-url=https://${mosip.hostname}/keymanager/validate
mosip.kernel.keymanager.jwtsign.validate.json=false
mosip.keymanager.dao.enabled=false
crypto.PrependThumbprint.enable=true

mosip.kernel.keymgr.hsm.health.check.enabled=true
mosip.kernel.keymgr.hsm.health.key.app-id=CERTIFY_SERVICE
mosip.kernel.keymgr.hsm.healthkey.ref-id=TRANSACTION_CACHE

mosip.kernel.keymgr.hsm.health.check.encrypt=true

mosip.certify.cache.security.secretkey.reference-id=TRANSACTION_CACHE

##----------------------------------------- Database properties --------------------------------------------------------

# CREST
mosip.certify.database.hostname=${CERTIFY_DB_HOST:postgres}
# CREST
mosip.certify.database.port=${CERTIFY_DB_PORT:5432}
# CREST
spring.datasource.url=jdbc:postgresql://${mosip.certify.database.hostname}:${mosip.certify.database.port}/${CERTIFY_DB_NAME:inji_certify}?currentSchema=certify&sslmode=${CERTIFY_DB_SSLMODE:disable}
