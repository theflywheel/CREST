# CREST's Certify profile: what a WorkEventCredential is and where its data
# comes from.
#
# Activated by `active_profile_env=default,crest`. Everything here is the
# use-case layer — the layering test (CLAUDE.md) puts credential shape in the
# infrastructure layer and the *source* of the data in configuration, and this
# file is deliberately all of the latter.

## ── Plugin ───────────────────────────────────────────────────────────────────
# DataProvider mode: the plugin returns facts and Certify builds, signs and
# status-lists the credential. VCIssuance mode would hand the whole signed
# credential over, which would put CREST's issuer key inside a plugin jar we do
# not build. DataProvider keeps the signing key in Certify's keymanager.
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.data-provider-plugin=MockCSVDataProviderPlugin

# #1 is explicitly "no CREST services involved" — a hand-authored credential,
# so the substrate is proven before anything of ours depends on it. The CSV is
# the hand-authoring. #16 replaces this with a plugin that reads confirmed
# claims from CREST, and the credential shape below should not change when it
# does; that is the point of proving the shape first.
# The lookup key is the access token's `sub` — the PAIRWISE SUBJECT eSignet
# minted for this relying party, not an identity number. That is not a detail:
# it means the evidence store is keyed by a value that is meaningless outside
# this deployment, which is the property that stops a work record being joined
# to a person across systems. #16's plugin must key on the same thing.
#
# The column is still called `individualId` because the plugin's CSV reader
# names it, not because it holds one.
mosip.certify.mock.data-provider.csv.identifier-column=individualId
mosip.certify.mock.data-provider.csv.data-columns=individualId,unitId,claimId,definitionRef,definitionVersion,activity,periodStart,periodEnd,outcomeValue,outcomeUnit,contextRef,sourceClass,captureMethod,adapterRef,receivedAt,sourceExposure,issuerOrg
# On a volume, not in the image: the subjects it is keyed by are minted by the
# deployment, so the file cannot be built at image-build time. The image ships
# a template at /home/inji/config/work_events.csv and the entrypoint seeds this
# path from it on first boot. See infra/certify/certify-start.sh.
mosip.certify.mock.data-provider.csv-registry-uri=${CERTIFY_WORK_EVENTS_CSV:/home/inji/data/work_events.csv}

mosip.certify.mock.vciplugin.verification-method=${mosip.certify.authn.jwk-set-uri}
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding

# The individual id reaches Certify from the authorization server and is used
# to look the work event up. It is not stored encrypted here because in this
# deployment it is a synthetic mock-identity value, never a national id — the
# rule that no raw national identifier comes to rest applies to CREST's own
# stores and to this one equally, and is why #16's plugin must key on the
# pairwise subject rather than on an identity number.
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true

## ── Issuer identity ──────────────────────────────────────────────────────────
# Certify serves its own DID document at ${domain}/v1/certify/.well-known/did.json,
# so the issuer DID resolves from the deployment rather than from a GitHub Pages
# repository somebody has to remember to update. did:web maps host+path, so this
# value and CERTIFY_DOMAIN_URL must move together.
mosip.certify.data-provider-plugin.did-url=${CERTIFY_DID_URL}
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://crest.theflywheel.in/credential/
mosip.certify.data-provider-plugin.rendering-template-id=

# eddsa-jcs-2022, not Ed25519Signature2020. Two reasons, one of them load-bearing:
# JCS canonicalises the JSON itself and never dereferences @context, so issuance
# does not depend on a context URL being reachable at signing time; and CREST's
# own signer (pkg/credential) already emits eddsa-jcs-2022, so a credential from
# Certify and a credential from CREST verify by the same code path. See #60 —
# the blueprint §5 still names the JSON-LD suite as the default and that is the
# disagreement, not this setting.
mosip.certify.status-list.signature-crypto-suite=eddsa-jcs-2022

mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'CREST',\
    'locale': 'en'\
  }\
}

# Indexed for ledger search. Deliberately not the worker: the ledger is a
# CREST-side index, and making it searchable by person would build the central
# credential register §3 says must not exist.
mosip.certify.indexed-mappings.definitionRef=$.definitionRef
mosip.certify.indexed-mappings.contextRef=$.contextRef
