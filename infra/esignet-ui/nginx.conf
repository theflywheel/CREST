# eSignet's login UI, fronting eSignet's API on one hostname.
#
# This is not cosmetic. eSignet's discovery document advertises
# `authorization_endpoint: https://<host>/authorize` and
# `jwks_uri: https://<host>/.well-known/jwks.json` — paths the API service does
# not serve, because MOSIP deploys eSignet behind a proxy that puts the UI at /
# and the API under /v1/esignet on the same host. Deployed without that proxy
# every URL eSignet publishes about itself is wrong, and a wallet that follows
# the document gets 404s with nothing naming the cause. See docs/p0-findings.md.
#
# So the UI is the public hostname and forwards the API paths over Railway's
# private network. The API is bound to :: for that reason; nginx resolves the
# upstream at config load, so this container will not start before the API
# service exists.
server {
    listen 8080;
    root   /usr/share/nginx/html;
    index  index.html;

    location /v1/esignet/ {
        proxy_pass         http://crest-esignet.railway.internal:8088/v1/esignet/;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Where the discovery document says the signing keys are. eSignet serves
    # them under the oauth path.
    location /.well-known/jwks.json {
        proxy_pass         http://crest-esignet.railway.internal:8088/v1/esignet/oauth/.well-known/jwks.json;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
