# eSignet's login UI, vendored from the 1.8.0 image with one change: the host it
# proxies to.
#
# The UI is the public hostname for eSignet, not just its login screen. eSignet's
# discovery document advertises /authorize, /.well-known/jwks.json and
# /.well-known/oauth-authorization-server on its own host, and the API service
# serves none of them — MOSIP deploys eSignet behind exactly this proxy, and the
# routes below are the ones the image already ships. Deployed without it every
# URL eSignet publishes about itself 404s, and the wallet reports
# "well-known api is not accessible", naming no URL. See docs/p0-findings.md.
#
# Upstream hardcodes `esignet.esignet`, a Kubernetes service name; nginx resolves
# upstreams at config load and refuses to start when one will not resolve, so
# this file cannot be used unchanged anywhere else.

worker_processes  1;

events {
  worker_connections  1024;
}

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  server {
    listen 3000;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location /v1/esignet {
      proxy_pass         http://crest-esignet.railway.internal:8088/v1/esignet;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }
    location /.well-known/openid-configuration {
      proxy_pass         http://crest-esignet.railway.internal:8088/v1/esignet/oidc/.well-known/openid-configuration;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }
    location /.well-known/jwks.json {
      proxy_pass         http://crest-esignet.railway.internal:8088/v1/esignet/oauth/.well-known/jwks.json;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }
    location /.well-known/oauth-authorization-server {
      proxy_pass         http://crest-esignet.railway.internal:8088/v1/esignet/oauth/.well-known/oauth-authorization-server;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }
    location /.well-known/openid-credential-issuer {
      proxy_pass         http://crest-esignet.railway.internal:8088/v1/esignet/vci/.well-known/openid-credential-issuer;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }
    # location /oidc-ui {
    #   alias /usr/share/nginx/oidc-ui;
    #   try_files $uri $uri/ /oidc-ui/index.html;
    # }
    location / {
      # alias /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Content-Security-Policy "
          default-src 'self';
          style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://cdn.jsdelivr.net https://*.mosip.net;
          script-src 'self' https://www.google.com  https://www.gstatic.com;
          frame-src https://www.google.com;
          connect-src 'self' http://127.0.0.1:*;
        " always;
      add_header Referrer-Policy "no-referrer" always;
    }
  }
}
