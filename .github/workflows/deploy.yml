name: Deploy

# Deploys `main` to Railway, and only after CI has gone green on it.
#
# The gate is deliberate: `workflow_run` fires when CI *completes*, and the job
# below refuses to run unless the conclusion was success. A deploy pipeline that
# ships whatever landed on main regardless of tests is not a pipeline, it is a
# way of finding out about failures from users.
#
# Railway builds from the uploaded source using infra/compose/Dockerfile.service
# — the same Dockerfile compose uses locally, so "works locally" and "works
# deployed" are the same statement about the same file.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Redeploying without a code change has to be possible: a rotated secret or a
  # wedged container is not a reason to push an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy mid-flight

jobs:
  deploy:
    name: Railway — production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    strategy:
      # Sequential, not parallel: these services share one database, and a
      # failure part-way through a fan-out leaves a mix of versions with nobody
      # able to say which. max-parallel 1 keeps the order legible.
      max-parallel: 1
      fail-fast: false
      matrix:
        # The whole demo fleet, in the same order as `make deploy-demo` (the
        # audited manual fallback — the two lists must not drift): services,
        # then the mocks they call, then the doors that front them.
        service:
          [
            registry,
            definitions,
            evidence,
            verification,
            payments,
            notify,
            mock-oidc,
            mock-rail,
            mock-sms,
            web,
            apps,
            worker,
            field,
            console,
            verifier,
            docs,
          ]

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; be explicit
          # about deploying exactly the commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm i -g @railway/cli@4

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "crest-${{ matrix.service }}" \
            --ci --detach

      - name: Wait for the service to answer
        run: |
          # A deploy that returns without the service answering has told us
          # nothing. Poll readiness rather than sleeping and hoping. Only the
          # doors have public domains; the services answer through the
          # crest-web proxy, and two mocks are private-network only — for
          # those the accepted build is all Railway lets us observe.
          case "${{ matrix.service }}" in
            registry|definitions|evidence|verification|payments|notify)
              # /readyz, not /healthz: readiness is wired to the database
              # ping, and a deploy must not continue on a process that is
              # alive but cannot serve its store-backed routes.
              URL="https://crest-web-production.up.railway.app/api/crest-${{ matrix.service }}/readyz" ;;
            mock-oidc)
              URL="https://crest-web-production.up.railway.app/api/crest-mock-oidc/healthz" ;;
            web|apps|worker|field|console|verifier|docs)
              URL="https://crest-${{ matrix.service }}-production.up.railway.app/" ;;
            *)
              echo "crest-${{ matrix.service }} is private with no proxied health path; build accepted is the observable"
              exit 0 ;;
          esac
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "$URL" >/dev/null; then
              echo "$URL answers"
              exit 0
            fi
            sleep 10
          done
          echo "::error::crest-${{ matrix.service }} did not answer at $URL within 10 minutes"
          exit 1
