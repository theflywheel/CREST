name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed files through the API; without
  # this the gate job dies "Resource not accessible by integration" and every
  # gated job skips — a red that looks like a green.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What did this change actually touch? Every other job is gated on the
  # answer, because a docs-only or static-apps PR paying for a full service
  # rebuild is how a 2,000-minute month runs out in week three. Pushes to
  # main skip the gate and run everything — main is what deploys.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      stack: ${{ steps.filter.outputs.stack }}
      compose: ${{ steps.filter.outputs.compose }}
      docs: ${{ steps.filter.outputs.docs }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'schemas/**'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            stack:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'schemas/**'
              - 'Makefile'
              - 'infra/compose/**'
              - 'tests/fixtures/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'infra/compose/**'
              - '.github/workflows/ci.yml'
            apps:
              - 'frontend/**'
              - 'tests/e2e-apps/**'
              - 'docs/journey-spec.json'
              - 'tools/journey-trace/**'
              - 'infra/compose/**'
              - 'Makefile'
              - '**/*.go'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'tools/journey-trace/**'
              - 'CLAUDE.md'
              - '.github/workflows/ci.yml'

  go:
    name: Go — structure, lint, test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Layout first: a misplaced file makes every later failure harder to read.
      - name: Structure
        run: make structure

      # schemas/ is the source of truth. A generated file that is behind the
      # schema it came from is a second, wrong definition of a primitive — the
      # exact failure schemas/README.md exists to prevent.
      - name: Generated types are current
        run: make generate-check

      - name: Lint (includes import-boundary rules)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Build
        run: make build

      # -race and -count=1 together: the clock and the mocks are shared state,
      # and a cached pass tells us nothing about a change. This is the only
      # test invocation on purpose — the cached non-race run it used to follow
      # proved a strict subset of what this one proves.
      - name: Test (race, uncached)
        run: go test -race -count=1 ./pkg/... ./services/... ./tools/... ./tests/...

  e2e:
    name: E2E — the spine, on real services
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.stack == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # The whole point of #40: one command, from a clean checkout, no manual
      # step. If this needs a human, it is not a harness. (The service images
      # share their compile layer — see Dockerfile.service — so this builds
      # the module once, not seven times.)
      - name: CSV in, verifiable credential out
        run: make test-e2e

  # The journey doors, on the real stack: the route walk that already existed
  # as a local-only command (`make e2e-apps`, never wired into CI until now)
  # and the fidelity gate, which holds every screen the ledger calls
  # implemented to its entry in the generated design spec.
  #
  # BLOCKING, deliberately. The gate is green today for the screens that are
  # implemented — the J3 screens still to be built are reported as
  # skipped-with-reason and turn on by themselves as they land — so making it
  # informational would buy nothing and cost the ability to catch a real
  # regression on the day it happens.
  e2e-apps:
    name: Journey doors — route walk + fidelity gate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.apps == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable

      # Builds the doors, brings up the stack, seeds the story world.
      - name: Stack up, story-seeded
        run: make apps-up

      - name: Playwright browser
        run: cd tests/e2e-apps && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Every journey-app route stays alive
        run: make e2e-apps

      - name: Fidelity — every implemented screen matches the reference
        run: make fidelity

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs --tail=120

  # Config validation only. The images themselves are proven by the e2e job,
  # which builds every one of them and then runs the suite against them — the
  # standalone builds this job used to do were the same work done twice.
  compose:
    name: Compose — config and service images build
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.compose == 'true'
    steps:
      - uses: actions/checkout@v4

      # Catches YAML and interpolation errors without pulling every upstream image.
      - name: Validate compose
        run: docker compose -f infra/compose/docker-compose.yml config -q

  docs:
    name: Docs — design references resolve
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4

      # The blueprint's section anchors are cited from every issue. If one
      # disappears, those references rot silently.
      - name: Blueprint sections intact
        run: |
          missing=0
          for n in $(seq 1 16); do
            grep -q "id=\"s$n\"" docs/crest-infrastructure-blueprint.html || { echo "missing blueprint section s$n"; missing=1; }
          done
          exit $missing

      # The 17 Aug journeys reference is the design of record for every
      # screen; journey-spec.json is a generated projection of it. A stale
      # spec is a second, wrong definition of a screen — same contract as
      # generate-check for schemas/.
      - name: Journey spec is current
        run: make journey-spec-check

      # The fidelity gate's scope file, its waivers and its quarantine are
      # inputs to a generated column in journey-traceability.md. A waiver with
      # no reason, a quarantine with no issue, or a scope entry for a screen
      # the reference does not have would all be invisible until somebody ran
      # the stack — so the shape is checked here, where no stack is needed.
      # The gate's own verdicts need the stack and run in the E2E-apps job.
      - name: Fidelity gate is well-formed and the ledger is current
        run: make fidelity-check

      - name: Required docs present
        run: |
          for f in docs/COMPONENTS.md docs/TESTING.md docs/test-manifest.md docs/TRACKING.md CLAUDE.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
