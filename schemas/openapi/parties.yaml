openapi: 3.1.0
info:
  title: CREST parties (né registry, #50)
  version: "1"
  description: |
    ## Who may call what (#102)

    Every service verifies bearer tokens; this section is who each surface
    answers. Four kinds of path:

    - **Party-authorized** — acts in a named party's name; the caller must be
      that party or hold act-for-party where the action is scoped
      (X-CREST-On-Behalf-Of names the party). Marked `security: bearerAuth`.
    - **Authenticated** — any signed-in caller (custodian queues, operations
      lists). Also `bearerAuth`.
    - **Open by design** — verification, status list, instance, capability
      reads by unguessable id, and the bootstrap plane; each carries a comment
      saying why.
    - **`/internal/*`** — the other services' doors, unauthenticated by the
      service-identity ruling (§16, 2026-08-25): service traffic lives on
      internal routes and fencing them to the service network is the
      deployment's job.
    Who a party is, what they agreed to, what they are authorised to do, and — the
    part the rest of the system leans on — whether an identifier from a source
    system resolves to exactly one of them.

    Request and response bodies that are CREST primitives are referenced by the
    `$id` of their JSON Schema under `schemas/`, never restated here. A second copy
    of a primitive is the thing `schemas/README.md` exists to prevent: two
    hand-maintained definitions agree right up until they don't.
servers:
  - url: http://parties:8080
    description: In-cluster address used by the other services.

paths:
  /v1/parties:
    post:
      operationId: createParty
      summary: Register a party
      description: >
        Creates the person or organisation everything else hangs off. The body is
        validated against the Party schema rather than trusted because it
        unmarshalled — W2 is unenforceable against a party with no contact route,
        and the Go struct cannot express "at least one".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:party:1"
      responses:
        "201":
          description: Created. `id` and `createdAt` are filled in if the caller omitted them.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:party:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}:
    get:
      operationId: getParty
      summary: Read a party
      description: Answers who this identifier belongs to, including their contact routes.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: The party.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:party:1"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/assurance:
    get:
      operationId: getPartyAssurance
      summary: How strongly is this party's identity established?
      description: >
        Derives the identity assurance level now, and says why. It is derived and
        not stored for the same reason a trust tier is (W1): a stored level freezes
        a judgement and cannot be raised when the worker binds an anchor later, so
        verification asks this endpoint on every verify rather than reading a value
        off the credential.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: The level as of now, with the facts that produced it.
          content:
            application/json:
              schema:
                type: object
                required: [partyId, identityAssurance, because]
                properties:
                  partyId: { type: string }
                  identityAssurance:
                    type: string
                    description: IA-0 through IA-3, as defined in Blueprint §4.1.
                  because:
                    type: array
                    items: { type: string }
                    description: The reasons behind the level, so a caller can argue with it.
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/roster-ids:
    post:
      operationId: addRosterID
      summary: Attach a source-system roster identifier
      description: >
        Records that a source system knows this party by some other id, scoped to
        the context it came from. The scope is mandatory: an unscoped roster id
        matches the wrong person in the next deployment that reuses the number.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rosterId, contextId]
              properties:
                rosterId: { type: string }
                contextId: { type: string, description: The context this roster id is meaningful within. }
      responses:
        "204": { description: Recorded. }
        "400":
          description: Either field missing — an unscoped roster id is refused, not stored.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/auth/login:
    get:
      operationId: authLogin
      summary: Start an eSignet login
      description: >
        Sends the browser to eSignet's UI with a PKCE challenge (#155). Served
        only where a relying-party client is configured (ESIGNET_URL et al.);
        the local stack's mock issuer has no redirect flow. The `door`
        parameter must be one of the deployment's configured door origins —
        anything else is refused as an open redirect.
      parameters:
        - name: door
          in: query
          required: true
          schema: { type: string }
          description: The door origin to return to after login.
      responses:
        "302": { description: Redirect to eSignet's authorize page. }
        "400":
          description: The door is not one of this deployment's.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/callback:
    get:
      operationId: authCallback
      summary: eSignet's return leg
      description: >
        Exchanges the authorization code (private_key_jwt + PKCE verifier) and
        bounces the browser back to the door's #/auth route with the access
        token in the fragment — which never reaches a server log. The state
        rides an HMAC-signed, ten-minute, HttpOnly cookie; the pairwise
        derivation never reaches the browser, which is what retires the dev
        issuer's /dev/pairwise from production.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to the door, with a token or an error. }
        "400":
          description: No login in flight, state mismatch, or an expired attempt.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/me:
    get:
      operationId: authMe
      summary: Who this deployment takes the caller to be
      description: >
        The pairwise subject reference and the party bound to it. An
        authenticated stranger gets their subjectRef and an empty partyId —
        the state self-registration (#155 phase B) acts on; being unknown here
        is a fact, not an error.
      responses:
        "200":
          description: The caller, as bound here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjectRef: { type: string }
                  partyId: { type: string }
                  issuer: { type: string }
        "401":
          description: No verified token accompanied the request.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/parties/{id}/identity-bindings:
    post:
      operationId: addIdentityBinding
      summary: Append an identity binding
      description: >
        Records that a provider authenticated this party, and returns the
        assurance level that now derives from their bindings.


        Append-only, and that is the whole design. A binding is never edited and
        never removed: a superseded one is a true statement about who this party
        was believed to be at the time, and it is what makes a later dispute
        about an attribution answerable. Re-sending an identical binding is a
        retry and changes nothing; the same provider with a different subject is
        a genuine re-binding and appends.


        This is the production trigger for the retroactive upgrade. Assurance is
        derived from bindings rather than stored, so appending one raises the
        tier of evidence already captured, with nothing reissued. A worker
        enrolled by phone in a field visit is not stuck at the assurance they
        had on the day somebody else typed them into a form.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, providerClass, subjectRef]
              properties:
                provider: { type: string, description: The provider instance that authenticated. }
                providerClass:
                  type: string
                  enum: [esignet, mosip-ida, generic-oidc, mobile-otp, document-seen, asserted]
                  description: >
                    What kind of check stands behind this, and therefore what it
                    can honestly assert. The level is derived from this, never sent.
                subjectRef:
                  type: string
                  description: >
                    The provider's pairwise subject identifier. Never a raw
                    national identifier — with eSignet this partitions by relying
                    party, not by client (finding E6).
                nationalIdHash:
                  type: object
                  description: >
                    For matching only: a salted hash and the salt's identifier,
                    never the identifier itself, and never for fixtures either.
                  required: [alg, value, saltRef]
                  properties:
                    alg: { type: string, enum: [sha256] }
                    value: { type: string, pattern: "^[0-9a-f]{64}$" }
                    saltRef: { type: string }
                assertedAt: { type: string, format: date-time }
                expiresAt:
                  type: string
                  format: date-time
                  description: >
                    After this the binding is no level rather than a lower one —
                    it says what was true then, and assurance answers what is true now.
      responses:
        "201":
          description: Appended.
          content:
            application/json:
              schema:
                type: object
                required: [partyId, bindings, identityAssurance, because]
                properties:
                  partyId: { type: string }
                  bindings: { type: array, items: { type: object } }
                  identityAssurance: { type: string, enum: [IA-0, IA-1, IA-2, IA-3] }
                  because: { type: array, items: { type: string } }
        "200": { description: This exact binding was already recorded; nothing was appended. }
        "400":
          description: Malformed, or asserted in the future.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { description: No such party. }
        "409":
          description: >
            That identifier already resolves to a different party. This is the
            duplicate case and it holds for review — never an automatic merge.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/holds/{id}/resolve:
    post:
      operationId: resolveHold
      summary: Close a duplicate hold — one person, or two
      description: >
        Records which of the two situations a hold is, and acts on it (§4, W7).


        `distinct` means two different people who share an identifier, which is
        ordinary in a household. The identifier is taken off every candidate but
        the one it belongs to; nothing else about anybody changes, and no worker
        confirmation is asked for — asking one worker to ratify a fact about
        another is disclosure, not consent.


        `merge` means one person recorded twice. §4 gives this decision to the
        registry custodian *and* to the worker's confirmation, and this endpoint
        has no shape that expresses a merge without one: `confirmedByPartyId`
        and `confirmationMethod` are required, and the same requirement is a
        CHECK constraint on the row. That is what makes
        `merges_without_confirmation` a query rather than an assertion — and
        worth saying plainly, it read zero before this endpoint existed only
        because merging was impossible.


        The absorbed party is not deleted. Its identifier keeps resolving,
        through `mergedInto`, because every claim, credential and payment
        instruction naming it lives in another service — and removing it would
        put a hole in a worker's history exactly where the system corrected its
        own mistake about who they were.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, partyId, resolvedByPartyId]
              properties:
                decision: { type: string, enum: [merge, distinct] }
                partyId:
                  type: string
                  description: >
                    Who the identifier belongs to: the survivor for a merge, the
                    rightful holder for a distinct. Must be one of the hold's
                    own candidates.
                resolvedByPartyId: { type: string, description: The custodian taking the decision. }
                confirmedByPartyId:
                  type: string
                  description: The worker confirming the merge. Required for `merge`, refused for `distinct`.
                confirmationMethod:
                  type: string
                  description: How the confirmation was taken — voice, in person, SMS reply.
      responses:
        "200":
          description: The hold is closed.
          content:
            application/json:
              schema:
                type: object
                required: [holdId, decision, partyId, resolvedBy, resolvedAt, merged]
                properties:
                  holdId: { type: string }
                  decision: { type: string }
                  partyId: { type: string }
                  resolvedBy: { type: string }
                  resolvedAt: { type: string, format: date-time }
                  merged: { type: array, items: { type: string } }
                  confirmedBy: { type: string }
                  confirmationMethod: { type: string }
        "400": { $ref: "#/components/responses/BadBody" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The party named is not one of this hold's candidates, or has itself been merged away.
        "500": { $ref: "#/components/responses/Internal" }

  /v1/holds/metrics:
    get:
      operationId: mergeMetrics
      summary: How many merges were recorded without the worker's confirmation
      description: >
        §4's monitored invariant, as a number rather than a claim. It should be
        zero, and it should be zero because every merge carries a confirmation —
        not because merging is impossible, which is the reason it read zero
        before `/v1/holds/{id}/resolve` existed.
      responses:
        "200":
          description: The count, and why it is what it is.
          content:
            application/json:
              schema:
                type: object
                required: [mergesWithoutConfirmation]
                properties:
                  mergesWithoutConfirmation: { type: integer }
                  because: { type: string }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/enrolment-consent:
    get:
      operationId: enrolmentConsentState
      summary: May we record new evidence about this worker on this programme?
      description: >
        The derived enrolment-consent state for a party somebody has named,
        rather than one a `/v1/resolve` found.


        `/v1/resolve` already derives this, but only as a side effect of
        matching an identifier. Working the unclear queue is the case where the
        worker is named outright — the whole point is that no identifier matched
        — so there is nothing to resolve, and without this a caller would have
        to list every consent the worker holds and re-derive §9's rule itself. A
        second implementation of "is this worker withdrawn" is a second thing to
        get wrong, and the one that gets it wrong records evidence about
        somebody who asked us to stop.


        Derived on read, never stored: a cached "consented" is a withdrawal that
        has not taken effect yet.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: contextId
          in: query
          required: true
          description: Consent is per programme (§9), so there is no single answer without one.
          schema: { type: string }
      responses:
        "200":
          description: The state, for this worker on this programme.
          content:
            application/json:
              schema:
                type: object
                required: [partyId, contextId, enrolmentConsent]
                properties:
                  partyId: { type: string }
                  contextId: { type: string }
                  enrolmentConsent: { type: string, enum: [NONE, GRANTED, WITHDRAWN] }
        "400": { $ref: "#/components/responses/BadBody" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/consents:
    post:
      operationId: recordConsent
      summary: Capture a consent moment, with its artefact
      description: >
        Records one of §9's three consent moments. The artefact — a voice
        recording, a photographed signed form — is the request BODY, with the
        metadata in the query string; a field device on a bad link should not
        have to assemble a multipart document, and a truncated multipart upload
        fails with a parse error that names nothing.


        A voice consent with no body is refused. §9 makes a voice recording a
        valid capture for non-literate workers, and for a worker who cannot read
        the form it is their entire consent record — so "voice" with nothing
        attached is a claim that somebody spoke, with nothing to show.


        The artefact is stored before the row. If the row were written first and
        the upload then failed, the record would assert a recording that does not
        exist; in this order the worst case is an object with no row pointing at
        it, which misdescribes nobody's consent.
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - { name: moment, in: query, schema: { type: string, enum: [enrolment, issuance-confirmation, disclosure], default: enrolment } }
        - { name: purpose, in: query, required: true, schema: { type: string }, description: What is being consented to. Consent to something unstated is not consent. }
        - { name: captureMethod, in: query, required: true, schema: { type: string, enum: [screen, sms, ussd, voice, assisted] } }
        - { name: capturedBy, in: query, schema: { type: string }, description: Required for voice and assisted — a consent taken by somebody else with nobody named is one nobody can be asked about. }
        - name: contextId
          in: query
          schema: { type: string }
          description: >
            The programme this consent is given to. Required for enrolment.
            Consent is per relationship: a worker who agreed to one programme
            holding their work history has not agreed to every other
            organisation on the deployment holding it, and an unscoped consent
            would assert exactly that on their behalf.
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Recorded.
          content: { application/json: { schema: { $ref: "#/components/schemas/Consent" } } }
        "400":
          description: Missing purpose or captureMethod, or a voice consent with no recording.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { description: No such party. }
        "413":
          description: The artefact exceeds this deployment's limit. It was not stored — a truncated consent recording stops before the part that matters.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { description: This deployment has no object store, so an artefact cannot be kept. }
        "500": { $ref: "#/components/responses/Internal" }

    get:
      operationId: listPartyConsents
      summary: This party's consent record
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: Every consent moment recorded, and the derived enrolment state.
          content:
            application/json:
              schema:
                type: object
                required: [partyId, consents, enrolmentConsent]
                properties:
                  partyId: { type: string }
                  consents: { type: array, items: { $ref: "#/components/schemas/Consent" } }
                  enrolmentConsent:
                    type: object
                    description: >
                      One state per programme, keyed by context id. There is no
                      single answer: a worker can be consented to one programme
                      and withdrawn from another, and flattening that would hide
                      the distinction.
                    additionalProperties: { type: string, enum: [NONE, GRANTED, WITHDRAWN] }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/consents/{id}/artefact:
    get:
      operationId: consentArtefact
      summary: Play back a stored consent artefact
      description: >
        A consent you cannot review is one you cannot meaningfully withdraw, so
        the recording is retrievable. Served with no-store: this is a recording
        of a person and nothing in between should keep a copy.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The artefact, with its stored content type. }
        "404": { description: No such consent, or it has no artefact — including because it was withdrawn. }
        "503": { description: This deployment has no object store configured. }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/consents/{id}/withdraw:
    post:
      operationId: withdrawConsent
      summary: Take consent back
      description: >
        Marks the record withdrawn and DELETES the artefact. Both halves are the
        point: the row is what makes the withdrawal auditable — that consent was
        given and later taken back is history, and history is not rewritten —
        and deleting the recording is what makes it real, because a withdrawal
        that leaves it in place has withdrawn nothing.


        Withdrawing enrolment consent has an effect beyond this record. `/v1/resolve`
        reports the state and the evidence pipeline stops recording new work for
        that worker (§9: enrolment consent is the right to fetch and hold
        evidence). Work already recorded is untouched — consent governs what may
        be collected next, and removing somebody's history would make withdrawal
        a penalty for exercising it.


        Idempotent: withdrawing an already-withdrawn consent returns it unchanged.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/OnBehalfOf" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "401":
          description: >
            No verified caller, or a token that did not verify. This endpoint acts
            in somebody's name and will not act on an asserted party id.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: >
            The caller is authenticated and may not do this — `subject_not_enrolled`
            when no party here is bound to their identity (an ordinary state for
            somebody not yet enrolled), `party_not_proven` when the request names a
            party other than the one it authenticated as, `not_permitted_to_act_for`
            when it asks to act for somebody without the authorization.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "200":
          description: Withdrawn.
          content: { application/json: { schema: { $ref: "#/components/schemas/Consent" } } }
        "404": { description: No such consent. }
        "500":
          description: >
            Withdrawn, but the recording could not be deleted. Reported rather
            than swallowed, because somebody has to remove it; the key is in the
            service log.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/resolve:
    get:
      operationId: resolve
      summary: Which party does this identifier belong to?
      description: >
        The endpoint the evidence pipeline calls for every row, and the one whose
        third answer is the design. 200 means exactly one candidate. 404 means
        nothing matched and the row belongs in the unclear queue. 409 means more
        than one party carries this identifier: a hold is recorded and no merge
        happens (W7). The 409 is a designed outcome, not a failure — picking the
        best candidate would be a merge, and `merges_without_confirmation = 0` is a
        monitored metric.
      parameters:
        - { name: kind, in: query, schema: { type: string }, description: Which key is being matched (roster id, hashed national id, phone). }
        - { name: value, in: query, required: true, schema: { type: string }, description: The key value. Required. }
        - { name: contextId, in: query, schema: { type: string }, description: Narrows a roster id to the context it was issued in. }
      responses:
        "200":
          description: Exactly one candidate, with which key matched and at what confidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400":
          description: No `value` supplied.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Nothing matched. The caller sends the row to the unclear queue rather than guessing.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >
            More than one candidate. A hold has been written and is returned; it
            names the candidates so a human can decide. Nothing was merged (W7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/holds:
    get:
      operationId: listHolds
      summary: What match decisions are waiting on a person?
      description: >
        The open holds recorded by resolve. This is the queue that makes W7
        checkable rather than believed — if it is never drained, that is visible
        here instead of quietly resolved by a merge.
      responses:
        "200":
          description: Open holds, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [holds, count]
                properties:
                  holds: { type: array, items: { $ref: "#/components/schemas/Hold" } }
                  count: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/terms:
    post:
      operationId: createTerms
      summary: Publish a version of terms
      description: >
        Records the terms a party can later be shown to have agreed to. Versioned,
        because consent to a document is only meaningful against the exact text
        that was consented to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:terms:1"
      responses:
        "201":
          description: Created; `publishedAt` defaults to now.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:terms:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorizations:
    post:
      operationId: createAuthorization
      summary: Grant a party a function within a context
      description: >
        Records that someone may do something somewhere, for some period. Defaults
        to state ACTIVE approved now. What the function names means is programme
        configuration; that an authorization exists and is time-bounded is
        infrastructure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:authorization:1"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:authorization:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorizations/permits:
    get:
      operationId: permits
      summary: May this party do this, here, at this moment?
      description: >
        A yes/no against the authorizations on file, evaluated at a point in time.
        `at` is a parameter rather than always-now so a caller can ask whether an
        action was permitted when it happened — an authorization that has since
        expired did not retroactively un-permit last month's work.
      parameters:
        - { name: partyId, in: query, schema: { type: string } }
        - { name: function, in: query, schema: { type: string } }
        - { name: contextId, in: query, schema: { type: string } }
        - name: at
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339. Defaults to the service clock's now.
      responses:
        "200":
          description: The answer, and the instant it was evaluated at.
          content:
            application/json:
              schema:
                type: object
                required: [permitted, at]
                properties:
                  permitted: { type: boolean }
                  overdue:
                    type: boolean
                    description: >
                      Every authorization behind this yes is past its review-by
                      date (§16). Never changes `permitted` — "flag overdue, keep
                      working" — and a caller that ignores it loses nothing a
                      worker needed.
                  at: { type: string, format: date-time }
        "400":
          description: "`at` is not RFC3339."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorizations/overdue:
    get:
      operationId: overdueAuthorizations
      summary: The review queue
      description: >
        Every ACTIVE authorization past its `reviewBy` date (§16). Listing it is
        the entire consequence of being overdue — nothing reads this to refuse
        anything, because a missed calendar entry must never withhold a worker's
        payment. A custodian surface, like /v1/holds.
      responses:
        "200":
          description: Overdue authorizations, oldest review date first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizations:
                    type: array
                    items: { $ref: "urn:crest:schema:primitives:authorization:1" }
                  count: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorizations/{id}/revoke:
    post:
      operationId: revokeAuthorization
      summary: Revoke an authorization
      description: >
        The narrowing instrument (§16, J3). Narrowing binds at submission:
        revocation stops NEW work — the next permits() check answers no — and
        touches nothing in flight, because evidence already submitted was checked
        when it entered and the worker cannot un-perform the work. To narrow
        rather than remove, revoke and create the narrower grant; there is
        deliberately no edit, because an edited grant has no record of what it
        used to allow. Idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The authorization, now REVOKED.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:authorization:1"
        "404":
          description: No such authorization.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/contexts:
    post:
      operationId: createContext
      summary: Create a context
      description: >
        The programme, geography or deployment that scopes everything else —
        roster ids, authorizations, evidence batches. Contexts are what stop two
        deployments' identifiers colliding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:context:1"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:context:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }

  # Every CREST service carries these two, added by pkg/httpx.Server.
  /healthz: { $ref: "#/components/pathItems/healthz" }
  /readyz: { $ref: "#/components/pathItems/readyz" }


  /internal/clock:
    get:
      operationId: readClock
      summary: What time does this service think it is?
      description: >
        Present only when CLOCK_DRIVEABLE is set, which pkg/service refuses in
        production. The confirmation window is seven days; a harness that waits
        seven days is not a harness, and one that shortens the window to a second
        is testing a different system. So outside production a service is handed
        its time. In production this path does not exist, because a clock an HTTP
        call can move is a clock that can close a worker's window early on them.
      responses:
        "200":
          description: The service's current time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
    post:
      operationId: setClock
      summary: Move this service's clock
      description: >
        Set an instant, or advance by a duration. The harness moves every service
        together: a stack where evidence is on Tuesday and confirmation is on
        Friday produces results that are nobody's design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: string, format: date-time }
                advance: { type: string, description: "A Go duration, e.g. 168h." }
      responses:
        "200":
          description: The clock after the move.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
        "400":
          description: Neither an instant nor a duration, or a duration that does not parse.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/organisations/{id}/registration:
    get:
      operationId: getRegistration
      summary: Where an organisation's application stands
      description: >
        The applicant-facing read: state, exact terms version accepted, decider
        and reason — plus the organisation's self-declared `attributes` (kind,
        sector, country, contact person; #168). Attributes are bounded strings
        from the Party's generic attributes map; the vocabulary is deployment
        configuration, and they are never published to the public log.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: The registration, with the organisation's attributes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partyId: { type: string }
                  state: { type: string }
                  termsId: { type: string }
                  termsVersion: { type: integer }
                  acceptedAt: { type: string, format: date-time }
                  decidedBy: { type: string }
                  reason: { type: string }
                  appliedAt: { type: string, format: date-time }
                  attributes:
                    type: object
                    additionalProperties: { type: string }
        "404":
          description: No such organisation application.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/organisations/{id}/decision:
    post:
      operationId: decideRegistration
      summary: Approve or reject a registering organisation
      description: >
        The rest of the onboarding surface (#20) is not yet in this document; this
        one path is here because caller identity changed its contract, and a
        changed contract with no written form is the gap this file exists to close.


        `decidedBy` is now checked rather than recorded. The self-approval rule —
        an organisation may not approve itself — was always a constraint on a value
        the caller chose, which made it a rule about typing: an applicant satisfied
        it by naming somebody else. It becomes a rule about people only once the
        name has been proved, which is what the bearer token does.


        A rejection needs a reason, for the same reason a held payment does: a
        closed door with no explanation attached leaves the applicant with nothing
        to act on.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PartyID" }, { $ref: "#/components/parameters/OnBehalfOf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, decidedBy]
              properties:
                approve: { type: boolean }
                decidedBy:
                  type: string
                  description: >
                    Must be the party the caller authenticated as, or one they hold
                    `act-for-party` for.
                reason: { type: string, description: Required when rejecting. }
      responses:
        "401":
          description: >
            No verified caller, or a token that did not verify. This endpoint acts
            in somebody's name and will not act on an asserted party id.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: >
            The caller is authenticated and may not do this — `subject_not_enrolled`
            when no party here is bound to their identity (an ordinary state for
            somebody not yet enrolled), `party_not_proven` when the request names a
            party other than the one it authenticated as, `not_permitted_to_act_for`
            when it asks to act for somebody without the authorization.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "200":
          description: The registration, in its new state.
        "400":
          description: No decidedBy, or a rejection with no reason.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >
            Self-approval, or approval before terms were accepted. Both are
            enforced in the service and by a CHECK constraint, so a future code
            path that forgets still cannot write the row.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /internal/identity/subjects/{subject}:
    get:
      operationId: partyForSubject
      summary: Which party a verified subject is
      description: >
        Turns a verified token's subject into the party it is bound to, for the six
        services that do not own the parties table.


        Under `/internal/` and deliberately unauthenticated: a service resolving who
        its caller is cannot itself require a resolved caller, and requiring a token
        here would be a bootstrap that never completes. What that costs is stated
        rather than hidden — a subject reaching this endpoint gets a party id back
        without a token. It is not something a stranger can act on, since the
        subject is this deployment's salted pairwise value and knowing one means
        having already authenticated as that person, but restricting `/internal/` to
        the service network is the deployment's job and is not done by this code.
      parameters:
        - name: subject
          in: path
          required: true
          schema: { type: string }
          description: This deployment's salted pairwise subject, not the provider's `sub`.
      responses:
        "200":
          description: The party bound to that subject.
          content:
            application/json:
              schema:
                type: object
                properties: { partyId: { type: string } }
        "404":
          description: >
            Nobody is bound to that subject. An ordinary state rather than an error:
            somebody the identity provider knows who has not been enrolled here, which
            enrolment fixes and a retry does not.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/identifiers:
    get:
      operationId: partyIdentifiers
      summary: Which party ids are one person
      description: >
        The read side of a merge (#100). Resolving a duplicate hold with `merge`
        marks the absorbed party `mergedInto` and rewrites nothing else: it keeps
        its id, its keys and its history, and every claim, window and payment
        instruction already written still names it. That is deliberate — a claim
        that said whose work it was at the time is a true statement, and editing
        it would destroy the only record of what the system believed before it
        corrected itself.


        So reads follow the pointer instead, and this is the endpoint they follow
        it through. Asking about anybody in a merge chain returns the whole chain
        with the survivor first, whether the id given was the survivor's or an
        absorbed one — the printed cards and saved links naming the old id have
        to keep working, and telling a worker their record is gone would be the
        system punishing them for its own correction.


        Answered only to the worker, or somebody authorised to act for them
        (#104): "this person was recorded twice" is a fact about the worker a
        stranger has no claim on, and a verifier resolving a party gets the
        chain's credentials from verification without this mapping. The services
        follow merges through an internal twin of this route instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PartyID" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The ids that are this person.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partyId:
                    type: string
                    description: The survivor — the id the person is known by now.
                  identifiers:
                    type: array
                    items: { type: string }
                    description: Survivor first, then every absorbed id, transitively.
                  merged:
                    type: boolean
                    description: Whether this person has more than one id at all.
        "401":
          description: No usable token.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: The caller is not this party and is not authorised to act for them.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such party.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries:
    post:
      operationId: openRecovery
      summary: Open a recovery for a worker who lost their device
      description: >
        The way back in (§16, #106). A recovery collects confirmations — two,
        from confirmers appointed by DIFFERENT authorities, because a panel
        appointed by one organisation is that organisation's decision wearing
        several names — or, where two confirmers cannot be reached, an
        operator's override. One live recovery per person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, openedByPartyId, reason]
              properties:
                partyId: { type: string }
                openedByPartyId: { type: string }
                reason: { type: string }
      responses:
        "201":
          description: Opened.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "404":
          description: No such party.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: A recovery for this party is already in progress.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listRecoveries
      summary: The recovery audit surface
      description: >
        Every recovery, override included — an override nobody can read back is
        quiet, which is the one thing it must never be. `overdue=true` narrows
        to overridden recoveries past their review-by date: flagged for review,
        never silent.
      parameters:
        - { name: overdue, in: query, schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: Recoveries, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveries:
                    type: array
                    items: { $ref: "#/components/schemas/Recovery" }
                  count: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}:
    get:
      operationId: getRecovery
      summary: Read a recovery, override and all
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The full record.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}/confirmations:
    post:
      operationId: confirmRecovery
      summary: One voice saying this is the same person
      description: >
        What a confirmer confirms is the narrow question — that the person
        asking is the person the record is about — never that they should have
        access. The confirmer must be somebody the declared authority currently
        stands behind (an ACTIVE authorization), must not be the worker, and at
        most one confirmation per authority counts, enforced by the table
        itself. The second distinct voice moves the recovery to CONFIRMED.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmerPartyId, authorityPartyId]
              properties:
                confirmerPartyId: { type: string }
                authorityPartyId:
                  type: string
                  description: >
                    Declared and then verified rather than inferred: a confirmer
                    holding authorizations from two organisations must say which
                    hat they are wearing.
      responses:
        "200":
          description: Recorded; state is OPEN or CONFIRMED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400":
          description: Missing fields, or the worker confirming themselves.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: The declared authority does not stand behind this confirmer.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >
            This confirmer — or another from the same authority — already
            confirmed. One org, one voice.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}/override:
    post:
      operationId: overrideRecovery
      summary: The operator's exception, which can never be quiet
      description: >
        For the worker two confirmers cannot reach. Requires the
        `override-recovery` function under an instance-scoped grant — an
        operator-level power, never a context one (G1, #10) — and is refused
        outright for the worker's own supervisor, whatever they hold: the
        person who caused a lockout is frequently the supervisor, and a path
        they can invoke is one they can invoke against the worker. Refused
        without a reason, here and by a database constraint; the record is
        permanent and carries a review-by date.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [byPartyId, reason]
              properties:
                byPartyId: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Overridden, with the reason, owner and review date on the record.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400":
          description: No reason or no owner — impossible to express, not merely discouraged.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not permitted, or the worker's own supervisor.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The recovery is past the point where an override applies.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}/complete:
    post:
      operationId: completeRecovery
      summary: Bind the worker's new subject
      description: >
        The destination of both paths: an APPENDED identity binding of class
        `recovery` for the subject the worker will authenticate as from now on.
        Never an edit — the old bindings stay (§4.1). The binding derives IA-1
        until the worker re-anchors with a real provider, at which point the
        stronger binding simply wins: vouching is community knowledge, not a
        national identity check.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectRef]
              properties:
                subjectRef: { type: string }
      responses:
        "200":
          description: Completed; the subject now resolves to the worker.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Not decided yet, or the subject already authenticates another party.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        An OIDC access token from the deployment's identity provider (#89, §4.1).
        In a deployment that is eSignet; locally it is tools/mocks/oidc, which
        mints real ES256 tokens against a real JWKS so the verification path
        under test is the production one.


        The provider's `sub` is never used directly. CREST re-salts it under a
        per-deployment key before anything stores or compares it, because #52
        and #63 are open against eSignet's pairwise subject — it partitions by
        relying party rather than by client, and derives without a
        per-deployment salt. Two deployments reading the same eSignet therefore
        cannot correlate their workers by subject.

  parameters:
    OnBehalfOf:
      name: X-CREST-On-Behalf-Of
      in: header
      required: false
      schema: { type: string }
      description: >
        The party this request acts for, when somebody is acting for somebody
        else. The assisted paths are a requirement rather than a loophole — a
        worker with no phone confirming through a supervisor is one of the four
        T=7 exits — and what makes them safe is that they are recorded as
        themselves. Refused with 403 unless the caller holds `act-for-party` in
        the context.

    PartyID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The party identifier.

  schemas:
    Recovery:
      type: object
      description: >
        A recovery, override and all. Deliberately fully readable afterwards —
        by the worker, and by an auditor asking whether the override power is
        being used well.
      properties:
        id: { type: string }
        partyId: { type: string }
        openedByPartyId: { type: string }
        reason: { type: string }
        state: { type: string, enum: [OPEN, CONFIRMED, OVERRIDDEN, COMPLETED] }
        createdAt: { type: string, format: date-time }
        confirmations:
          type: array
          items:
            type: object
            properties:
              confirmerPartyId: { type: string }
              authorityPartyId: { type: string }
              confirmedAt: { type: string, format: date-time }
        overrideByPartyId: { type: string }
        overrideReason: { type: string }
        overrideAt: { type: string, format: date-time }
        reviewBy: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    Consent:
      type: object
      description: >
        One recorded consent moment (§9). `artefactRef` is an object-store key,
        never a URL, and `artefactDigest` is stored beside it so an artefact
        swapped underneath is detectable rather than trusted — which matters
        precisely because this is the evidence that a person agreed to something.
      required: [id, partyId, moment, purpose, captureMethod, capturedAt, state]
      properties:
        id: { type: string }
        partyId: { type: string }
        moment: { type: string, enum: [enrolment, issuance-confirmation, disclosure] }
        purpose: { type: string }
        captureMethod: { type: string, enum: [screen, sms, ussd, voice, assisted] }
        capturedBy: { type: string }
        capturedAt: { type: string, format: date-time }
        artefactRef: { type: string }
        artefactDigest: { type: string }
        artefactType: { type: string }
        contextId: { type: string, description: The programme this consent is given to. Required for enrolment. }
        revokedAt: { type: string, format: date-time }
        revokedReason: { type: string }
        state: { type: string, enum: [NONE, GRANTED, WITHDRAWN] }

    Error:
      type: object
      description: >
        The error body every CREST service returns (pkg/httpx). The message is
        written for whoever reads it, including eventually a worker being told why
        something is held.
      required: [code, message]
      properties:
        code: { type: string, description: A machine-actionable code, e.g. no_match, invalid_query, schema_violation. }
        message: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Per-field detail from schema validation, when there is any.
    Match:
      type: object
      description: One resolved candidate, with the evidence for the match.
      properties:
        partyId: { type: string }
        matchedOn: { type: string, description: Which key matched. }
        confidence: { type: number }
    Hold:
      type: object
      description: >
        A recorded decision not to merge. Written whenever resolve finds more than
        one candidate; the row is what someone later acts on (W7).


        The colliding value itself is deliberately absent — §16 asks that
        duplicate holds show existence rather than content, and the reason is
        concrete: for a contact-route hold the value is a phone number, and a
        queue anybody can list would otherwise hand out the phone number of
        every worker two records disagree about. `keyKind` says which kind of
        identifier collided, which is what a custodian needs to decide it.
      properties:
        id: { type: string }
        keyKind: { type: string, enum: [national-id-hash, contact-route, roster-id] }
        candidates: { type: array, items: { type: string } }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

  responses:
    BadBody:
      description: The body could not be read, or carried a field this service does not know. Unknown fields are rejected rather than dropped — a misspelled field is a wrong number nobody notices.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SchemaViolation:
      description: The document does not satisfy its JSON Schema; `problems` lists every failure at once.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such record.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Internal:
      description: The service logged the cause and did not leak it.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  pathItems:
    healthz:
      get:
        operationId: healthz
        tags: [health]
        summary: Liveness
        description: The process is up. Separate from readiness on purpose — a service can be alive and unable to serve.
        responses:
          "200":
            description: Alive.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ok }
                    time: { type: string, format: date-time }
    readyz:
      get:
        operationId: readyz
        tags: [health]
        summary: Readiness
        description: >
          Actually touches the database. The harness polls this instead of
          sleeping, so a readyz that always says yes turns every start-up race
          into a flaky test rather than a failed one.
        responses:
          "200":
            description: Ready to serve.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ready }
          "503":
            description: Alive but not serving; `reason` says what is unreachable.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string }
                    reason: { type: string }
