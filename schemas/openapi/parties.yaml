openapi: 3.1.0
info:
  title: CREST parties (né registry, #50)
  version: "1"
  description: |
    ## Who may call what (#102)

    Every service verifies bearer tokens; this section is who each surface
    answers. Four kinds of path:

    - **Party-authorized** — acts in a named party's name; the caller must be
      that party or hold act-for-party where the action is scoped
      (X-CREST-On-Behalf-Of names the party). Marked `security: bearerAuth`.
    - **Authenticated** — any signed-in caller (custodian queues, operations
      lists). Also `bearerAuth`.
    - **Open by design** — verification, status list, instance, capability
      reads by unguessable id, and the bootstrap plane; each carries a comment
      saying why.
    - **`/internal/*`** — the other services' doors, unauthenticated by the
      service-identity ruling (§16, 2026-08-25): service traffic lives on
      internal routes and fencing them to the service network is the
      deployment's job.
    Who a party is, what they agreed to, what they are authorised to do, and — the
    part the rest of the system leans on — whether an identifier from a source
    system resolves to exactly one of them.

    Request and response bodies that are CREST primitives are referenced by the
    `$id` of their JSON Schema under `schemas/`, never restated here. A second copy
    of a primitive is the thing `schemas/README.md` exists to prevent: two
    hand-maintained definitions agree right up until they don't.
servers:
  - url: http://parties:8080
    description: In-cluster address used by the other services.

paths:
  /v1/parties:
    post:
      operationId: createParty
      summary: Register a party
      description: >
        Creates the person or organisation everything else hangs off. The body is
        validated against the Party schema rather than trusted because it
        unmarshalled — W2 is unenforceable against a party with no contact route,
        and the Go struct cannot express "at least one".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:party:1"
      responses:
        "201":
          description: Created. `id` and `createdAt` are filled in if the caller omitted them.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:party:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}:
    get:
      operationId: getParty
      summary: Read a party
      description: Answers who this identifier belongs to, including their contact routes.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: The party.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:party:1"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/assurance:
    get:
      operationId: getPartyAssurance
      summary: How strongly is this party's identity established?
      description: >
        Derives the identity assurance level now, and says why. It is derived and
        not stored for the same reason a trust tier is (W1): a stored level freezes
        a judgement and cannot be raised when the worker binds an anchor later, so
        verification asks this endpoint on every verify rather than reading a value
        off the credential.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: The level as of now, with the facts that produced it.
          content:
            application/json:
              schema:
                type: object
                required: [partyId, identityAssurance, because]
                properties:
                  partyId: { type: string }
                  identityAssurance:
                    type: string
                    description: IA-0 through IA-3, as defined in Blueprint §4.1.
                  because:
                    type: array
                    items: { type: string }
                    description: The reasons behind the level, so a caller can argue with it.
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/roster-ids:
    post:
      operationId: addRosterID
      summary: Attach a source-system roster identifier
      description: >
        Records that a source system knows this party by some other id, scoped to
        the context it came from. The scope is mandatory: an unscoped roster id
        matches the wrong person in the next deployment that reuses the number.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rosterId, contextId]
              properties:
                rosterId: { type: string }
                contextId: { type: string, description: The context this roster id is meaningful within. }
      responses:
        "204": { description: Recorded. }
        "400":
          description: Either field missing — an unscoped roster id is refused, not stored.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/auth/login:
    get:
      operationId: authLogin
      summary: Start an eSignet login
      description: >
        Sends the browser to eSignet's UI with a PKCE challenge (#155). Served
        only where a relying-party client is configured (ESIGNET_URL et al.);
        the local stack's mock issuer has no redirect flow. The `door`
        parameter must be one of the deployment's configured door origins —
        anything else is refused as an open redirect.
      parameters:
        - name: door
          in: query
          required: true
          schema: { type: string }
          description: The door origin to return to after login.
      responses:
        "302": { description: Redirect to eSignet's authorize page. }
        "400":
          description: The door is not one of this deployment's.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/callback:
    get:
      operationId: authCallback
      summary: eSignet's return leg
      description: >
        Exchanges the authorization code (private_key_jwt + PKCE verifier) and
        bounces the browser back to the door's #/auth route with the access
        token in the fragment — which never reaches a server log. The state
        rides an HMAC-signed, ten-minute, HttpOnly cookie; the pairwise
        derivation never reaches the browser, which is what retires the dev
        issuer's /dev/pairwise from production.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to the door, with a token or an error. }
        "400":
          description: No login in flight, state mismatch, or an expired attempt.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/me:
    get:
      operationId: authMe
      summary: Who this deployment takes the caller to be
      description: >
        The pairwise subject reference and the party bound to it. An
        authenticated stranger gets their subjectRef and an empty partyId —
        the state self-registration (#155 phase B) acts on; being unknown here
        is a fact, not an error.
      responses:
        "200":
          description: The caller, as bound here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjectRef: { type: string }
                  partyId: { type: string }
                  issuer: { type: string }
        "401":
          description: No verified token accompanied the request.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/parties/{id}/identity-bindings:
    post:
      operationId: addIdentityBinding
      summary: Append an identity binding
      description: >
        Records that a provider authenticated this party, and returns the
        assurance level that now derives from their bindings.


        Append-only, and that is the whole design. A binding is never edited and
        never removed: a superseded one is a true statement about who this party
        was believed to be at the time, and it is what makes a later dispute
        about an attribution answerable. Re-sending an identical binding is a
        retry and changes nothing; the same provider with a different subject is
        a genuine re-binding and appends.


        This is the production trigger for the retroactive upgrade. Assurance is
        derived from bindings rather than stored, so appending one raises the
        tier of evidence already captured, with nothing reissued. A worker
        enrolled by phone in a field visit is not stuck at the assurance they
        had on the day somebody else typed them into a form.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, providerClass, subjectRef]
              properties:
                provider: { type: string, description: The provider instance that authenticated. }
                providerClass:
                  type: string
                  enum: [esignet, mosip-ida, generic-oidc, mobile-otp, document-seen, asserted]
                  description: >
                    What kind of check stands behind this, and therefore what it
                    can honestly assert. The level is derived from this, never sent.
                subjectRef:
                  type: string
                  description: >
                    The provider's pairwise subject identifier. Never a raw
                    national identifier — with eSignet this partitions by relying
                    party, not by client (finding E6).
                nationalIdHash:
                  type: object
                  description: >
                    For matching only: a salted hash and the salt's identifier,
                    never the identifier itself, and never for fixtures either.
                  required: [alg, value, saltRef]
                  properties:
                    alg: { type: string, enum: [sha256] }
                    value: { type: string, pattern: "^[0-9a-f]{64}$" }
                    saltRef: { type: string }
                assertedAt: { type: string, format: date-time }
                expiresAt:
                  type: string
                  format: date-time
                  description: >
                    After this the binding is no level rather than a lower one —
                    it says what was true then, and assurance answers what is true now.
      responses:
        "201":
          description: Appended.
          content:
            application/json:
              schema:
                type: object
                required: [partyId, bindings, identityAssurance, because]
                properties:
                  partyId: { type: string }
                  bindings: { type: array, items: { type: object } }
                  identityAssurance: { type: string, enum: [IA-0, IA-1, IA-2, IA-3] }
                  because: { type: array, items: { type: string } }
        "200": { description: This exact binding was already recorded; nothing was appended. }
        "400":
          description: Malformed, or asserted in the future.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { description: No such party. }
        "409":
          description: >
            That identifier already resolves to a different party. This is the
            duplicate case and it holds for review — never an automatic merge.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/holds/{id}/resolve:
    post:
      operationId: resolveHold
      summary: Close a duplicate hold — one person, or two
      description: >
        Records which of the two situations a hold is, and acts on it (§4, W7).


        `distinct` means two different people who share an identifier, which is
        ordinary in a household. The identifier is taken off every candidate but
        the one it belongs to; nothing else about anybody changes, and no worker
        confirmation is asked for — asking one worker to ratify a fact about
        another is disclosure, not consent.


        `merge` means one person recorded twice. §4 gives this decision to the
        registry custodian *and* to the worker's confirmation, and this endpoint
        has no shape that expresses a merge without one: `confirmedByPartyId`
        and `confirmationMethod` are required, and the same requirement is a
        CHECK constraint on the row. That is what makes
        `merges_without_confirmation` a query rather than an assertion — and
        worth saying plainly, it read zero before this endpoint existed only
        because merging was impossible.


        The absorbed party is not deleted. Its identifier keeps resolving,
        through `mergedInto`, because every claim, credential and payment
        instruction naming it lives in another service — and removing it would
        put a hole in a worker's history exactly where the system corrected its
        own mistake about who they were.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, partyId, resolvedByPartyId]
              properties:
                decision: { type: string, enum: [merge, distinct] }
                partyId:
                  type: string
                  description: >
                    Who the identifier belongs to: the survivor for a merge, the
                    rightful holder for a distinct. Must be one of the hold's
                    own candidates.
                resolvedByPartyId: { type: string, description: The custodian taking the decision. }
                confirmedByPartyId:
                  type: string
                  description: The worker confirming the merge. Required for `merge`, refused for `distinct`.
                confirmationMethod:
                  type: string
                  description: How the confirmation was taken — voice, in person, SMS reply.
      responses:
        "200":
          description: The hold is closed.
          content:
            application/json:
              schema:
                type: object
                required: [holdId, decision, partyId, resolvedBy, resolvedAt, merged]
                properties:
                  holdId: { type: string }
                  decision: { type: string }
                  partyId: { type: string }
                  resolvedBy: { type: string }
                  resolvedAt: { type: string, format: date-time }
                  merged: { type: array, items: { type: string } }
                  confirmedBy: { type: string }
                  confirmationMethod: { type: string }
        "400": { $ref: "#/components/responses/BadBody" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The party named is not one of this hold's candidates, or has itself been merged away.
        "500": { $ref: "#/components/responses/Internal" }

  /v1/holds/metrics:
    get:
      operationId: mergeMetrics
      summary: How many merges were recorded without the worker's confirmation
      description: >
        §4's monitored invariant, as a number rather than a claim. It should be
        zero, and it should be zero because every merge carries a confirmation —
        not because merging is impossible, which is the reason it read zero
        before `/v1/holds/{id}/resolve` existed.
      responses:
        "200":
          description: The count, and why it is what it is.
          content:
            application/json:
              schema:
                type: object
                required: [mergesWithoutConfirmation]
                properties:
                  mergesWithoutConfirmation: { type: integer }
                  because: { type: string }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/enrolment-consent:
    get:
      operationId: enrolmentConsentState
      summary: May we record new evidence about this worker on this programme?
      description: >
        The derived enrolment-consent state for a party somebody has named,
        rather than one a `/v1/resolve` found.


        `/v1/resolve` already derives this, but only as a side effect of
        matching an identifier. Working the unclear queue is the case where the
        worker is named outright — the whole point is that no identifier matched
        — so there is nothing to resolve, and without this a caller would have
        to list every consent the worker holds and re-derive §9's rule itself. A
        second implementation of "is this worker withdrawn" is a second thing to
        get wrong, and the one that gets it wrong records evidence about
        somebody who asked us to stop.


        Derived on read, never stored: a cached "consented" is a withdrawal that
        has not taken effect yet.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: contextId
          in: query
          required: true
          description: Consent is per programme (§9), so there is no single answer without one.
          schema: { type: string }
      responses:
        "200":
          description: The state, for this worker on this programme.
          content:
            application/json:
              schema:
                type: object
                required: [partyId, contextId, enrolmentConsent]
                properties:
                  partyId: { type: string }
                  contextId: { type: string }
                  enrolmentConsent: { type: string, enum: [NONE, GRANTED, WITHDRAWN] }
        "400": { $ref: "#/components/responses/BadBody" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/consents:
    post:
      operationId: recordConsent
      summary: Capture a consent moment, with its artefact
      description: >
        Records one of §9's three consent moments. The artefact — a voice
        recording, a photographed signed form — is the request BODY, with the
        metadata in the query string; a field device on a bad link should not
        have to assemble a multipart document, and a truncated multipart upload
        fails with a parse error that names nothing.


        A voice consent with no body is refused. §9 makes a voice recording a
        valid capture for non-literate workers, and for a worker who cannot read
        the form it is their entire consent record — so "voice" with nothing
        attached is a claim that somebody spoke, with nothing to show.


        The artefact is stored before the row. If the row were written first and
        the upload then failed, the record would assert a recording that does not
        exist; in this order the worst case is an object with no row pointing at
        it, which misdescribes nobody's consent.
      parameters:
        - $ref: "#/components/parameters/PartyID"
        - { name: moment, in: query, schema: { type: string, enum: [enrolment, issuance-confirmation, disclosure], default: enrolment } }
        - { name: purpose, in: query, required: true, schema: { type: string }, description: What is being consented to. Consent to something unstated is not consent. }
        - { name: captureMethod, in: query, required: true, schema: { type: string, enum: [screen, sms, ussd, voice, assisted] } }
        - { name: capturedBy, in: query, schema: { type: string }, description: Required for voice and assisted — a consent taken by somebody else with nobody named is one nobody can be asked about. }
        - name: contextId
          in: query
          schema: { type: string }
          description: >
            The programme this consent is given to. Required for enrolment.
            Consent is per relationship: a worker who agreed to one programme
            holding their work history has not agreed to every other
            organisation on the deployment holding it, and an unscoped consent
            would assert exactly that on their behalf.
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Recorded.
          content: { application/json: { schema: { $ref: "#/components/schemas/Consent" } } }
        "400":
          description: Missing purpose or captureMethod, or a voice consent with no recording.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { description: No such party. }
        "413":
          description: The artefact exceeds this deployment's limit. It was not stored — a truncated consent recording stops before the part that matters.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { description: This deployment has no object store, so an artefact cannot be kept. }
        "500": { $ref: "#/components/responses/Internal" }

    get:
      operationId: listPartyConsents
      summary: This party's consent record
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: Every consent moment recorded, and the derived enrolment state.
          content:
            application/json:
              schema:
                type: object
                required: [partyId, consents, enrolmentConsent]
                properties:
                  partyId: { type: string }
                  consents: { type: array, items: { $ref: "#/components/schemas/Consent" } }
                  enrolmentConsent:
                    type: object
                    description: >
                      One state per programme, keyed by context id. There is no
                      single answer: a worker can be consented to one programme
                      and withdrawn from another, and flattening that would hide
                      the distinction.
                    additionalProperties: { type: string, enum: [NONE, GRANTED, WITHDRAWN] }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/consents/{id}/artefact:
    get:
      operationId: consentArtefact
      summary: Play back a stored consent artefact
      description: >
        A consent you cannot review is one you cannot meaningfully withdraw, so
        the recording is retrievable. Served with no-store: this is a recording
        of a person and nothing in between should keep a copy.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The artefact, with its stored content type. }
        "404": { description: No such consent, or it has no artefact — including because it was withdrawn. }
        "503": { description: This deployment has no object store configured. }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/consents/{id}/withdraw:
    post:
      operationId: withdrawConsent
      summary: Take consent back
      description: >
        Marks the record withdrawn and DELETES the artefact. Both halves are the
        point: the row is what makes the withdrawal auditable — that consent was
        given and later taken back is history, and history is not rewritten —
        and deleting the recording is what makes it real, because a withdrawal
        that leaves it in place has withdrawn nothing.


        Withdrawing enrolment consent has an effect beyond this record. `/v1/resolve`
        reports the state and the evidence pipeline stops recording new work for
        that worker (§9: enrolment consent is the right to fetch and hold
        evidence). Work already recorded is untouched — consent governs what may
        be collected next, and removing somebody's history would make withdrawal
        a penalty for exercising it.


        Idempotent: withdrawing an already-withdrawn consent returns it unchanged.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/OnBehalfOf" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "401":
          description: >
            No verified caller, or a token that did not verify. This endpoint acts
            in somebody's name and will not act on an asserted party id.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: >
            The caller is authenticated and may not do this — `subject_not_enrolled`
            when no party here is bound to their identity (an ordinary state for
            somebody not yet enrolled), `party_not_proven` when the request names a
            party other than the one it authenticated as, `not_permitted_to_act_for`
            when it asks to act for somebody without the authorization.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "200":
          description: Withdrawn.
          content: { application/json: { schema: { $ref: "#/components/schemas/Consent" } } }
        "404": { description: No such consent. }
        "500":
          description: >
            Withdrawn, but the recording could not be deleted. Reported rather
            than swallowed, because somebody has to remove it; the key is in the
            service log.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/resolve:
    get:
      operationId: resolve
      summary: Which party does this identifier belong to?
      description: >
        The endpoint the evidence pipeline calls for every row, and the one whose
        third answer is the design. 200 means exactly one candidate. 404 means
        nothing matched and the row belongs in the unclear queue. 409 means more
        than one party carries this identifier: a hold is recorded and no merge
        happens (W7). The 409 is a designed outcome, not a failure — picking the
        best candidate would be a merge, and `merges_without_confirmation = 0` is a
        monitored metric.
      parameters:
        - { name: kind, in: query, schema: { type: string }, description: Which key is being matched (roster id, hashed national id, phone). }
        - { name: value, in: query, required: true, schema: { type: string }, description: The key value. Required. }
        - { name: contextId, in: query, schema: { type: string }, description: Narrows a roster id to the context it was issued in. }
      responses:
        "200":
          description: Exactly one candidate, with which key matched and at what confidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400":
          description: No `value` supplied.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Nothing matched. The caller sends the row to the unclear queue rather than guessing.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >
            More than one candidate. A hold has been written and is returned; it
            names the candidates so a human can decide. Nothing was merged (W7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/holds:
    get:
      operationId: listHolds
      summary: What match decisions are waiting on a person?
      description: >
        The open holds recorded by resolve. This is the queue that makes W7
        checkable rather than believed — if it is never drained, that is visible
        here instead of quietly resolved by a merge.
      responses:
        "200":
          description: Open holds, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [holds, count]
                properties:
                  holds: { type: array, items: { $ref: "#/components/schemas/Hold" } }
                  count: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/terms:
    post:
      operationId: createTerms
      summary: Publish a version of terms
      description: >
        Records the terms a party can later be shown to have agreed to. Versioned,
        because consent to a document is only meaningful against the exact text
        that was consented to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:terms:1"
      responses:
        "201":
          description: Created; `publishedAt` defaults to now.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:terms:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorizations:
    post:
      operationId: createAuthorization
      summary: Grant a party a function within a context
      description: >
        Records that someone may do something somewhere, for some period. Defaults
        to state ACTIVE approved now. What the function names means is programme
        configuration; that an authorization exists and is time-bounded is
        infrastructure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:authorization:1"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:authorization:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorizations/permits:
    get:
      operationId: permits
      summary: May this party do this, here, at this moment?
      description: >
        A yes/no against the authorizations on file, evaluated at a point in time.
        `at` is a parameter rather than always-now so a caller can ask whether an
        action was permitted when it happened — an authorization that has since
        expired did not retroactively un-permit last month's work.
      parameters:
        - { name: partyId, in: query, schema: { type: string } }
        - { name: function, in: query, schema: { type: string } }
        - { name: contextId, in: query, schema: { type: string } }
        - name: at
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339. Defaults to the service clock's now.
      responses:
        "200":
          description: The answer, and the instant it was evaluated at.
          content:
            application/json:
              schema:
                type: object
                required: [permitted, at]
                properties:
                  permitted: { type: boolean }
                  overdue:
                    type: boolean
                    description: >
                      Every authorization behind this yes is past its review-by
                      date (§16). Never changes `permitted` — "flag overdue, keep
                      working" — and a caller that ignores it loses nothing a
                      worker needed.
                  at: { type: string, format: date-time }
        "400":
          description: "`at` is not RFC3339."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorizations/overdue:
    get:
      operationId: overdueAuthorizations
      summary: The review queue
      description: >
        Every ACTIVE authorization past its `reviewBy` date (§16). Listing it is
        the entire consequence of being overdue — nothing reads this to refuse
        anything, because a missed calendar entry must never withhold a worker's
        payment. A custodian surface, like /v1/holds.
      responses:
        "200":
          description: Overdue authorizations, oldest review date first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizations:
                    type: array
                    items: { $ref: "urn:crest:schema:primitives:authorization:1" }
                  count: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorizations/{id}/revoke:
    post:
      operationId: revokeAuthorization
      summary: Revoke an authorization
      description: >
        The narrowing instrument (§16, J3). Narrowing binds at submission:
        revocation stops NEW work — the next permits() check answers no — and
        touches nothing in flight, because evidence already submitted was checked
        when it entered and the worker cannot un-perform the work. To narrow
        rather than remove, revoke and create the narrower grant; there is
        deliberately no edit, because an edited grant has no record of what it
        used to allow. Idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The authorization, now REVOKED.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:authorization:1"
        "404":
          description: No such authorization.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/contexts:
    post:
      operationId: createContext
      summary: Create a context
      description: >
        The programme, geography or deployment that scopes everything else —
        roster ids, authorizations, evidence batches. Contexts are what stop two
        deployments' identifiers colliding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:context:1"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:context:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }

  # ── Projects (J3) ─────────────────────────────────────────────────────────
  #
  # A project is a Context (§2: "'Project' and 'campaign' are what profiles
  # call it"). These paths are a face over that primitive and over
  # Authorization, not a second store of either. Everything a deployment
  # could reasonably disagree about — coverage, composition choice names and
  # values, definition origins, payment postures, role and function
  # vocabularies, gate names, finance-code formats, sector taxonomies — is an
  # opaque string or an opaque object here, and no schema below enumerates any
  # of it.
  /v1/projects:
    post:
      operationId: createProject
      summary: Create a project and hand it to a configurator
      description: >
        Screen `p1_3`. Creating a project is not configuring one: what this
        endpoint accepts is a name, an owning organisation, an opaque
        configuration object (where coverage lives) and the party being named
        as Configurator. Everything that decides how the project runs arrives
        later, through a route that records who decided it.


        Naming a configurator is a proposal, not an assignment. The project
        comes back with `ownership.state = PENDING` and stays there until the
        named party answers (design finding F2).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ownerPartyId]
              properties:
                id: { type: string, description: "Supplied only by a seeder replaying a fixture world." }
                name: { type: string }
                kind:
                  type: string
                  default: project
                  description: >
                    Profile vocabulary. The core does not read the word — a
                    cohort and a campaign are the same primitive.
                ownerPartyId:
                  type: string
                  description: >
                    The owning organisation. Must be APPROVED: party shape is
                    not authority, because POST /v1/parties is the open
                    bootstrap door.
                configuratorPartyId:
                  type: string
                  description: The party being named. Optional — a project can be created unhanded.
                parentId: { type: string }
                period: { $ref: "urn:crest:schema:primitives:common:1#/$defs/period" }
                configuration:
                  type: object
                  description: >
                    L2, opaque. Coverage, and anything else this deployment's
                    profile puts on a project. Stored and returned, never read
                    inside.
                activationGates:
                  type: array
                  items: { type: string }
                  description: This deployment's readiness conditions, by name.
      responses:
        "201":
          description: Created, DRAFT, and unacknowledged if a configurator was named.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectView" }
        "400": { $ref: "#/components/responses/BadBody" }
        "403":
          description: Not permitted to act for the owning organisation, or the organisation is not APPROVED.
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/SchemaViolation" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listProjects
      summary: One party's projects
      description: >
        Screen `p1_1`'s project list, and `n2`'s "where do you want to work".


        Exactly one of `ownerPartyId` and `configuratorPartyId` is required,
        and the caller is authorized against whichever they gave. An
        unnarrowed listing would answer "which projects exist and who
        configures each" to any signed-in caller — the membership oracle #68
        closed on the authorization listing, wearing a different query string.


        Filter `ownership=DECLINED` for the Org Admin's queue: a declined
        handover returns the project here rather than deleting it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ownerPartyId, in: query, schema: { type: string } }
        - { name: configuratorPartyId, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, CLOSED] } }
        - { name: ownership, in: query, schema: { type: string, enum: [PENDING, ACCEPTED, DECLINED] } }
      responses:
        "200":
          description: The projects, each with its activation conditions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/ProjectView" } }
                  count: { type: integer }
        "400": { description: "Neither or both narrowing parameters were given." }
        "403": { description: Not permitted to act for the party named. }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/projects/{id}:
    get:
      operationId: getProject
      summary: One project, with what arrived and what is still unanswered
      description: >
        Screen `n4`'s "what arrived, already decided" column, read from the
        record rather than re-entered.


        Answers the owning organisation, somebody holding `act-for-party` for
        it in this context, or the named configurator themselves — who at the
        moment of deciding whether to accept may hold no grant at all. Reading
        the handover must not require the grant that accepting it is a
        precondition for.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The project, its activation conditions and its configuration records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectView" }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{id}/configurator:
    post:
      operationId: nameProjectConfigurator
      summary: Hand the project to a configurator
      description: >
        The handover, and the re-handover after a decline that keeps the Org
        Admin's queue actionable. Always results in PENDING — including after
        an ACCEPTED one, because a person who agreed to configure a project
        has not thereby agreed to hand it on.


        The owning organisation's act, never the outgoing configurator's: a
        configurator who could hand the project on would be delegating an
        authority granted to them personally.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuratorPartyId]
              properties:
                configuratorPartyId: { type: string }
      responses:
        "200":
          description: Handed over, PENDING.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectView" }
        "400": { $ref: "#/components/responses/BadBody" }
        "403": { description: Not permitted to act for the owning organisation. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{id}/ownership-decision:
    post:
      operationId: decideProjectOwnership
      summary: Accept or decline a project handed to you
      description: >
        Screen `n4`, and design finding F2. The reference's `p1_3 → p2_1` step
        changes actor with no acknowledgement, which leaves a project that
        looks staffed and is not.


        Declining is a first-class outcome and not an error: it records who
        declined and why, leaves the project and every record keyed to it
        exactly where they were, and returns the project to the Org Admin's
        queue by way of an ownership state they can filter on. A reason is
        required of a decline, for the same reason a held payment carries a
        reason with an owner.


        Answered by the named configurator, or by somebody proven to act for
        them. A settled handover stays settled — a second answer is refused
        rather than overwriting the first.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, declined] }
                reason:
                  type: string
                  description: Required when declining.
      responses:
        "200":
          description: The answer, recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectView" }
        "400": { $ref: "#/components/responses/BadBody" }
        "403": { description: Not the named configurator. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Nobody was handed this project, or the handover is already answered. }
        "422": { description: A decline with no reason. }

  /v1/projects/{id}/ownership:
    get:
      operationId: readProjectOwnership
      summary: The handover, and every answer it has ever had
      description: >
        The current state, plus the append-only trail. The trail is the point:
        after a re-handover the current view says PENDING again, and "who
        declined this, and why" would otherwise be gone — which on a system
        whose records decide whether somebody gets paid is the record most
        worth keeping.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Current ownership and the trail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId: { type: string }
                  ownerPartyId: { type: string }
                  ownership: { $ref: "urn:crest:schema:primitives:context:1#/properties/ownership" }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        event: { type: string, enum: [NAMED, ACCEPTED, DECLINED] }
                        partyId: { type: string, description: The party the event is about. }
                        actorPartyId: { type: string, description: The party who did it. }
                        reason: { type: string }
                        at: { type: string, format: date-time }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{id}/activation:
    get:
      operationId: readProjectActivation
      summary: What this project still needs before it runs
      description: >
        Screen `p2_7`. Every condition, satisfied ones included — a list of
        only the unmet ones cannot tell a ready project from one whose gates
        were never declared, and those are not the same project.


        Two conditions are infrastructure's own: the handover must be
        acknowledged, and the project must be DRAFT. Every other condition is
        a gate name this deployment declared, and the core never reads the
        word.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The conditions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationView" }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: activateProject
      summary: Activate the project
      description: >
        Screen `p2_7`'s button. A refusal answers 409 with every condition and
        which of them are unmet: "cannot activate" without saying what is
        missing is a dead end, and this system does not leave people at dead
        ends. Activating an already-ACTIVE project is the outcome the caller
        wanted, and answers 200.


        A named configurator may write here only once they have **ACCEPTED** the
        handover; before that, and after a decline, this answers 409
        `handover_not_accepted`. Naming is a proposal, and a proposal must not
        carry authority — otherwise the acknowledgement is decoration. The
        owning organisation is unaffected: it is the authority.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: ACTIVE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationView" }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Conditions unmet, or the project is CLOSED. The body names them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationView" }

  /v1/projects/{id}/activation/gates:
    put:
      operationId: declareProjectGates
      summary: Declare this project's readiness conditions
      description: >
        Gate names are L2 vocabulary, so the list is the caller's to set. What
        is not the caller's is the satisfaction timestamp: re-declaring a gate
        keeps an answer somebody already gave, and a newly declared gate
        starts unsatisfied.


        A named configurator may write here only once they have **ACCEPTED** the
        handover; before that, and after a decline, this answers 409
        `handover_not_accepted`. Naming is a proposal, and a proposal must not
        carry authority — otherwise the acknowledgement is decoration. The
        owning organisation is unaffected: it is the authority.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gates: { type: array, items: { type: string } }
      responses:
        "200":
          description: The conditions after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationView" }
        "400": { description: An unnamed or duplicated gate. }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The caller was named this project's configurator but has not accepted the handover." }

  /v1/projects/{id}/activation/gates/{name}/satisfied:
    post:
      operationId: satisfyProjectGate
      summary: Mark one declared gate satisfied
      description: >
        At the service's clock, never at a time the caller chose, and
        re-asserting a satisfied gate does not move its date. An undeclared
        gate is refused rather than created: a gate that appears when it is
        satisfied never gated anything.


        A named configurator may write here only once they have **ACCEPTED** the
        handover; before that, and after a decline, this answers 409
        `handover_not_accepted`. Naming is a proposal, and a proposal must not
        carry authority — otherwise the acknowledgement is decoration. The
        owning organisation is unaffected: it is the authority.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The conditions after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationView" }
        "403": { description: Not permitted. }
        "404": { description: No such project, or no such declared gate. }
        "409": { description: "The caller was named this project's configurator but has not accepted the handover." }

  /v1/projects/{id}/roles:
    post:
      operationId: grantProjectRole
      summary: Grant a role on this project
      description: >
        Screen `p2_6`, and the grant a configurator needs before `n5` stops
        guarding them. The grant is an Authorization, unchanged: the authority
        is the owning organisation, the scope is this project, and the grantor
        and grant date were already fields on the primitive — which is why "a
        role is held, not just recorded" needed no new storage.


        `functions` is the whole role vocabulary: opaque L2 strings the core
        stores without knowing what any of the words mean.


        The owning organisation's act. Deliberately not open to the named
        configurator, who must not be able to grant themselves anything.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "201":
          description: The grant, as the People & roles screens read it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleGrant" }
        "400": { $ref: "#/components/responses/BadBody" }
        "403": { description: Not permitted, or the owning organisation is not APPROVED. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: No terms for the grant to stand on, and CREST will not invent a permission set. }
        "422": { $ref: "#/components/responses/SchemaViolation" }
    get:
      operationId: listProjectRoles
      summary: Who holds a role on this project
      description: >
        Screen `n5`'s read-only half and `p2_6`'s list: the holders, with the
        grant date and the grantor named from real authorization data, and
        `grantableBy` naming the organisation a guard can point at — a refusal
        without an owner is a dead end.


        Revoked and expired grants are listed with their state rather than
        filtered out, because a console showing only live grants cannot answer
        "who used to be able to do this, and who took it away".


        Not the roster query #68 refused: that refusal protects "where does
        this person work" asked about an arbitrary person, and this answers
        "who holds a role on this project" to the project's own organisation.
        Worker participation is a Claim, not an Authorization, so no worker
        appears here by holding work.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The role holders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId: { type: string }
                  roles: { type: array, items: { $ref: "#/components/schemas/RoleGrant" } }
                  count: { type: integer }
                  grantableBy: { type: string }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organisations/{id}/roles:
    get:
      operationId: listOrganisationRoles
      summary: Who holds a role under this organisation
      description: >
        Screen `p1_2`: the standing configuration's people, at instance scope.


        The question GET /v1/authorizations cannot answer — that endpoint keys
        on the party who HOLDS a grant, and this one keys on the party who
        GAVE it. Answered to the granting organisation itself, or to somebody
        proven to act for it, and to nobody else.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: The role holders under this authority.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisationId: { type: string }
                  roles: { type: array, items: { $ref: "#/components/schemas/RoleGrant" } }
                  count: { type: integer }
                  grantableBy: { type: string }
        "403": { description: Not permitted to act for this organisation. }

  /v1/projects/{id}/composition/{choice}:
    put:
      operationId: recordCompositionChoice
      summary: Record one composition choice
      description: >
        Screens `p2_1` (five choices, answered separately), `p2_3` (definition
        origin) and `p2_5` (payment posture).


        The choice's name and its value are both this deployment's vocabulary
        and both stored opaquely — there is no enum of postures or origins
        anywhere in CREST, because two deployments could reasonably disagree
        about every one of them and both still be CREST. What infrastructure
        contributes is that somebody's name and a timestamp are attached to
        every answer, and that answering one choice never overwrites another.


        A named configurator may write here only once they have **ACCEPTED** the
        handover; before that, and after a decline, this answers 409
        `handover_not_accepted`. Naming is a proposal, and a proposal must not
        carry authority — otherwise the acknowledgement is decoration. The
        owning organisation is unaffected: it is the authority.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: choice
          in: path
          required: true
          schema: { type: string }
          description: A slug. The core checks that it is a name and nothing else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: >
                    Anything JSON. An unanswered choice is the absence of a
                    record, not a null.
                note: { type: string }
      responses:
        "200":
          description: The record, with its decider and date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextRecord" }
        "400": { description: A choice name that is not a slug, or a missing value. }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The caller was named this project's configurator but has not accepted the handover." }

  /v1/projects/{id}/composition:
    get:
      operationId: readProjectComposition
      summary: The composition choices, with who decided each
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The choices recorded so far. An absent choice is unanswered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId: { type: string }
                  choices: { type: array, items: { $ref: "#/components/schemas/ContextRecord" } }
                  count: { type: integer }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/partners:
    get:
      operationId: partnerDirectory
      summary: The approved organisations, which is what registration was for
      description: >
        Screen `p2_17`. Nothing here re-examines an organisation and nothing
        here can change one: the read is a join over decisions somebody else
        already made, some of them years ago.


        The three filters are all L2 vocabulary — a sector taxonomy, a country
        list and a permission set, all the deployment's. `permission` filters
        on what the organisation's accepted terms actually carry, "so nobody
        appears here who could not do the work".


        This is an authenticated read of registry facts, deliberately not the
        published organisation face: that face stays the allowlist it is, and
        self-declared attributes appear here precisely because they must never
        appear there.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sector, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - name: permission
          in: query
          schema: { type: array, items: { type: string } }
          description: Repeatable. Every one given must be covered by the organisation's terms.
      responses:
        "200":
          description: The approved organisations matching the filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partners:
                    type: array
                    items:
                      type: object
                      properties:
                        partyId: { type: string }
                        displayName: { type: string }
                        sector: { type: string }
                        country: { type: string }
                        termsId: { type: string }
                        termsVersion: { type: integer }
                        permissions: { type: array, items: { type: string } }
                        approvedAt: { type: string, format: date-time }
                  count: { type: integer }
        "401": { description: This surface answers signed-in callers. }

  /v1/projects/{id}/partner-grants:
    post:
      operationId: grantPartner
      summary: Grant a partner what it may do on this project
      description: >
        Screen `p2_18`. Three rules, all of them infrastructure:


        The partner must be an APPROVED organisation, because the directory's
        promise is that onboarding already happened.


        The grant must carry an end date. "The grant lapses on 31 March by
        itself" is the screen's whole subject — and what ends is permission to
        do more, never the standing of what was already validated.


        The functions must be covered by the terms the partner actually
        accepted; a wider grant is a permission nobody agreed to. The grant
        rides that exact terms version rather than one the caller chose,
        because which terms an organisation held is the fact a verifier walks
        back to.


        The grant is not delegable — that is the Authorization primitive's own
        rule, and it is why a sub-contracted body is invited by the project
        directly rather than brought in by its partner.


        A named configurator may write here only once they have **ACCEPTED** the
        handover; before that, and after a decline, this answers 409
        `handover_not_accepted`. Naming is a proposal, and a proposal must not
        carry authority — otherwise the acknowledgement is decoration. The
        owning organisation is unaffected: it is the authority.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "201":
          description: The grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleGrant" }
        "400": { $ref: "#/components/responses/BadBody" }
        "403": { description: Not permitted, or the partner is not an APPROVED organisation. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The organisation has accepted no terms, so there is nothing to be narrower than. }
        "422":
          description: >
            No end date, or functions wider than the terms — the uncovered
            functions are listed by name.
    get:
      operationId: listPartnerGrants
      summary: The partner grants on this project
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The grants held by organisations on this project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId: { type: string }
                  grants: { type: array, items: { $ref: "#/components/schemas/RoleGrant" } }
                  count: { type: integer }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{id}/finance-link:
    put:
      operationId: linkFinanceCode
      summary: Link this project to a finance code
      description: >
        Screen `p2_8`, whose title is the rule: CREST does not invent account
        codes. The code arrives from a finance system that already had it, is
        stored verbatim, and is never generated, formatted, validated against
        a pattern or reserved here. The screen's own callout is why — a code
        that reads correctly and was closed last year is a rejection weeks
        after the work was validated, and only the finance system can know
        that.


        `system` is required for the same reason: a code with no named source
        cannot be traced back to whoever minted it.


        A named configurator may write here only once they have **ACCEPTED** the
        handover; before that, and after a decline, this answers 409
        `handover_not_accepted`. Naming is a proposal, and a proposal must not
        carry authority — otherwise the acknowledgement is decoration. The
        owning organisation is unaffected: it is the authority.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [system, code]
              properties:
                system: { type: string, description: The finance system the code belongs to. }
                code: { type: string, description: That system's own string, stored verbatim. }
                label: { type: string }
                note: { type: string }
      responses:
        "200":
          description: The link, with who linked it and when.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextRecord" }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: A link with no system or no code. }
        "409": { description: "The caller was named this project's configurator but has not accepted the handover." }
    get:
      operationId: readFinanceLink
      summary: This project's finance-code link
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextRecord" }
        "403": { description: Not permitted. }
        "404": { description: No project, or no link recorded — which is an honest answer, not an error state. }

  /v1/projects/{id}/support-owner:
    put:
      operationId: setSupportOwner
      summary: Who a worker reaches when something goes wrong
      description: >
        Screen `p2_10`: support belongs to the project, not the platform. The
        fact this stores is the one that move needs — a named party a worker's
        question reaches, which must resolve to a real Party, because a
        support owner nobody can name is the dead end that leaves a worker
        with a missing payment and no explanation attached.


        `escalatesToPartyId` is optional and its absence is honest: it means
        escalation has not been arranged, not that it is unnecessary.


        A named configurator may write here only once they have **ACCEPTED** the
        handover; before that, and after a decline, this answers 409
        `handover_not_accepted`. Naming is a proposal, and a proposal must not
        carry authority — otherwise the acknowledgement is decoration. The
        owning organisation is unaffected: it is the authority.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId]
              properties:
                partyId: { type: string }
                contactRoute:
                  type: object
                  properties:
                    kind: { type: string }
                    value: { type: string }
                escalatesToPartyId: { type: string }
                note: { type: string }
      responses:
        "200":
          description: The owner, with who set it and when.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextRecord" }
        "403": { description: Not permitted. }
        "404": { description: No project, or the named owner is not a Party here. }
        "422": { description: No party named, or a contact route missing a kind or a value. }
        "409": { description: "The caller was named this project's configurator but has not accepted the handover." }
    get:
      operationId: readSupportOwner
      summary: This project's support owner
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextRecord" }
        "403": { description: Not permitted. }
        "404": { description: No project, or no owner recorded. }

  # Every CREST service carries these two, added by pkg/httpx.Server.
  /healthz: { $ref: "#/components/pathItems/healthz" }
  /readyz: { $ref: "#/components/pathItems/readyz" }


  /internal/clock:
    get:
      operationId: readClock
      summary: What time does this service think it is?
      description: >
        Present only when CLOCK_DRIVEABLE is set, which pkg/service refuses in
        production. The confirmation window is seven days; a harness that waits
        seven days is not a harness, and one that shortens the window to a second
        is testing a different system. So outside production a service is handed
        its time. In production this path does not exist, because a clock an HTTP
        call can move is a clock that can close a worker's window early on them.
      responses:
        "200":
          description: The service's current time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
    post:
      operationId: setClock
      summary: Move this service's clock
      description: >
        Set an instant, or advance by a duration. The harness moves every service
        together: a stack where evidence is on Tuesday and confirmation is on
        Friday produces results that are nobody's design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: string, format: date-time }
                advance: { type: string, description: "A Go duration, e.g. 168h." }
      responses:
        "200":
          description: The clock after the move.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
        "400":
          description: Neither an instant nor a duration, or a duration that does not parse.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/organisations/{id}/registration:
    get:
      operationId: getRegistration
      summary: Where an organisation's application stands
      description: >
        The applicant-facing read: state, exact terms version accepted, decider
        and reason — plus the organisation's self-declared `attributes` (kind,
        sector, country, contact person; #168). Attributes are bounded strings
        from the Party's generic attributes map; the vocabulary is deployment
        configuration, and they are never published to the public log.
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      responses:
        "200":
          description: The registration, with the organisation's attributes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partyId: { type: string }
                  state: { type: string }
                  termsId: { type: string }
                  termsVersion: { type: integer }
                  acceptedAt: { type: string, format: date-time }
                  decidedBy: { type: string }
                  reason: { type: string }
                  appliedAt: { type: string, format: date-time }
                  attributes:
                    type: object
                    additionalProperties: { type: string }
        "404":
          description: No such organisation application.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/organisations/{id}/decision:
    post:
      operationId: decideRegistration
      summary: Approve or reject a registering organisation
      description: >
        The rest of the onboarding surface (#20) is not yet in this document; this
        one path is here because caller identity changed its contract, and a
        changed contract with no written form is the gap this file exists to close.


        `decidedBy` is now checked rather than recorded. The self-approval rule —
        an organisation may not approve itself — was always a constraint on a value
        the caller chose, which made it a rule about typing: an applicant satisfied
        it by naming somebody else. It becomes a rule about people only once the
        name has been proved, which is what the bearer token does.


        A rejection needs a reason, for the same reason a held payment does: a
        closed door with no explanation attached leaves the applicant with nothing
        to act on.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PartyID" }, { $ref: "#/components/parameters/OnBehalfOf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, decidedBy]
              properties:
                approve: { type: boolean }
                decidedBy:
                  type: string
                  description: >
                    Must be the party the caller authenticated as, or one they hold
                    `act-for-party` for.
                reason: { type: string, description: Required when rejecting. }
      responses:
        "401":
          description: >
            No verified caller, or a token that did not verify. This endpoint acts
            in somebody's name and will not act on an asserted party id.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: >
            The caller is authenticated and may not do this — `subject_not_enrolled`
            when no party here is bound to their identity (an ordinary state for
            somebody not yet enrolled), `party_not_proven` when the request names a
            party other than the one it authenticated as, `not_permitted_to_act_for`
            when it asks to act for somebody without the authorization.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "200":
          description: The registration, in its new state.
        "400":
          description: No decidedBy, or a rejection with no reason.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >
            Self-approval, or approval before terms were accepted. Both are
            enforced in the service and by a CHECK constraint, so a future code
            path that forgets still cannot write the row.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  # ── The G-2 onboarding journey (§15 J1): invitations and wider terms ────

  /v1/projects/{id}/invitations:
    post:
      operationId: sendInvitation
      summary: Invite an organisation onto this project
      description: >
        Screens `g2_9`/`g2_10`. The invitation is the OFFER whose acceptance
        creates the partner grant `POST .../partner-grants` writes — same
        authority, same scope, same terms-as-ceiling rule, one transaction at
        acceptance. It is not a new primitive: the standing fact is the
        Authorization, and the invitation is the recorded offer-and-answer.


        The invitee must be an organisation Party, but its registration need
        not be decided yet — `g2_5`'s point is that registration stands alone,
        so an offer may arrive before or after the registry's decision.
        Acceptance, not sending, is where approval is checked. The offer must
        carry an end date, because the grant it becomes must.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, functions, period]
              properties:
                partyId: { type: string }
                functions:
                  type: array
                  items: { type: string }
                  description: Opaque L2 strings; the core never reads the words.
                period:
                  type: object
                  description: Must carry `end` — an offer of a grant that ends.
                note: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: The offer, SENT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { description: Not permitted to configure this project. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The named configurator has not accepted the handover. }
        "422": { description: Not an organisation, no functions, or no end date. }
    get:
      operationId: listProjectInvitations
      summary: The offers this project has made
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [SENT, ACCEPTED, DECLINED] } }
      responses:
        "200":
          description: This project's invitations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
                  count: { type: integer }
        "403": { description: Not permitted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organisations/{id}/invitations:
    get:
      operationId: listOrganisationInvitations
      summary: The organisation's invitation inbox
      description: >
        `g2_9`'s source. Narrowed to the organisation and authorized against
        it, for the same reason `GET /v1/projects` narrows — who is courting
        whom is not a public listing.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PartyID" }
        - { name: state, in: query, schema: { type: string, enum: [SENT, ACCEPTED, DECLINED] } }
      responses:
        "200":
          description: The invitations addressed to this organisation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
                  count: { type: integer }
        "403": { description: Not this organisation, and not permitted to act for it. }

  /v1/invitations/{id}:
    get:
      operationId: getInvitation
      summary: One offer, with its whole trail
      description: >
        The offer plus every event there has been — the questions included,
        because a question asked on the record is on the record. Readable by
        the invited organisation (which may hold nothing on the project yet)
        and by anybody the project's own view gate admits.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The invitation and its events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  events: { type: array, items: { $ref: "#/components/schemas/InvitationEvent" } }
        "403": { description: Neither side of the offer. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/invitations/{id}/decision:
    post:
      operationId: decideInvitation
      summary: Accept or decline an invitation
      description: >
        `g2_9`'s Accept and Decline. Declining records who and why and destroys
        nothing — it contests the offer, not the organisation's standing.


        Accepting is where the ordering gate lives (`g2_5`): the organisation
        must by now be APPROVED and hold accepted terms, and the offered
        functions must fit inside them — because acceptance creates the partner
        grant in the same transaction, riding the organisation's own accepted
        terms version, so there is no state in which the org said yes and holds
        nothing (`g2_10`). An undecided registration answers 409 with "not
        yet", never "no": the offer does not expire with the wait.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, declined] }
                reason: { type: string, description: Required when declining. }
      responses:
        "200":
          description: The answered invitation; `grantId` names the grant an acceptance created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadBody" }
        "403": { description: Not the invited organisation, and not permitted to act for it. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Already answered, the registration is not yet APPROVED, or the
            organisation has accepted no terms.
        "422":
          description: >
            A decline with no reason, or an offer that outgrew the terms —
            every uncovered function named.

  /v1/invitations/{id}/questions:
    post:
      operationId: askInvitationQuestion
      summary: Ask a question on an open offer
      description: >
        `g2_9`'s third button. Either side — the invited organisation, or the
        project's owner or named configurator — may ask while the offer is
        open. A question changes no state; it is conversation on the record,
        appended to the trail. After the answer there is nobody holding the
        offer, so the trail closes with it.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [askedBy, text]
              properties:
                askedBy: { type: string }
                text: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: The recorded question.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationEvent" }
        "400": { $ref: "#/components/responses/BadBody" }
        "403": { description: The asker is neither side of this offer. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The offer has been answered. }

  /v1/organisations/{id}/terms-requests:
    post:
      operationId: createTermsRequest
      summary: Open a request for wider terms
      description: >
        Screens `g2_6`/`g2_7`/`g2_11`. An APPROVED organisation asks to move to
        a wider *published* terms version — APPROVED only, deliberately:
        registration-time terms go through `.../terms-acceptance` and the
        registration decision, and this door is the one thing that path cannot
        do, which is move an already-approved organisation with review in
        between.


        Qualification documents are DECLARED, never uploaded: `{kind, ref,
        hash}` — the kind from the deployment's own taxonomy (L2, opaque
        here), the ref into its own document custody, bounded and single-line
        so nothing document-shaped can be smuggled in. This service has no
        blob store and grows none.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PartyID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [termsId, termsVersion]
              properties:
                termsId: { type: string }
                termsVersion: { type: integer, minimum: 1 }
                documents:
                  type: array
                  items: { $ref: "#/components/schemas/DeclaredDocument" }
      responses:
        "201":
          description: The request, DRAFT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermsRequest" }
        "403": { description: Not this organisation, or its registration is not APPROVED. }
        "422": { description: No such published terms version, or an invalid document declaration. }
    get:
      operationId: listOrganisationTermsRequests
      summary: This organisation's terms requests
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PartyID" }
        - { name: state, in: query, schema: { type: string, enum: [DRAFT, SUBMITTED, WITHDRAWN, APPROVED, DENIED] } }
      responses:
        "200":
          description: The requests, newest state included.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { $ref: "#/components/schemas/TermsRequest" } }
                  count: { type: integer }
        "403": { description: Not this organisation, and not permitted to act for it. }

  /v1/terms-requests:
    get:
      operationId: listTermsRequestQueue
      summary: The review queue
      description: >
        The queue `g2_8`'s "sent for review" lands in. Authenticated like the
        partner directory: who reviews is L2 routing this service does not
        encode. `state` defaults to SUBMITTED because the queue is the
        question this read answers.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [DRAFT, SUBMITTED, WITHDRAWN, APPROVED, DENIED], default: SUBMITTED } }
      responses:
        "200":
          description: The matching requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { $ref: "#/components/schemas/TermsRequest" } }
                  count: { type: integer }
        "401": { description: No verified caller. }

  /v1/terms-requests/{id}:
    get:
      operationId: getTermsRequest
      summary: One request, whole
      description: >
        State, declared documents, the append-only trail and every check
        verdict — `g2_8`'s status view and `g2_12`'s "what is checked" on one
        read.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The request, its events and its checks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: "#/components/schemas/TermsRequest" }
                  events: { type: array, items: { $ref: "#/components/schemas/TermsRequestEvent" } }
                  checks: { type: array, items: { $ref: "#/components/schemas/CheckVerdict" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/terms-requests/{id}/documents:
    put:
      operationId: replaceRequestDocuments
      summary: Save the draft's declared documents
      description: >
        `g2_7`'s "Save draft". DRAFT only — after submission the reviewer must
        be looking at what was submitted.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documents:
                  type: array
                  items: { $ref: "#/components/schemas/DeclaredDocument" }
      responses:
        "200":
          description: The draft, with its new list.
          content: { application/json: { schema: { $ref: "#/components/schemas/TermsRequest" } } }
        "403": { description: Not this organisation. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not a draft any more. }
        "422": { description: An invalid document declaration. }

  /v1/terms-requests/{id}/submit:
    post:
      operationId: submitTermsRequest
      summary: Send the request for review
      description: >
        `g2_7`'s "Submit" → `g2_8`. The declared documents freeze and the
        request enters the review queue. Whether they are ENOUGH is the
        review's question, under L2 policy; whether the request is a
        submittable thing is this endpoint's.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: SUBMITTED, with the submitter and time on it.
          content: { application/json: { schema: { $ref: "#/components/schemas/TermsRequest" } } }
        "403": { description: Not this organisation. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already submitted, or already settled. }

  /v1/terms-requests/{id}/withdraw:
    post:
      operationId: withdrawTermsRequest
      summary: Withdraw a submitted request
      description: >
        `g2_8`'s "Withdraw". The organisation's own act, only while the request
        waits; a decided request is somebody else's answer and withdrawal
        cannot erase it. The reason is optional — withdrawing your own ask is
        not a refusal — but the actor is recorded always.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: WITHDRAWN.
          content: { application/json: { schema: { $ref: "#/components/schemas/TermsRequest" } } }
        "403": { description: Not this organisation. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not submitted, or already decided. }

  /v1/terms-requests/{id}/checks:
    post:
      operationId: recordCheckVerdict
      summary: Record one check's verdict
      description: >
        `g2_12`, honestly. The screen says this stage "mostly runs without a
        person"; no automated checker exists in this codebase today, so a check
        is a RECORDED VERDICT, never a simulation — a binary outcome with an
        owner who answers for it: a `party`, or a named `policy` (the slot the
        eventual business-register adapter fills, writing verdicts through this
        same door under its policy name). The check NAMES are the deployment's
        catalogue, L2 and opaque here. Verdicts are append-only and recordable
        only while the request is SUBMITTED: a check on a draft examines a
        moving target, and a check after the decision checked nothing the
        decision used. The applicant may neither own nor record verdicts on its
        own request.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, outcome, ownerKind, recordedBy]
              properties:
                name: { type: string }
                outcome: { type: string, enum: [PASS, FAIL] }
                ownerKind: { type: string, enum: [party, policy] }
                owner:
                  type: string
                  description: Defaults to the proven recorder when ownerKind is `party`.
                note: { type: string, maxLength: 2000 }
                recordedBy: { type: string }
      responses:
        "201":
          description: The recorded verdict.
          content: { application/json: { schema: { $ref: "#/components/schemas/CheckVerdict" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "403": { description: The recorder is not who they claim. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The request is not under review. }
        "422": { description: An outcome that is neither PASS nor FAIL, an unowned verdict, or a self-check. }
    get:
      operationId: listCheckVerdicts
      summary: The verdicts recorded on this request
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Every verdict, in the order recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks: { type: array, items: { $ref: "#/components/schemas/CheckVerdict" } }
                  count: { type: integer }
        "401": { description: No verified caller. }

  /v1/terms-requests/{id}/decision:
    post:
      operationId: decideTermsRequest
      summary: Approve or deny a terms request
      description: >
        The registration decision's posture, one stage later: the decider is
        named and proven, is never the applicant, and a denial carries a
        reason. A terms upgrade always requires a named decision, whatever
        `REGISTRY_ORG_APPROVAL` says about first registration — wider terms are
        the moment an organisation gains powers it did not have.


        On approval the organisation's registration moves to the requested
        terms in the same transaction, and the terms it held until that moment
        are captured on the request (`previousTermsId`/`previousTermsVersion`)
        — the registration row only ever shows the current answer. Whether the
        recorded checks are sufficient is the decider's judgement under L2
        policy; this endpoint does not count PASSes.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, decidedBy]
              properties:
                approve: { type: boolean }
                decidedBy: { type: string }
                reason: { type: string, description: Required when denying. }
      responses:
        "200":
          description: The request, decided.
          content: { application/json: { schema: { $ref: "#/components/schemas/TermsRequest" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "403": { description: The decider is not who they claim. }
        "404": { description: No such request, or the organisation's registration is no longer APPROVED. }
        "409": { description: Self-decision, not submitted, or already decided. }
        "422": { description: A denial with no reason. }

  /internal/identity/subjects/{subject}:
    get:
      operationId: partyForSubject
      summary: Which party a verified subject is
      description: >
        Turns a verified token's subject into the party it is bound to, for the six
        services that do not own the parties table.


        Under `/internal/` and deliberately unauthenticated: a service resolving who
        its caller is cannot itself require a resolved caller, and requiring a token
        here would be a bootstrap that never completes. What that costs is stated
        rather than hidden — a subject reaching this endpoint gets a party id back
        without a token. It is not something a stranger can act on, since the
        subject is this deployment's salted pairwise value and knowing one means
        having already authenticated as that person, but restricting `/internal/` to
        the service network is the deployment's job and is not done by this code.
      parameters:
        - name: subject
          in: path
          required: true
          schema: { type: string }
          description: This deployment's salted pairwise subject, not the provider's `sub`.
      responses:
        "200":
          description: The party bound to that subject.
          content:
            application/json:
              schema:
                type: object
                properties: { partyId: { type: string } }
        "404":
          description: >
            Nobody is bound to that subject. An ordinary state rather than an error:
            somebody the identity provider knows who has not been enrolled here, which
            enrolment fixes and a retry does not.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/identifiers:
    get:
      operationId: partyIdentifiers
      summary: Which party ids are one person
      description: >
        The read side of a merge (#100). Resolving a duplicate hold with `merge`
        marks the absorbed party `mergedInto` and rewrites nothing else: it keeps
        its id, its keys and its history, and every claim, window and payment
        instruction already written still names it. That is deliberate — a claim
        that said whose work it was at the time is a true statement, and editing
        it would destroy the only record of what the system believed before it
        corrected itself.


        So reads follow the pointer instead, and this is the endpoint they follow
        it through. Asking about anybody in a merge chain returns the whole chain
        with the survivor first, whether the id given was the survivor's or an
        absorbed one — the printed cards and saved links naming the old id have
        to keep working, and telling a worker their record is gone would be the
        system punishing them for its own correction.


        Answered only to the worker, or somebody authorised to act for them
        (#104): "this person was recorded twice" is a fact about the worker a
        stranger has no claim on, and a verifier resolving a party gets the
        chain's credentials from verification without this mapping. The services
        follow merges through an internal twin of this route instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PartyID" }
        - { $ref: "#/components/parameters/OnBehalfOf" }
      responses:
        "200":
          description: The ids that are this person.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partyId:
                    type: string
                    description: The survivor — the id the person is known by now.
                  identifiers:
                    type: array
                    items: { type: string }
                    description: Survivor first, then every absorbed id, transitively.
                  merged:
                    type: boolean
                    description: Whether this person has more than one id at all.
        "401":
          description: No usable token.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: The caller is not this party and is not authorised to act for them.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such party.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries:
    post:
      operationId: openRecovery
      summary: Open a recovery for a worker who lost their device
      description: >
        The way back in (§16, #106). A recovery collects confirmations — two,
        from confirmers appointed by DIFFERENT authorities, because a panel
        appointed by one organisation is that organisation's decision wearing
        several names — or, where two confirmers cannot be reached, an
        operator's override. One live recovery per person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, openedByPartyId, reason]
              properties:
                partyId: { type: string }
                openedByPartyId: { type: string }
                reason: { type: string }
      responses:
        "201":
          description: Opened.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "404":
          description: No such party.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: A recovery for this party is already in progress.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listRecoveries
      summary: The recovery audit surface
      description: >
        Every recovery, override included — an override nobody can read back is
        quiet, which is the one thing it must never be. `overdue=true` narrows
        to overridden recoveries past their review-by date: flagged for review,
        never silent.
      parameters:
        - { name: overdue, in: query, schema: { type: string, enum: ["true"] } }
        - name: refused
          in: query
          schema: { type: string, enum: ["true"] }
          description: >
            w4_3's attention queue: undecided recoveries somebody said "no" to.
            The opener on each record is the person who owes it a next step —
            a refusal is never a silent dead end.
        - name: confirmerPartyId
          in: query
          schema: { type: string }
          description: >
            The confirmer's own view (w4_1, w4_2): open recoveries of workers
            who nominated this party as a recovery contact. Answered to that
            party alone — who trusts you with their recovery is not for
            browsing. This is the pull half of "a request arrives"; SMS
            delivery is a channel adapter this deployment does not have (#150).
      responses:
        "200":
          description: Recoveries, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveries:
                    type: array
                    items: { $ref: "#/components/schemas/Recovery" }
                  count: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}:
    get:
      operationId: getRecovery
      summary: Read a recovery, override and all
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The full record.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}/confirmations:
    post:
      operationId: confirmRecovery
      summary: One voice saying this is the same person
      description: >
        What a confirmer confirms is the narrow question — that the person
        asking is the person the record is about — never that they should have
        access. The confirmer must be somebody the declared authority currently
        stands behind (an ACTIVE authorization), must not be the worker, and at
        most one confirmation per authority counts, enforced by the table
        itself. The second distinct voice moves the recovery to CONFIRMED.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmerPartyId, authorityPartyId]
              properties:
                confirmerPartyId: { type: string }
                authorityPartyId:
                  type: string
                  description: >
                    Declared and then verified rather than inferred: a confirmer
                    holding authorizations from two organisations must say which
                    hat they are wearing.
      responses:
        "200":
          description: Recorded; state is OPEN or CONFIRMED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400":
          description: Missing fields, or the worker confirming themselves.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: The declared authority does not stand behind this confirmer.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >
            This confirmer — or another from the same authority — already
            confirmed. One org, one voice.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}/refusals:
    post:
      operationId: refuseRecovery
      summary: A contacted person's "no", on the record
      description: >
        The refusal path w4_3's reference screen leaves undefined, defined: a
        permanent record owned by the refuser, with a required reason. The
        recovery stays OPEN — a refusal is one voice, and any two other vouched
        voices may still carry it — and every undecided recovery carrying
        refusals surfaces on `GET /v1/recoveries?refused=true`, where the
        opener owes it a next step. The same posture as a held payment.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refuserPartyId, reason]
              properties:
                refuserPartyId: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Recorded; the recovery is unchanged in state.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400":
          description: No reason, no owner, or the worker refusing their own recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Not collecting answers any more, or this person already refused.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/recovery-contacts:
    post:
      operationId: nominateRecoveryContact
      summary: Nominate a person the worker trusts to vouch for them
      description: >
        w1_7's write. A nomination is ROUTING, not eligibility: it answers who
        should be asked when this worker loses their device, and feeds the
        confirmer's pending view — it never widens who may confirm, which
        stays the 2-of-3 rule with its distinct-authority constraint. The
        contact is a party, never a phone number: numbers are re-issued and
        lost with the handset, the exact failure recovery exists for.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactPartyId]
              properties:
                contactPartyId: { type: string }
      responses:
        "201":
          description: Nominated.
          content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryContact" } } }
        "400":
          description: Nobody named, or the worker nominating themselves.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such party, or the nominated contact is not enrolled.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Already a live recovery contact for this worker.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listRecoveryContacts
      summary: Who this worker nominated, revocations included
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The nominations, history and all, with a live count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partyId: { type: string }
                  contacts:
                    type: array
                    items: { $ref: "#/components/schemas/RecoveryContact" }
                  liveCount: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/recovery-contacts/{contactId}/revoke:
    post:
      operationId: revokeRecoveryContact
      summary: End a nomination without erasing it
      description: >
        Marks the nomination revoked; the row stays. Who a worker trusted, and
        when they stopped, is what a later dispute about a recovery is
        answered from.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: contactId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked. }
        "404":
          description: No live nomination of that contact for this worker.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}/override:
    post:
      operationId: overrideRecovery
      summary: The operator's exception, which can never be quiet
      description: >
        For the worker two confirmers cannot reach. Requires the
        `override-recovery` function under an instance-scoped grant — an
        operator-level power, never a context one (G1, #10) — and is refused
        outright for the worker's own supervisor, whatever they hold: the
        person who caused a lockout is frequently the supervisor, and a path
        they can invoke is one they can invoke against the worker. Refused
        without a reason, here and by a database constraint; the record is
        permanent and carries a review-by date.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [byPartyId, reason]
              properties:
                byPartyId: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Overridden, with the reason, owner and review date on the record.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400":
          description: No reason or no owner — impossible to express, not merely discouraged.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not permitted, or the worker's own supervisor.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The recovery is past the point where an override applies.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/recoveries/{id}/complete:
    post:
      operationId: completeRecovery
      summary: Bind the worker's new subject
      description: >
        The destination of both paths: an APPENDED identity binding of class
        `recovery` for the subject the worker will authenticate as from now on.
        Never an edit — the old bindings stay (§4.1). The binding derives IA-1
        until the worker re-anchors with a real provider, at which point the
        stronger binding simply wins: vouching is community knowledge, not a
        national identity check.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectRef]
              properties:
                subjectRef: { type: string }
      responses:
        "200":
          description: Completed; the subject now resolves to the worker.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recovery" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "404":
          description: No such recovery.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Not decided yet, or the subject already authenticates another party.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        An OIDC access token from the deployment's identity provider (#89, §4.1).
        In a deployment that is eSignet; locally it is tools/mocks/oidc, which
        mints real ES256 tokens against a real JWKS so the verification path
        under test is the production one.


        The provider's `sub` is never used directly. CREST re-salts it under a
        per-deployment key before anything stores or compares it, because #52
        and #63 are open against eSignet's pairwise subject — it partitions by
        relying party rather than by client, and derives without a
        per-deployment salt. Two deployments reading the same eSignet therefore
        cannot correlate their workers by subject.

  parameters:
    OnBehalfOf:
      name: X-CREST-On-Behalf-Of
      in: header
      required: false
      schema: { type: string }
      description: >
        The party this request acts for, when somebody is acting for somebody
        else. The assisted paths are a requirement rather than a loophole — a
        worker with no phone confirming through a supervisor is one of the four
        T=7 exits — and what makes them safe is that they are recorded as
        themselves. Refused with 403 unless the caller holds `act-for-party` in
        the context.

    PartyID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The party identifier.

  schemas:
    # ── The G-2 onboarding journey (J1) ───────────────────────────────────
    Invitation:
      type: object
      description: >
        One recorded offer from a project to an organisation. Not a primitive:
        the standing fact is the Authorization its acceptance creates, and
        `grantId` is the walkable link to it.
      properties:
        id: { type: string }
        contextId: { type: string }
        partyId: { type: string }
        functions: { type: array, items: { type: string } }
        period: { type: object }
        note: { type: string }
        state: { type: string, enum: [SENT, ACCEPTED, DECLINED] }
        invitedBy: { type: string }
        invitedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        reason: { type: string }
        grantId: { type: string }

    InvitationEvent:
      type: object
      description: One row of an invitation's append-only trail.
      properties:
        seq: { type: integer }
        event: { type: string, enum: [SENT, QUESTION, ACCEPTED, DECLINED] }
        actorPartyId: { type: string }
        note: { type: string }
        at: { type: string, format: date-time }

    DeclaredDocument:
      type: object
      description: >
        A qualification document, declared rather than uploaded: a reference
        and optionally a hash, never the bytes. `kind` is the deployment's own
        taxonomy, opaque here; `ref` is bounded and single-line so nothing
        document-shaped — least of all an identity document — can be smuggled
        into this store.
      required: [kind, ref]
      properties:
        kind: { type: string, maxLength: 120 }
        ref: { type: string, maxLength: 500 }
        hash: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000 }

    TermsRequest:
      type: object
      description: >
        An organisation's request to move to a wider published terms version.
        `previousTermsId`/`previousTermsVersion` are captured at approval —
        the registration row only ever shows the current answer, and "which
        terms did this organisation hold before the upgrade" must survive the
        overwrite.
      properties:
        id: { type: string }
        partyId: { type: string }
        termsId: { type: string }
        termsVersion: { type: integer }
        documents: { type: array, items: { $ref: "#/components/schemas/DeclaredDocument" } }
        state: { type: string, enum: [DRAFT, SUBMITTED, WITHDRAWN, APPROVED, DENIED] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        reason: { type: string }
        previousTermsId: { type: string }
        previousTermsVersion: { type: integer }

    TermsRequestEvent:
      type: object
      description: One row of a terms request's append-only trail.
      properties:
        seq: { type: integer }
        event: { type: string, enum: [DRAFTED, SUBMITTED, WITHDRAWN, APPROVED, DENIED] }
        actorPartyId: { type: string }
        reason: { type: string }
        at: { type: string, format: date-time }

    CheckVerdict:
      type: object
      description: >
        One recorded check on a submitted request: a binary outcome and who
        answers for it — a party, or a named policy. A record of verdicts,
        deliberately not a simulation of automation.
      properties:
        seq: { type: integer }
        name: { type: string }
        outcome: { type: string, enum: [PASS, FAIL] }
        ownerKind: { type: string, enum: [party, policy] }
        owner: { type: string }
        note: { type: string }
        recordedBy: { type: string }
        at: { type: string, format: date-time }

    # ── Projects (J3) ─────────────────────────────────────────────────────
    ProjectView:
      description: >
        A project as every read returns it: the Context primitive, plus the
        derived answers a screen needs and must never re-derive for itself.
      allOf:
        - $ref: "urn:crest:schema:primitives:context:1"
        - type: object
          properties:
            activationConditions:
              type: array
              items: { $ref: "#/components/schemas/ActivationCondition" }
            records:
              type: array
              items: { $ref: "#/components/schemas/ContextRecord" }

    ActivationCondition:
      type: object
      description: >
        One readable answer to "what does this project still need before it
        runs?". `because` says what the condition is in a sentence, because a
        gate name a deployment chose is not self-explaining to the person
        reading the screen.
      properties:
        name: { type: string }
        satisfied: { type: boolean }
        satisfiedAt: { type: string, format: date-time }
        because: { type: string }

    ActivationView:
      type: object
      properties:
        projectId: { type: string }
        state: { type: string, enum: [DRAFT, ACTIVE, CLOSED] }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/ActivationCondition" }
        unmet:
          type: array
          items: { type: string }
          description: The names of the conditions standing in the way. Empty is not the same as absent.
        activatable: { type: boolean }

    ContextRecord:
      type: object
      description: >
        One configuration-level fact keyed to a project, with the two things
        that make it accountable rather than merely present: who recorded it
        and when. `kind` and `payload` are opaque — the core stores and
        returns them and never reads inside, the same contract
        Context.configuration carries.
      properties:
        kind: { type: string }
        payload: { description: The profile's business, whatever shape it is. }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }

    GrantRequest:
      type: object
      required: [partyId, functions]
      properties:
        partyId: { type: string }
        functions:
          type: array
          minItems: 1
          items: { type: string }
          description: >
            The role vocabulary, opaque. A role with no functions is a label,
            so at least one is required.
        terms:
          description: >
            Defaulted to the terms the authority accepted for a role grant,
            and forced to the partner's own accepted version for a partner
            grant. Refused rather than invented when there are none.
          $ref: "urn:crest:schema:primitives:common:1#/$defs/versionedRef"
        period: { $ref: "urn:crest:schema:primitives:common:1#/$defs/period" }
        reviewBy:
          type: string
          format: date-time
          description: >
            When somebody should look at this again (§16). Passing it changes
            nothing by itself — staleness is a flag a person reads, never a
            gate a worker hits.
        evidence:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              ref: { type: string }

    RoleGrant:
      type: object
      description: >
        One grant as the People & roles screens read it: who holds what, since
        when, from whom, and whether it still stands. Every field is already on
        the Authorization primitive.
      properties:
        grantId: { type: string }
        partyId: { type: string }
        displayName: { type: string, description: Best-effort; a grant whose holder cannot be named still lists. }
        partyKind: { type: string, enum: [person, organisation] }
        functions: { type: array, items: { type: string } }
        grantedByPartyId: { type: string, description: Who granted it. }
        authorityPartyId: { type: string, description: Who says so. A verifier walks this. }
        grantedAt: { type: string, format: date-time }
        from: { type: string, format: date-time }
        until: { type: string, format: date-time }
        state: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        revokedAt: { type: string, format: date-time }
        terms: { $ref: "urn:crest:schema:primitives:common:1#/$defs/versionedRef" }
        reviewBy: { type: string, format: date-time }

    Recovery:
      type: object
      description: >
        A recovery, override and all. Deliberately fully readable afterwards —
        by the worker, and by an auditor asking whether the override power is
        being used well.
      properties:
        id: { type: string }
        partyId: { type: string }
        openedByPartyId: { type: string }
        reason: { type: string }
        state: { type: string, enum: [OPEN, CONFIRMED, OVERRIDDEN, COMPLETED] }
        createdAt: { type: string, format: date-time }
        confirmations:
          type: array
          items:
            type: object
            properties:
              confirmerPartyId: { type: string }
              authorityPartyId: { type: string }
              confirmedAt: { type: string, format: date-time }
        refusals:
          type: array
          description: >
            On-the-record "no" answers (w4_3). A refusal never closes the
            recovery — other vouched voices may still confirm — and is never
            silent: it rides the record with its owner and reason.
          items:
            type: object
            properties:
              refuserPartyId: { type: string }
              reason: { type: string }
              refusedAt: { type: string, format: date-time }
        overrideByPartyId: { type: string }
        overrideReason: { type: string }
        overrideAt: { type: string, format: date-time }
        reviewBy: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    RecoveryContact:
      type: object
      description: One nomination — a party the worker trusts, never a phone number.
      properties:
        partyId: { type: string }
        contactPartyId: { type: string }
        nominatedByPartyId: { type: string }
        nominatedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    Consent:
      type: object
      description: >
        One recorded consent moment (§9). `artefactRef` is an object-store key,
        never a URL, and `artefactDigest` is stored beside it so an artefact
        swapped underneath is detectable rather than trusted — which matters
        precisely because this is the evidence that a person agreed to something.
      required: [id, partyId, moment, purpose, captureMethod, capturedAt, state]
      properties:
        id: { type: string }
        partyId: { type: string }
        moment: { type: string, enum: [enrolment, issuance-confirmation, disclosure] }
        purpose: { type: string }
        captureMethod: { type: string, enum: [screen, sms, ussd, voice, assisted] }
        capturedBy: { type: string }
        capturedAt: { type: string, format: date-time }
        artefactRef: { type: string }
        artefactDigest: { type: string }
        artefactType: { type: string }
        contextId: { type: string, description: The programme this consent is given to. Required for enrolment. }
        revokedAt: { type: string, format: date-time }
        revokedReason: { type: string }
        state: { type: string, enum: [NONE, GRANTED, WITHDRAWN] }

    Error:
      type: object
      description: >
        The error body every CREST service returns (pkg/httpx). The message is
        written for whoever reads it, including eventually a worker being told why
        something is held.
      required: [code, message]
      properties:
        code: { type: string, description: A machine-actionable code, e.g. no_match, invalid_query, schema_violation. }
        message: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Per-field detail from schema validation, when there is any.
    Match:
      type: object
      description: One resolved candidate, with the evidence for the match.
      properties:
        partyId: { type: string }
        matchedOn: { type: string, description: Which key matched. }
        confidence: { type: number }
    Hold:
      type: object
      description: >
        A recorded decision not to merge. Written whenever resolve finds more than
        one candidate; the row is what someone later acts on (W7).


        The colliding value itself is deliberately absent — §16 asks that
        duplicate holds show existence rather than content, and the reason is
        concrete: for a contact-route hold the value is a phone number, and a
        queue anybody can list would otherwise hand out the phone number of
        every worker two records disagree about. `keyKind` says which kind of
        identifier collided, which is what a custodian needs to decide it.
      properties:
        id: { type: string }
        keyKind: { type: string, enum: [national-id-hash, contact-route, roster-id] }
        candidates: { type: array, items: { type: string } }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

  responses:
    BadBody:
      description: The body could not be read, or carried a field this service does not know. Unknown fields are rejected rather than dropped — a misspelled field is a wrong number nobody notices.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SchemaViolation:
      description: The document does not satisfy its JSON Schema; `problems` lists every failure at once.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such record.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Internal:
      description: The service logged the cause and did not leak it.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  pathItems:
    healthz:
      get:
        operationId: healthz
        tags: [health]
        summary: Liveness
        description: The process is up. Separate from readiness on purpose — a service can be alive and unable to serve.
        responses:
          "200":
            description: Alive.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ok }
                    time: { type: string, format: date-time }
    readyz:
      get:
        operationId: readyz
        tags: [health]
        summary: Readiness
        description: >
          Actually touches the database. The harness polls this instead of
          sleeping, so a readyz that always says yes turns every start-up race
          into a flaky test rather than a failed one.
        responses:
          "200":
            description: Ready to serve.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ready }
          "503":
            description: Alive but not serving; `reason` says what is unreachable.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string }
                    reason: { type: string }
