openapi: 3.1.0
info:
  title: CREST verification
  version: "1"
  description: |
    ## Who may call what (#102)

    Every service verifies bearer tokens; this section is who each surface
    answers. Four kinds of path:

    - **Party-authorized** — acts in a named party's name; the caller must be
      that party or hold act-for-party where the action is scoped
      (X-CREST-On-Behalf-Of names the party). Marked `security: bearerAuth`.
    - **Authenticated** — any signed-in caller (custodian queues, operations
      lists). Also `bearerAuth`.
    - **Open by design** — verification, status list, instance, capability
      reads by unguessable id, and the bootstrap plane; each carries a comment
      saying why.
    - **`/internal/*`** — the other services' doors, unauthenticated by the
      service-identity ruling (§16, 2026-08-25): service traffic lives on
      internal routes and fencing them to the service network is the
      deployment's job.
    Checking a credential and deriving - never reading - its trust tier.

    The credential body is referenced by the `$id` of its JSON Schema under
    `schemas/` rather than restated here. `schemas/` is the source of truth; a
    second copy of the credential shape is what `schemas/README.md` exists to
    prevent.
servers:
  - url: http://verification:8080
    description: In-cluster address used by the other services.

paths:
  /v1/verify:
    post:
      operationId: verify
      summary: Verify a credential and derive its tier
      description: >
        Answers, in the order a sceptic would: is the signature real, has it been
        withdrawn, and only then how strong is it. The order matters - putting a
        tier next to a forged credential would give a number to something that
        should only ever read "not valid". The tier is computed on this request and
        stored nowhere (W7): against the definition version the credential pinned,
        this deployment's current assessment of the source, and the subject's
        identity assurance asked for now, so a worker who anchored their identity
        last week sees it reflected in a credential issued last year. Ask again
        tomorrow and the answer may differ; that is the feature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  $ref: "urn:crest:schema:credentials:work-event-credential:1"
                requestedByPartyId:
                  type: string
                  description: >
                    Who is asking. Supplying this or `purpose` makes the
                    presentation scoped rather than bare, and either way the
                    presentation is recorded (§9).
                purpose: { type: string }
      responses:
        "200":
          description: >
            The verdict - including a negative one. An invalid credential is a 200
            with `valid: false` and reasons, not an HTTP error: the question was
            answered, and the answer was no.
          content: { application/json: { schema: { $ref: "#/components/schemas/Verdict" } } }
        "400":
          description: No credential in the body, or the body was unreadable.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/verify/batch:
    post:
      operationId: verifyBatch
      summary: Verify many credentials, boundedly
      description: >
        The bounded door for a need that would otherwise arrive through a loop
        (§16, #107). Every batch declares a purpose — free text, 10-200
        characters, shown to each worker in their check trail — and names who is
        asking; both refusals are L1. The size cap defaults to 100 and is
        deployment configuration (CREST_VERIFY_BATCH_CAP) that can be moved but
        not removed. Per-credential verdicts only, deliberately no aggregate
        answers; every credential writes its own presentation entry, so "who
        checked me" reads the same whether the check arrived alone or among a
        hundred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentials, requestedByPartyId, purpose]
              properties:
                credentials:
                  type: array
                  items: { type: object }
                requestedByPartyId: { type: string }
                purpose: { type: string, minLength: 10, maxLength: 200 }
      responses:
        "200":
          description: One verdict per credential, in order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdicts:
                    type: array
                    items: { $ref: "#/components/schemas/Verdict" }
                  count: { type: integer }
        "400":
          description: No purpose, no requester, or no credentials.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: Over the deployment's cap; the refusal names the number.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/parties/{id}/credentials:
    get:
      operationId: partyCredentials
      summary: Resolve a person to their credentials
      description: >
        What a verifier resolving a party sees (§16, #104): every credential in
        the person's chain, following any merge — and nothing about the chain
        itself. No identifier list, no merged flag, no count of underlying
        records; "this person was recorded twice" is a fact about the worker a
        verifier has no claim on. Each credential returned writes a presentation
        entry in the worker's check trail. What the credentials' own subject
        fields reveal is a property of the credentials, stated in §16.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: requestedByPartyId, in: query, schema: { type: string } }
        - { name: purpose, in: query, schema: { type: string } }
      responses:
        "200":
          description: The chain's credentials, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items: { type: object }
                  count: { type: integer }
        "503":
          description: The credential record could not be read; refused rather than under-reported.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/source-assessments:
    post:
      operationId: assessSource
      summary: Record how this deployment regards a source
      description: >
        Caps the tier any credential from that adapter can reach. One call
        downgrades every credential that source ever produced, immediately and with
        no reissuance - which is only possible because the tier is derived and not
        stored (W7). The reason and the assessor are required: a downgrade nobody
        signed is a downgrade nobody can appeal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapterRef, contextId, systemRef, maxTier, reason]
              properties:
                adapterRef: { type: string, description: The registered source's adapter; it must match the registration. }
                contextId: { type: string, description: The project the source is registered in. An assessment is the project's, not the name's. }
                systemRef: { type: string, description: The registered source instance being assessed. }
                maxTier: { type: integer, minimum: 1, maximum: 3, description: Reference numbering, 1 strongest. }
                reason: { type: string }
                assessedByPartyId: { type: string, description: Ignored; the authenticated caller is recorded as the assessor. }
      responses:
        "204": { description: Recorded, replacing any previous assessment of that source in that project. }
        "400":
          description: A missing adapter, context, system reference or reason, or a maxTier outside 1 to 3.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

    get:
      operationId: listSourceAssessments
      summary: What does this deployment think of its sources?
      description: >
        The recorded caps, with who set each one and why. A verifier reading a tier
        can read this alongside it and see the judgement that shaped it. A project
        read: the project's own rows and the rows assessed before scoping (no
        context), which still apply everywhere.
      parameters:
        - { name: contextId, in: query, required: true, schema: { type: string }, description: The project whose sources are asked about; the caller must hold read-work-evidence there. }
      responses:
        "200":
          description: The assessments, ordered by source.
          content:
            application/json:
              schema:
                type: object
                required: [assessments]
                properties:
                  assessments:
                    type: array
                    items:
                      type: object
                      properties:
                        contextId: { type: string, description: Absent on a row assessed before scoping. }
                        systemRef: { type: string, description: Absent on a legacy row keyed by adapter alone. }
                        adapterRef: { type: string }
                        maxTier: { type: integer }
                        reason: { type: string }
                        assessedByPartyId: { type: string }
                        assessedAt: { type: string, format: date-time }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/source-assessments/{adapterRef}:
    delete:
      operationId: clearSourceAssessment
      summary: Lift a downgrade
      description: >
        As real an operation as imposing one. A source that was under
        investigation and has been cleared returns to full strength, and every
        credential it produced recovers with it - again with no reissuance,
        because the tier was never stored. A system that can only ever downgrade
        a source ratchets one way and eventually trusts nothing.
      parameters:
        - name: adapterRef
          in: path
          required: true
          schema: { type: string }
          description: The adapter reference as it appears in a record's provenance.
        - { name: contextId, in: query, required: true, schema: { type: string }, description: The project the source is registered in. }
        - { name: systemRef, in: query, required: true, schema: { type: string }, description: The registered source instance whose assessment is lifted. }
      responses:
        "204": { description: "Cleared. Clearing a source with no assessment is not an error." }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/presentations:
    get:
      operationId: listPresentations
      summary: Who has been shown this worker's credentials, and why?
      description: >
        Every verify is recorded, scoped or bare. Filterable by subject so the
        worker can be shown their own disclosure history - consent is only
        meaningful if the person can see what was disclosed (§9).
      parameters:
        - { name: subjectRef, in: query, schema: { type: string }, description: The pairwise subject reference. Never a raw national identifier (W8). }
      responses:
        "200":
          description: The presentations, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [presentations]
                properties:
                  presentations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        credentialId: { type: string }
                        subjectRef: { type: string }
                        requestedByPartyId: { type: string }
                        purpose: { type: string }
                        scope: { type: string, enum: [bare, scoped, consented] }
                        outcome: { type: string, enum: [valid, withdrawn, signature-failed, not-valid, listed, shared] }
                        tier: { type: integer }
                        createdAt: { type: string, format: date-time }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/presentation-requests:
    post:
      operationId: createPresentationRequest
      summary: A verifier asks to see a worker's credentials
      description: >
        §9's disclosure consent as a flow (w1_19): anything beyond the bare QR
        payload requires an explicit, scoped, recorded grant naming who asked
        and why. The requester is the proven caller; the purpose is 10–200
        characters because the worker reads it. `credentialIds` narrows the
        ask; absent, the whole chain is on the table — either way the worker
        decides against the resolved list, never the raw ask.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectPartyId, requestedByPartyId, purpose]
              properties:
                subjectPartyId: { type: string }
                requestedByPartyId: { type: string }
                purpose: { type: string, minLength: 10, maxLength: 200 }
                credentialIds:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Requested, with the resolved disclosure list both faces will see.
          content: { application/json: { schema: { $ref: "#/components/schemas/ShareRequestView" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "422":
          description: A worker does not petition themselves.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listPresentationRequests
      summary: One party's share requests
      description: >
        Name `subjectPartyId` (the worker's pending and past requests) or
        `requestedByPartyId` (the verifier's own asks). Answered to that party
        alone — share negotiations are never browsed.
      parameters:
        - { name: subjectPartyId, in: query, schema: { type: string } }
        - { name: requestedByPartyId, in: query, schema: { type: string } }
      responses:
        "200":
          description: The requests, oldest first, each with its disclosure list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/ShareRequestView" }
                  count: { type: integer }
        "400":
          description: Neither party named.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/presentation-requests/{id}:
    get:
      operationId: getPresentationRequest
      summary: Both faces of one share request
      description: >
        Served to the request's subject or requester, from one record and one
        resolved disclosure list (w1_20) — the worker sees the same list the
        verifier does, structurally, because one function computes it for both.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The request, its derived state, and the disclosure list.
          content: { application/json: { schema: { $ref: "#/components/schemas/ShareRequestView" } } }
        "403":
          description: The caller is a stranger to this share.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such request.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/presentation-requests/{id}/decision:
    post:
      operationId: decidePresentationRequest
      summary: The worker's answer — per share, every time
      description: >
        w1_15. An approval names the credentials it approves, and only from
        the disclosure list the worker was shown; approving nothing is
        declining, and a decline records its reason. A settled answer stays
        settled; an expired request is answered by asking again.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                approvedCredentialIds:
                  type: array
                  items: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Decided.
          content: { application/json: { schema: { $ref: "#/components/schemas/ShareRequestView" } } }
        "400":
          description: >
            No reason on a refusal, no list on an approval, or a credential
            not on the disclosure list.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such request.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Already answered, or expired.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/presentation-requests/{id}/collect:
    post:
      operationId: collectPresentationRequest
      summary: The verifier collects exactly what was approved, once
      description: >
        Only the requester the worker consented to, only while approved and in
        time, and only once — fulfilment consumes the approval (w1_15). The
        documents served are re-read from the approved list on the record, so
        the response and the approval cannot disagree (w1_20). Every shared
        credential writes its own presentation entry: "who checked me" reads a
        consented share like any other check (§9, W8).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The approved credentials, and the fulfilled request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { type: object }
                  credentials:
                    type: array
                    items: { $ref: "urn:crest:schema:credentials:work-event-credential:1" }
                  count: { type: integer }
        "404":
          description: No such request.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Not approved, already collected, or expired.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  # Every CREST service carries these two, added by pkg/httpx.Server.
  # Issuance and the credential record live here since #137 (2026-08-27):
  # the payments application requests issuance; this service signs, stores,
  # revokes and publishes the issuer key and status list.
  /v1/credentials:
    get:
      operationId: listCredentials
      summary: Every credential issued to one worker
      description: >
        Follows any merge, like every other party-scoped read (#100, #104): asking
        by the survivor's id or an absorbed one returns the same whole history.
        The response is credentials and nothing else — no identifier list, no
        marker that a merge happened. Revoked credentials are included; the
        status list is how a verifier finds that out, and filtering them here
        would make this listing quietly disagree with it.
      parameters:
        - name: partyId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The chain's credentials, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items: { $ref: "urn:crest:schema:credentials:work-event-credential:1" }
                  count: { type: integer }
        "400":
          description: partyId is required.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: The registry could not say which ids are this party.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/credentials/{id}:
    get:
      operationId: getCredential
      summary: Read an issued credential
      description: The signed WorkEventCredential as issued. It carries provenance facts, never a stored tier (W7) - the tier is computed at verification time.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:credentials:work-event-credential:1"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/credentials/{id}/card:
    get:
      operationId: credentialCard
      summary: The printed card for this credential
      description: >
        One of the three ways a worker holds a credential (§5), and the only one
        available to a worker without a phone — which makes it the wallet for
        exactly the people the inclusion path exists for, not a fallback for them.


        Printed at issuance rather than at enrolment (settled on #24): at
        enrolment no work has been done and there is no credential to print. The
        card is produced through the same assisted-access channel enrolment uses.


        The QR carries the WHOLE signed credential, not a link to one. That is
        the property the offline path exists for — a bare scan verifies signature
        and schema with no network, so the record is provable to a stranger who
        has never heard of CREST and has no signal. A QR holding a URL would move
        the proof back onto a server and the worker back into needing one.


        It carries no trust tier. Strength is derived by whoever checks it, from
        the provenance facts inside; printing a tier would freeze a judgement
        onto paper that outlives the reasons for it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: format
          in: query
          schema: { type: string, enum: [html, payload], default: html }
          description: >
            `html` is a self-contained printable page with the QR inlined as a
            data URI — a card whose image is fetched from a server prints as a
            broken icon in exactly the deployment that needs it most. `payload`
            is the bare PixelPass string, for a print station with its own
            stationery.
      responses:
        "200":
          description: The card.
          content:
            text/html: { schema: { type: string } }
            text/plain:
              schema: { type: string }
              example: "NCF..."
        "404": { description: No such credential. }
        "507":
          description: >
            This credential does not fit in a printable QR. A real possibility as
            fields are added, and it must not be a mystery when it happens.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      summary: Withdraw a credential
      description: >
        Flips one bit in the status list. Withdrawal is the single central fact
        about a credential (§9) and this is the whole of it - there is no partial
        withdrawal to reason about later.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Withdrawn. The status list now reads revoked at this credential's index. }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/status-list:
    get:
      operationId: statusList
      summary: The signed revocation bitstring
      description: >
        Returns the whole list, signed. Whole on purpose: a verifier who asks about
        one credential tells the issuer which credential they are checking, and the
        point of a bitstring is that it does not (§9).
      responses:
        "200":
          description: A signed status list credential.
          content: { application/json: { schema: { type: object } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/issuer:
    get:
      operationId: issuerInfo
      summary: The issuer's verification key
      description: >
        A verifier needs this once and then never again, which is what makes
        offline verification possible (W7).
      responses:
        "200":
          description: Issuer identity, verification method and public key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  verificationMethod: { type: string }
                  publicKeyMultibase: { type: string }
                  cryptosuite: { type: string }
        "500": { $ref: "#/components/responses/Internal" }

  /healthz: { $ref: "#/components/pathItems/healthz" }
  /readyz: { $ref: "#/components/pathItems/readyz" }


  # No /internal/clock anywhere in CREST. The driveable clock was removed on
  # 2026-09-09: every process reads real time, and every time-bound behaviour
  # is a configured duration instead — CONFIRMATION_WINDOW, SWEEP_EVERY,
  # SOURCE_MONITOR_EVERY, CLOCK_SKEW_ALERT, CREST_RECOVERY_OVERRIDE_REVIEW.
  # The harness proves each of them by bringing the same code up with the
  # duration set to seconds and waiting real time for the outcome, so there is
  # nothing left for an HTTP call to move — and therefore no route anybody
  # could be talked into enabling in a deployment, where a movable clock is a
  # way to close a worker's confirmation window early on them.
