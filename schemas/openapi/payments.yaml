openapi: 3.1.0
info:
  title: CREST payments
  version: "1"
  description: |
    ## Who may call what (#102)

    Every service verifies bearer tokens; this section is who each surface
    answers. Four kinds of path:

    - **Party-authorized** — acts in a named party's name; the caller must be
      that party or hold act-for-party where the action is scoped
      (X-CREST-On-Behalf-Of names the party). Marked `security: bearerAuth`.
    - **Authenticated** — any signed-in caller (custodian queues, operations
      lists). Also `bearerAuth`.
    - **Open by design** — verification, status list, instance, capability
      reads by unguessable id, and the bootstrap plane; each carries a comment
      saying why.
    - **`/internal/*`** — the other services' doors, unauthenticated by the
      service-identity ruling (§16, 2026-08-25): service traffic lives on
      internal routes and fencing them to the service network is the
      deployment's job.
    Turning a window exit into a payment instruction, and keeping a reason attached
    to every one that does not move money.

    Instruction and compensation shapes come from the trusted-payments profile
    under `schemas/` and are referenced by `$id` rather than restated - `schemas/`
    is the source of truth, and a second copy is what `schemas/README.md` exists to
    prevent.
servers:
  - url: http://payments:8080
    description: In-cluster address used by the other services.

paths:
  /v1/instructions:
    post:
      operationId: releasePayment
      summary: Release a payment for a claim that exited its window
      description: >
        Note what this does not do: look at which exit it was. All four release
        (W4), dispute included, because a dispute contests the record and not the
        money. `releasedBy` is recorded for reconciliation and never branched on.
        The call is idempotent by claim - the relay is at-least-once, and answering
        the same instruction twice is friendlier than answering an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimId, unitId, partyId]
              properties:
                claimId: { type: string }
                unitId: { type: string }
                partyId: { type: string, description: The payee. }
                releasedBy: { type: string, description: Which of the four exits released it. Recorded, never branched on. }
                releasedAt: { type: string, format: date-time }
      responses:
        "200":
          description: An instruction already existed for this claim; it is returned unchanged.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:profiles:trusted-payments:payment-instruction:1"
        "201":
          description: >
            An instruction was created - **RELEASED or HELD**. A held payment is not
            an error: the instruction exists and is the thing that carries the reason
            and its owner (W10). Returning an error instead would leave the hold
            unrecorded and the caller retrying forever, which is a worker seeing
            nothing and being told nothing. Holds arise from `unit_unreadable`,
            `rate_unreadable`, `amount_out_of_range`, or `no_rate_attached` - the
            last being entirely legitimate, since a definition is complete with no
            rate attached and recognition is a use of its own (§7).
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:profiles:trusted-payments:payment-instruction:1"
              examples:
                released:
                  summary: Released
                  value: { id: "payment-instruction-...", claimId: "claim-...", state: RELEASED, amountMinor: 25000, currency: KES }
                held:
                  summary: Held, with a reason and an owner
                  value:
                    id: "payment-instruction-..."
                    claimId: "claim-..."
                    state: HELD
                    held:
                      code: no_rate_attached
                      explanation: this work is recognised but no payment rate is attached to its definition
                      ownerPartyId: "did:crest:party:programme-operations"
        "400":
          description: A release without a claim, a unit or a payee.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

    get:
      operationId: listInstructions
      summary: Which instructions exist?
      description: >
        Filterable by party and state; `state=HELD` is the list every held payment's
        owner is meant to be working through.


        `partyId` follows merges (#100). A party absorbed into another still owns
        every record written before the merge, and those records still name it —
        a statement about whose work it was at the time is true and is not
        rewritten — so this filter expands to every id in the merge chain.
        Otherwise the survivor's history would have a hole exactly where the
        system corrected itself about who they were. Asking about an absorbed id
        gives the same answer, because the printed cards and saved links that
        name it have to keep working.

      parameters:
        - { name: partyId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [RELEASED, HELD] } }
      responses:
        "200":
          description: The matching instructions.
          content:
            application/json:
              schema:
                type: object
                required: [instructions]
                properties:
                  instructions:
                    type: array
                    items:
                      $ref: "urn:crest:schema:profiles:trusted-payments:payment-instruction:1"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/instructions/by-claim/{claimId}:
    get:
      operationId: getInstructionByClaim
      summary: What happened to the payment for this claim?
      description: >
        The question a worker asks. One instruction per claim, so this is a lookup
        and not a search - and if it is held, the answer carries the reason and
        whose job it is to clear it (W10).
      parameters: [{ name: claimId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The instruction.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:profiles:trusted-payments:payment-instruction:1"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/reconciliation:
    get:
      operationId: reconciliation
      summary: What is owed and has not been paid, and does each gap have a reason?
      description: >
        Gaps between what was released and what the rail confirmed. `withoutAReason`
        is reported separately because a gap with no reason is itself the finding -
        it makes "everything unpaid has an explanation" (W10) a number someone can
        watch rather than a claim someone makes.
      responses:
        "200":
          description: The gaps, and how many of them nobody has explained.
          content:
            application/json:
              schema:
                type: object
                required: [gaps, count, withoutAReason]
                properties:
                  gaps: { type: array, items: { type: object } }
                  count: { type: integer }
                  withoutAReason: { type: integer, description: Expected to be 0. }
        "500": { $ref: "#/components/responses/Internal" }

  # ── The funders wave (F-1, F-2) ──────────────────────────────────────────
  # Rate ownership, rates as versioned terms, and the payment mechanism whose
  # activation gate sits in front of DISBURSEMENT only (f2_9): none of these
  # endpoints can stop a window exit creating its instruction (W4).

  /v1/definitions/{id}/rate-owner:
    post:
      operationId: assignRateOwner
      summary: Assign who may author rates for a definition (f1_2)
      description: >
        Anyone can ask; only this recorded act assigns. The record carries
        assigner, assignee and date; a re-assignment supersedes the current
        one and keeps it as history. Party-authorized as the assigner.
      responses:
        "201": { description: The assignment record. }
        "400": { description: Assignee or assigner missing. }
        "404": { description: No such definition. }
    get:
      operationId: getRateOwner
      summary: The current rate owner and the assignment history
      responses:
        "200": { description: "`current` (nullable) and `history`." }

  /v1/definitions/{id}/rates:
    post:
      operationId: publishRate
      summary: Publish a rate as versioned terms (f1_3, f1_4)
      description: >
        Only the assigned rate owner may publish, and publication is a new
        payment-setup LinkedRecord version on the definition - named, carrying
        its author, naming what it supersedes, never edited. There is no
        update route, deliberately. The rate values are L2; the publication
        act is the record. The author prices the unit; nothing here can touch
        the definition itself.
      responses:
        "201": { description: The stored LinkedRecord version. }
        "403": { description: The caller is not the assigned rate owner. }
        "404": { description: No such definition. }
    get:
      operationId: listRates
      summary: Every published version, and the one in force at a moment
      description: >
        `?at=` (RFC3339, default now) answers which version prices a payment
        released then - the version in force at the relevant time, so a later
        publication never reprices work already done.
      responses:
        "200": { description: "`rates`, and `inForce` when one applies." }

  /v1/mechanisms:
    post:
      operationId: createMechanism
      summary: Record a payment mechanism for a context (f2_8)
      description: >
        Created CONFIGURED, never ACTIVE: configured is not the same as live,
        and the gap between them is a real recorded state (f1_5). One per
        context. The owner named here is who a held payment lands with (W10).
      responses:
        "201": { description: Mechanism, standing, and readable conditions. }
        "409": { description: The context already has a mechanism. }

  /v1/mechanisms/{id}:
    get:
      operationId: getMechanism
      summary: The mechanism, its standing, and its activation conditions
      responses:
        "200": { description: Satisfied and unsatisfied conditions alike. }
        "404": { description: No such mechanism. }

  /v1/mechanisms/by-context/{contextId}:
    get:
      operationId: getMechanismByContext
      summary: A context's mechanism, or the honest absence of one
      responses:
        "200":
          description: >
            Always 200: `standing` is `not-configured`, `configured-not-live`
            (f1_5's half-done state) or `live`.

  /v1/mechanisms/{id}/test-disbursements:
    post:
      operationId: testDisbursement
      summary: Prove the whole path once with one real payment (f2_4)
      description: >
        Sends one payment through the configured rail and records the result
        either way; only a SUCCEEDED test satisfies the proving condition.
        A FAILED test is still a 201 - the test happened, and its failure
        carries a reason with an owner.
      responses:
        "201": { description: The recorded test with its result. }
        "404": { description: No such mechanism. }

  /v1/mechanisms/{id}/records:
    post:
      operationId: addMechanismRecord
      summary: File one recorded set-up act
      description: >
        kind is reconciliation-agreement (f2_5), statement-agreement (f2_6),
        batching-choice (f2_7, refuses a choice whose trade-off is unstated),
        qualification-submitted or qualification-verified (f2_9, f2_10;
        verification of nothing is refused). Payload values are L2, stored
        opaquely; the actor and moment are the record.
      responses:
        "201": { description: The record. }
        "400": { description: Unknown kind, or a batching choice with no trade-off. }
        "409": { description: Verifying a qualification nobody submitted. }

  /v1/mechanisms/{id}/activate:
    post:
      operationId: activateMechanism
      summary: The last gate, and what it opens (f2_8, f2_10)
      description: >
        Refuses with every condition readable while any is unmet. On success
        the mechanism goes ACTIVE and every instruction held under
        mechanism_not_live for its context is re-priced at its own release
        moment and sent - activation is what lets disbursement flow; the
        obligations were already created by their window exits (f2_9, W4).
      responses:
        "200": { description: "ACTIVE, plus `releasedInstructionIds`." }
        "409": { description: Gates unmet; the conditions are in the body. }
        "404": { description: No such mechanism. }

  /v1/reconciliation/file:
    get:
      operationId: reconciliationFile
      summary: The export that makes a mismatch findable (f2_5)
      description: >
        Format crest-recon-csv-v1 (also stated in the
        X-CREST-Reconciliation-Format header): CSV, one line per payment
        instruction, tied back by instruction id, claim id and rail reference.
        Columns are append-only - added, never renamed or removed.
      responses:
        "200":
          description: The file.
          content:
            text/csv: {}

  /v1/statements:
    get:
      operationId: statement
      summary: One party's advisory monthly statement (f2_6)
      description: >
        `?partyId=&month=YYYY-MM`. Advisory, and it says so on itself: every
        statement carries a `limits` list stating that the rail's own
        statement is authoritative and that held payments appear with their
        reason and owner rather than going missing.
      responses:
        "200": { description: Instructions, totals by currency, limits. }
        "400": { description: partyId or month missing or malformed. }

  # Every CREST service carries these two, added by pkg/httpx.Server.
  /healthz: { $ref: "#/components/pathItems/healthz" }
  /readyz: { $ref: "#/components/pathItems/readyz" }


  /internal/clock:
    get:
      operationId: readClock
      summary: What time does this service think it is?
      description: >
        Present only when CLOCK_DRIVEABLE is set, which pkg/service refuses in
        production. The confirmation window is seven days; a harness that waits
        seven days is not a harness, and one that shortens the window to a second
        is testing a different system. So outside production a service is handed
        its time. In production this path does not exist, because a clock an HTTP
        call can move is a clock that can close a worker's window early on them.
      responses:
        "200":
          description: The service's current time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
    post:
      operationId: setClock
      summary: Move this service's clock
      description: >
        Set an instant, or advance by a duration. The harness moves every service
        together: a stack where evidence is on Tuesday and confirmation is on
        Friday produces results that are nobody's design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: string, format: date-time }
                advance: { type: string, description: "A Go duration, e.g. 168h." }
      responses:
        "200":
          description: The clock after the move.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
        "400":
          description: Neither an instant nor a duration, or a duration that does not parse.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:

  schemas:
    Error:
      type: object
      description: >
        The error body every CREST service returns (pkg/httpx). The message is
        written for whoever reads it, including eventually a worker being told why
        something is held.
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Per-field detail from schema validation, when there is any.

  responses:
    BadBody:
      description: >
        The body could not be read, or carried a field this service does not know.
        Unknown fields are rejected rather than dropped - a misspelled field is a
        wrong number nobody notices.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SchemaViolation:
      description: The document does not satisfy its JSON Schema; `problems` lists every failure at once.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such record.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Internal:
      description: The service logged the cause and did not leak it.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  pathItems:
    healthz:
      get:
        operationId: healthz
        tags: [health]
        summary: Liveness
        description: The process is up. Separate from readiness on purpose - a service can be alive and unable to serve.
        responses:
          "200":
            description: Alive.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ok }
                    time: { type: string, format: date-time }
    readyz:
      get:
        operationId: readyz
        tags: [health]
        summary: Readiness
        description: >
          Actually touches the database. The harness polls this instead of
          sleeping, so a readyz that always says yes turns every start-up race into
          a flaky test rather than a failed one.
        responses:
          "200":
            description: Ready to serve.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ready }
          "503":
            description: Alive but not serving; `reason` says what is unreachable.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string }
                    reason: { type: string }
