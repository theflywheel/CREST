openapi: 3.1.0
info:
  title: CREST evidence
  version: "1"
  description: |
    Where a source system's file becomes units and claims, with provenance facts
    attached and nothing about trust strength stored.

    Units, claims and evidence records are referenced by the `$id` of their JSON
    Schema under `schemas/` rather than restated here - `schemas/` is the source of
    truth, and a second copy of a primitive is what `schemas/README.md` exists to
    prevent.
servers:
  - url: http://evidence:8080
    description: In-cluster address used by the other services.

paths:
  /v1/batches:
    post:
      operationId: submitBatch
      summary: Submit a batch of work records
      description: >
        The body is the source file itself; everything about the source is query
        parameters. The split is the point: the payload is what the source system
        said, and the parameters are what the deployment knows about that source.
        Provenance comes from the second, never the first (§8) - which is why a
        batch with unknown provenance is refused rather than ingested at a guess.
        Each row is resolved against the registry; rows that resolve to nobody or
        to more than one party go to the unclear queue rather than being attached
        to a best guess (W7).
      parameters:
        - { name: contextId, in: query, required: true, schema: { type: string } }
        - { name: definitionId, in: query, required: true, schema: { type: string } }
        - { name: submittedBy, in: query, required: true, schema: { type: string }, description: The party accountable for the submission. }
        - { name: sourceClass, in: query, required: true, schema: { type: string }, description: What kind of system this came from - a provenance fact, never a tier. }
        - { name: captureMethod, in: query, required: true, schema: { type: string } }
        - { name: sourceExposure, in: query, required: true, schema: { type: string } }
        - { name: systemRef, in: query, schema: { type: string }, description: The specific source system instance. }
      requestBody:
        required: true
        description: The CSV file as sent by the source system. Up to 64 MiB.
        content:
          text/csv:
            schema: { type: string }
      responses:
        "201":
          description: >
            Ingested. The result reports what became units and claims and what did
            not - a batch is never all-or-nothing at the row level.
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId: { type: string }
                  rows: { type: integer }
                  units: { type: integer }
                  claims: { type: integer }
                  unclear: { type: integer, description: Rows sent to the unclear queue. }
                  rejections:
                    type: array
                    items: { type: object }
                    description: Rows the adapter could not read, each with its reason.
        "400":
          description: A required provenance parameter is missing, or the body could not be read.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: >
            `unparseable_batch` - the header is unusable, so the file is refused
            whole and the missing column is named. Or `batch_refused` - ingest
            could not proceed, e.g. the definition is unknown.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/batches/{id}:
    get:
      operationId: getBatch
      summary: Read a batch
      description: What was submitted, by whom, under what provenance, and what came of it.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The batch record.
          content: { application/json: { schema: { type: object } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/units/{id}:
    get:
      operationId: getUnit
      summary: Read a unit of work
      description: >
        The work itself, independent of who performed it (W3). Payments reads this
        to work out the amount owed. A disputed claim never destroys this record,
        which is exactly why the two are separate resources.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The unit.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:unit:1"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/claims:
    get:
      operationId: listClaims
      summary: Which claims exist?
      description: >
        A claim links a party to a unit (W3). Filterable by party and state, which
        is how a worker-facing view answers "what have I been credited with".


        `partyId` follows merges (#100). A party absorbed into another still owns
        every record written before the merge, and those records still name it —
        a statement about whose work it was at the time is true and is not
        rewritten — so this filter expands to every id in the merge chain.
        Otherwise the survivor's history would have a hole exactly where the
        system corrected itself about who they were. Asking about an absorbed id
        gives the same answer, because the printed cards and saved links that
        name it have to keep working.

      parameters:
        - { name: partyId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          description: The matching claims.
          content:
            application/json:
              schema:
                type: object
                required: [claims]
                properties:
                  claims:
                    type: array
                    items:
                      $ref: "urn:crest:schema:primitives:claim:1"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/claims/{id}:
    get:
      operationId: getClaim
      summary: Read a claim
      description: Who is credited with which unit, and where that claim has got to in its window.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The claim.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:claim:1"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/claims/{id}/transition:
    post:
      operationId: transitionClaim
      summary: Move a claim to another state
      description: >
        How confirmation drives the claim state machine. Every legal move is a
        request rather than a database write, which is what lets the harness make
        any of them without reaching behind the service. An illegal move is a 409,
        not a silent no-op.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: The target claim state. }
                route:
                  type: string
                  description: >
                    Which of the four exits took the claim there - self, auto,
                    assisted or dispute. Recorded on the confirmation, never
                    branched on for payment (W4).
      responses:
        "200":
          description: The claim in its new state.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:claim:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "404":
          description: No such claim.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The move is not legal from the claim's current state.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/unclear:
    get:
      operationId: listUnclear
      summary: Which rows could not be attributed to a person?
      description: >
        Rows whose identifier resolved to nobody, or to more than one candidate.
        They are held here rather than attached to a best guess (W7), and the count
        is a number someone is meant to watch fall.
      responses:
        "200":
          description: The open unclear rows.
          content:
            application/json:
              schema:
                type: object
                required: [unclear, count]
                properties:
                  unclear: { type: array, items: { type: object } }
                  count: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/unclear/{id}/resolve:
    post:
      operationId: resolveUnclear
      summary: Say whose work an unattributed row was
      description: >
        Attaches a named worker to a row nobody could attribute, creating the
        unit and the claim the row would have produced at ingestion, and opening
        the worker's confirmation window (#25).


        Three things are deliberate. The seven-day window runs from the
        resolution, not from when the batch arrived: a worker cannot object to a
        record they were never shown, and starting the clock at ingest would
        auto-confirm late-resolved work before they had seen it once.
        Re-attribution has no confirmation step of its own, because the window
        it opens *is* that step — unlike a registry merge, which alters who
        somebody is and cannot be undone by disputing a record. And only a row
        whose `kind` is `unattributed` can be resolved: every other kind failed
        the evidence contract, and attaching a person to one would launder a
        failed record into the ledger wearing a worker's name.


        The resolver needs the `resolve-unclear-evidence` function in the
        batch's context. That is deliberately not `submit-work-evidence`:
        whoever sends the file must not also decide whose work its unmatched
        rows were.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, resolvedByPartyId]
              properties:
                partyId:
                  type: string
                  description: The worker the row is being attributed to.
                resolvedByPartyId:
                  type: string
                  description: >
                    Who decided. A re-attribution with no named resolver is the
                    same shape of unaccountable as a held payment with no owner.
      responses:
        "200":
          description: >
            The row is closed and the work is the worker's. `claimId` is absent
            when the same work was already claimed by the same worker, in which
            case the row is still closed and `note` says why.
          content:
            application/json:
              schema:
                type: object
                required: [unclearRowId, partyId, resolvedBy, resolvedAt, unitId]
                properties:
                  unclearRowId: { type: string }
                  partyId: { type: string }
                  resolvedBy: { type: string }
                  resolvedAt: { type: string, format: date-time }
                  unitId: { type: string }
                  claimId: { type: string }
                  confirmationWindowOpensAt: { type: string, format: date-time }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadBody" }
        "403":
          description: The resolver holds no grant to resolve unclear evidence here.
        "404":
          description: No open row with that id; it may already have been resolved.
        "409":
          description: >
            The row is not re-attributable — it failed the evidence contract, it
            has no parsed record, or the worker named has withdrawn enrolment
            consent (§9).
        "500": { $ref: "#/components/responses/Internal" }

  /v1/sources:
    post:
      operationId: registerSource
      summary: Declare a feed this deployment expects evidence from
      description: >
        Registers a source for heartbeat monitoring (#22, Blueprint §8).

        A source going quiet is the only failure in this system that produces
        nothing a worker can see or report. A held payment has a reason they can
        ask about; a rejected row is in the unclear queue; a wrong record can be
        disputed. When a feed stops, the worker keeps working and their record
        simply stops growing - which from where they stand is indistinguishable
        from having done no work. So the system has to notice it unaided.

        `expectedEvery` and `ownerPartyId` are both required and neither is
        defaulted. A cadence inferred from history learns from a degraded feed
        and calls it healthy; an owner defaulted to nobody produces an alert
        that gets forwarded until it is nobody's.

        Re-registering an existing feed updates its cadence and owner and keeps
        its identity and history. Resetting the heartbeat would make a feed look
        healthy for one cadence because somebody edited a row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapterRef, contextId, expectedEvery, ownerPartyId]
              properties:
                adapterRef: { type: string }
                contextId:
                  type: string
                  description: >
                    The same adapter serving two projects is two sources: it can
                    go quiet for one and not the other, and one row would average
                    that away.
                systemRef:
                  type: string
                  description: The name the feed's operator knows it by; it is what the outage message names.
                expectedEvery:
                  type: string
                  description: A positive Go duration, e.g. "24h".
                ownerPartyId: { type: string }
                mapping:
                  type: object
                  description: >
                    How this source's own file vocabulary reaches the canonical
                    record. Configuration, and it could not be anything else:
                    what a source system calls its columns is the definition of
                    a thing two deployments disagree about while both remain
                    CREST. Omit it for a file that already uses CREST's column
                    names.


                    Note what a mapping cannot name: `sourceClass`,
                    `captureMethod` and `adapterRef`. Provenance is attached by
                    the pipeline from what the deployment knows about the source
                    (§8), so a file's vocabulary can never argue for its own
                    trust tier.
                  properties:
                    columns:
                      type: object
                      description: 'Canonical field to the column carrying it: {"period_start": "eventDate"}.'
                      additionalProperties: { type: string }
                    constants:
                      type: object
                      description: >
                        Canonical fields the file does not carry at all. A
                        programme's unit of measure is a fact about the
                        programme, not about a row. A column always wins over a
                        constant.
                      additionalProperties: { type: string }
                    enrichment:
                      type: object
                      description: >
                        Renames for columns CREST does not interpret but a
                        definition might. A tier map names the fields it
                        requires in the deployment's vocabulary, so a source
                        calling it "Household ID" would otherwise silently miss
                        a rule requiring `household_id` — and a worker would be
                        paid at a lower tier for a reason having nothing to do
                        with their evidence.
                      additionalProperties: { type: string }
                  additionalProperties: false
      responses:
        "201":
          description: The registered source, with its derived state.
          content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listSources
      summary: Which feeds are healthy, and which have gone quiet?
      description: >
        `?state=SILENT` is the query somebody should be able to alert on, and
        `silent` is the count for a monitor that would rather not parse a list.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [HEALTHY, SILENT, NEVER_SEEN] }
      responses:
        "200":
          description: The registered sources.
          content:
            application/json:
              schema:
                type: object
                required: [sources, count, silent]
                properties:
                  sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
                  count: { type: integer }
                  silent: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/sources/sweep:
    post:
      operationId: sweepSources
      summary: Notice which feeds have gone quiet and tell their owners
      description: >
        Driven by a call rather than a background ticker, like confirmation's
        window sweep: a test that waits on a goroutine is flaky on a slow
        runner, and an operator who cannot make it run now cannot check that
        their fix worked.

        Alerts fire on the *transition* into silence, not on the state. A sweep
        runs often and a source can be quiet for weeks; one message per sweep is
        how an alert channel becomes something people mute, and the muted
        channel is the one the real outage arrives on. `stillQuiet` is returned
        alongside so a second sweep over an unfixed outage does not read as
        "nothing wrong".
      responses:
        "200":
          description: What this sweep discovered, and what was already open.
          content:
            application/json:
              schema:
                type: object
                required: [wentQuiet, stillQuiet, checked]
                properties:
                  wentQuiet: { type: array, items: { type: string } }
                  stillQuiet: { type: array, items: { type: string } }
                  checked: { type: integer }
        "500": { $ref: "#/components/responses/Internal" }

  # Every CREST service carries these two, added by pkg/httpx.Server.
  /healthz: { $ref: "#/components/pathItems/healthz" }
  /readyz: { $ref: "#/components/pathItems/readyz" }


  /internal/clock:
    get:
      operationId: readClock
      summary: What time does this service think it is?
      description: >
        Present only when CLOCK_DRIVEABLE is set, which pkg/service refuses in
        production. The confirmation window is seven days; a harness that waits
        seven days is not a harness, and one that shortens the window to a second
        is testing a different system. So outside production a service is handed
        its time. In production this path does not exist, because a clock an HTTP
        call can move is a clock that can close a worker's window early on them.
      responses:
        "200":
          description: The service's current time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
    post:
      operationId: setClock
      summary: Move this service's clock
      description: >
        Set an instant, or advance by a duration. The harness moves every service
        together: a stack where evidence is on Tuesday and confirmation is on
        Friday produces results that are nobody's design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: string, format: date-time }
                advance: { type: string, description: "A Go duration, e.g. 168h." }
      responses:
        "200":
          description: The clock after the move.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
        "400":
          description: Neither an instant nor a duration, or a duration that does not parse.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:

  schemas:
    Source:
      type: object
      description: >
        A feed this deployment expects evidence from, and how it is doing.

        `state` and `quietFor` are DERIVED on every read and stored nowhere -
        the same rule as a credential's tier and a Party's identity assurance.
        A stored state is wrong the moment the clock moves, and the whole
        subject here is time passing.
      required: [id, adapterRef, contextId, expectedEvery, ownerPartyId, registeredAt, state]
      properties:
        id: { type: string }
        adapterRef: { type: string }
        contextId: { type: string }
        systemRef: { type: string }
        expectedEvery: { type: string }
        ownerPartyId: { type: string }
        registeredAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        silentSince:
          type: string
          format: date-time
          description: When the current silence began. Absent while healthy; it is what makes the alert fire once per episode.
        notifiedAt: { type: string, format: date-time }
        state:
          type: string
          enum: [HEALTHY, SILENT, NEVER_SEEN]
          description: >
            NEVER_SEEN is distinct from SILENT on purpose. A feed that has gone
            quiet is a broken integration; one that never started is a deployment
            step nobody finished. They look identical in a count and need
            different people.
        quietFor: { type: string }

    Error:
      type: object
      description: >
        The error body every CREST service returns (pkg/httpx). The message is
        written for whoever reads it, including eventually a worker being told why
        something is held.
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Per-field detail from schema validation, when there is any.

  responses:
    BadBody:
      description: >
        The body could not be read, or carried a field this service does not know.
        Unknown fields are rejected rather than dropped - a misspelled field is a
        wrong number nobody notices.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SchemaViolation:
      description: The document does not satisfy its JSON Schema; `problems` lists every failure at once.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such record.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Internal:
      description: The service logged the cause and did not leak it.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  pathItems:
    healthz:
      get:
        operationId: healthz
        tags: [health]
        summary: Liveness
        description: The process is up. Separate from readiness on purpose - a service can be alive and unable to serve.
        responses:
          "200":
            description: Alive.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ok }
                    time: { type: string, format: date-time }
    readyz:
      get:
        operationId: readyz
        tags: [health]
        summary: Readiness
        description: >
          Actually touches the database. The harness polls this instead of
          sleeping, so a readyz that always says yes turns every start-up race into
          a flaky test rather than a failed one.
        responses:
          "200":
            description: Ready to serve.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ready }
          "503":
            description: Alive but not serving; `reason` says what is unreachable.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string }
                    reason: { type: string }
