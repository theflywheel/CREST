openapi: 3.1.0
info:
  title: CREST notify
  version: "1"
  description: |
    Telling a worker there is a record of their work and by when they can object.

    Contact routes come from the Party primitive under `schemas/` and are
    referenced by `$id` rather than restated - `schemas/` is the source of truth,
    and a second copy of a primitive is what `schemas/README.md` exists to prevent.
servers:
  - url: http://notify:8080
    description: In-cluster address used by the other services.

paths:
  /v1/notifications:
    post:
      operationId: sendNotification
      summary: Tell a worker about their claim
      description: >
        Picks the best contact route on the party - phone, then USSD, then email,
        then supervisor - and sends. A supervisor route is a route, not a failure:
        for a worker with no phone, being told through their supervisor is the
        assisted path. A worker with no reachable route at all is recorded as
        UNREACHABLE rather than swallowed, because that row is what lets someone be
        prompted to do the assisted confirmation instead of nobody knowing it is
        needed (§9). W2 is what this endpoint exists for: a worker who was never
        told can neither confirm nor dispute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, kind]
              properties:
                partyId: { type: string }
                claimId: { type: string }
                kind: { type: string, description: "e.g. confirm-your-work, which selects the worker-facing wording." }
                closesAt: { type: string, format: date-time, description: When the window shuts. Appears in the message body. }
      responses:
        "201":
          description: >
            The attempt, recorded - state SENT, FAILED or UNREACHABLE. A failed send
            is still a 201: the attempt happened and is the fact worth keeping, and
            returning an error would have the relay redeliver and write the row
            again.
          content: { application/json: { schema: { $ref: "#/components/schemas/Notification" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "500":
          description: The party's contact route could not be looked up, or the row could not be written.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

    get:
      operationId: listNotifications
      summary: What was this worker actually told?
      description: >
        The record behind an auto-confirmation. If a claim auto-confirmed at T=7,
        this is where "were they told" gets an answer rather than an assumption.
      parameters:
        - { name: partyId, in: query, schema: { type: string } }
      responses:
        "200":
          description: The notifications, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "500": { $ref: "#/components/responses/Internal" }

  # Every CREST service carries these two, added by pkg/httpx.Server.
  /healthz: { $ref: "#/components/pathItems/healthz" }
  /readyz: { $ref: "#/components/pathItems/readyz" }


  /internal/clock:
    get:
      operationId: readClock
      summary: What time does this service think it is?
      description: >
        Present only when CLOCK_DRIVEABLE is set, which pkg/service refuses in
        production. The confirmation window is seven days; a harness that waits
        seven days is not a harness, and one that shortens the window to a second
        is testing a different system. So outside production a service is handed
        its time. In production this path does not exist, because a clock an HTTP
        call can move is a clock that can close a worker's window early on them.
      responses:
        "200":
          description: The service's current time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
    post:
      operationId: setClock
      summary: Move this service's clock
      description: >
        Set an instant, or advance by a duration. The harness moves every service
        together: a stack where evidence is on Tuesday and confirmation is on
        Friday produces results that are nobody's design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: string, format: date-time }
                advance: { type: string, description: "A Go duration, e.g. 168h." }
      responses:
        "200":
          description: The clock after the move.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
        "400":
          description: Neither an instant nor a duration, or a duration that does not parse.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:

  schemas:
    Error:
      type: object
      description: >
        The error body every CREST service returns (pkg/httpx). The message is
        written for whoever reads it, including eventually a worker being told why
        something is held.
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Per-field detail from schema validation, when there is any.

    Notification:
      type: object
      description: One attempt to reach a worker, successful or not.
      required: [id, partyId, kind, channel, state, createdAt]
      properties:
        id: { type: string }
        partyId: { type: string }
        claimId: { type: string }
        kind: { type: string }
        channel: { type: string, enum: [phone, ussd, email, supervisor, none] }
        destination: { type: string }
        body: { type: string, description: The wording sent. It says they will be paid either way, because the alternative reads like a threat. }
        state: { type: string, enum: [SENT, FAILED, UNREACHABLE] }
        failure: { type: string }
        createdAt: { type: string, format: date-time }
  responses:
    BadBody:
      description: >
        The body could not be read, or carried a field this service does not know.
        Unknown fields are rejected rather than dropped - a misspelled field is a
        wrong number nobody notices.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SchemaViolation:
      description: The document does not satisfy its JSON Schema; `problems` lists every failure at once.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such record.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Internal:
      description: The service logged the cause and did not leak it.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  pathItems:
    healthz:
      get:
        operationId: healthz
        tags: [health]
        summary: Liveness
        description: The process is up. Separate from readiness on purpose - a service can be alive and unable to serve.
        responses:
          "200":
            description: Alive.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ok }
                    time: { type: string, format: date-time }
    readyz:
      get:
        operationId: readyz
        tags: [health]
        summary: Readiness
        description: >
          Actually touches the database. The harness polls this instead of
          sleeping, so a readyz that always says yes turns every start-up race into
          a flaky test rather than a failed one.
        responses:
          "200":
            description: Ready to serve.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ready }
          "503":
            description: Alive but not serving; `reason` says what is unreachable.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string }
                    reason: { type: string }
