openapi: 3.1.0
info:
  title: CREST definitions
  version: "1"
  description: |
    What counts as a unit of work, who ratified it, and the three faces the same
    record is read through.

    Bodies that are CREST primitives are referenced by the `$id` of their JSON
    Schema under `schemas/` rather than restated here. `schemas/` is the source of
    truth; a second copy of a primitive is what `schemas/README.md` exists to
    prevent.
servers:
  - url: http://definitions:8080
    description: In-cluster address used by the other services.

paths:
  /v1/definitions:
    post:
      operationId: createDefinition
      summary: Create a definition
      description: >
        Registers what a unit of work is and how its strength is judged. Defaults
        to DRAFT version 1. A definition may be created straight past DRAFT only if
        the caller supplies a ratifier who is not the author - fixture seeding uses
        that path; a person uses the two-step ratify/activate route, which is why
        it exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:definition:1"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:definition:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "409":
          description: >
            The ratifier is the author. Separation of duties is an L1 rule (§7):
            nobody approves their own definition, on the creation path either.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: Either the document fails its schema, or it claims a state past DRAFT with no ratifier.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definitions/{id}:
    get:
      operationId: getDefinition
      summary: Read a definition
      description: >
        Answers what a credential was measured under. Verification calls this with
        an explicit `version` because a credential pins the version it was issued
        against - resolving it to "latest" would rewrite history.
      parameters:
        - { $ref: "#/components/parameters/DefinitionID" }
        - name: version
          in: query
          schema: { type: integer }
          description: The exact version. Omitted means the current one.
      responses:
        "200":
          description: The definition.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:definition:1"
        "400":
          description: "`version` is not a number."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definitions/{id}/faces/{face}:
    get:
      operationId: getDefinitionFace
      summary: Read one face of a definition
      description: >
        Three faces, one signed record, never three documents (§7). This reads the
        same row three ways rather than storing three things that can disagree. The
        verifier face additionally carries the tier map, because a verifier who
        cannot see the evidence-to-tier map cannot check the tier they are shown -
        they can only be told it.
      parameters:
        - { $ref: "#/components/parameters/DefinitionID" }
        - name: face
          in: path
          required: true
          schema: { type: string, enum: [worker, platform, verifier] }
        - { name: version, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The common header plus the requested face.
          content:
            application/json:
              schema:
                type: object
                required: [definitionId, version, activity, outcomeUnit, state]
                properties:
                  definitionId: { type: string }
                  version: { type: integer }
                  activity: { type: object }
                  outcomeUnit: { type: object }
                  state: { type: string }
                  worker: { type: object }
                  platform: { type: object }
                  verifier: { type: object }
                  tierMap:
                    type: object
                    description: Present on the verifier face only.
        "400":
          description: "`version` is not a number."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such definition, or no such face - the faces are worker, platform and verifier.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definitions/{id}/versions/{version}/ratify:
    post:
      operationId: ratifyDefinition
      summary: Ratify a draft
      description: >
        Moves DRAFT to RATIFIED, recording who approved it. Answers 409 when the
        ratifier is the author: separation of duties is an L1 rule (§7), so a
        self-ratified definition is refused rather than flagged.
      parameters:
        - { $ref: "#/components/parameters/DefinitionID" }
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ratifiedByPartyId]
              properties:
                ratifiedByPartyId: { type: string }
                pendingFields:
                  type: array
                  items: { type: string }
                  description: >
                    What the ratifier judged acceptable to leave open (p3_15).
                    RATIFIED-with-pending is a real recorded state, not a blocked
                    one; only the approver may declare it, and the declaration is
                    appended to the version's event record with their name on it.
      responses:
        "200":
          description: Ratified.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:definition:1"
        "400":
          description: The body is unreadable, or the path version is not a number.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such definition version.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >
            `self_ratified` - the ratifier is the author, refused under §7. Or
            `cannot_ratify` - the version is not in DRAFT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definitions/{id}/versions/{version}/activate:
    post:
      operationId: activateDefinition
      summary: Activate a ratified version
      description: >
        Moves RATIFIED to ACTIVE and stamps `activatedAt`. Only from RATIFIED -
        activation is what makes a version usable for issuance, so skipping
        ratification would put unapproved rules behind someone's credential.
      parameters:
        - { $ref: "#/components/parameters/DefinitionID" }
        - { $ref: "#/components/parameters/Version" }
      responses:
        "200":
          description: Active.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:definition:1"
        "400":
          description: The path version is not a number.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such definition version.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >
            `immutable` - an active version cannot be edited, only superseded by a
            new one. Or `cannot_activate` - the version is not RATIFIED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definitions/{id}/linked-records:
    post:
      operationId: addLinkedRecord
      summary: Attach a linked record to a definition
      description: >
        Attaches use-case data - a payment rate, for instance - without putting it
        in the primitive. The core stores the payload opaquely, but a record keyed
        to a definition has to be checked by somebody, so a `payment-setup` payload
        is validated against its profile schema here.
      parameters: [{ $ref: "#/components/parameters/DefinitionID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "urn:crest:schema:primitives:linked-record:1"
      responses:
        "201":
          description: Attached. `keyedTo` is set by the server from the path.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:linked-record:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "422":
          description: >
            The record fails the LinkedRecord schema, or a `payment-setup` payload
            fails `urn:crest:schema:profiles:trusted-payments:payment-setup:1`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listLinkedRecords
      summary: What is attached to this definition?
      description: >
        Payments calls this with `type=payment-setup` to find the rate. An empty
        list is a legitimate answer, not a failure: a definition is complete with
        no rate attached, because recognition is a use of its own (§7).
      parameters:
        - { $ref: "#/components/parameters/DefinitionID" }
        - { name: type, in: query, schema: { type: string }, description: Filter by linked-record type. }
      responses:
        "200":
          description: The attached records, possibly none.
          content:
            application/json:
              schema:
                type: object
                required: [linkedRecords]
                properties:
                  linkedRecords:
                    type: array
                    items:
                      $ref: "urn:crest:schema:primitives:linked-record:1"
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definitions/{id}/events:
    get:
      operationId: listDefinitionEvents
      summary: The governance record for a definition
      description: >
        Append-only: who submitted, who ratified naming which pending fields, who
        activated, who recorded a payment handoff. The definition document shows
        the current state; this shows how it got there, which is what a dispute
        needs.
      parameters: [{ $ref: "#/components/parameters/DefinitionID" }]
      responses:
        "200":
          description: The events, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, definitionId, version, action, actorPartyId, at]
                      properties:
                        id: { type: integer }
                        definitionId: { type: string }
                        version: { type: integer }
                        action: { type: string }
                        actorPartyId: { type: string }
                        at: { type: string, format: date-time }
                        detail: { type: object }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definitions/{id}/versions/{version}/template:
    get:
      operationId: definitionTemplate
      summary: The spreadsheet template for one version
      description: >
        Derived from the version's platform face and tier map, never stored, so it
        cannot drift from the version it serves (p3_23). Publishing a new version
        inherently produces a fresh template; files built on the old one describe
        the old version.
      parameters:
        - { $ref: "#/components/parameters/DefinitionID" }
        - { $ref: "#/components/parameters/Version" }
        - { name: format, in: query, schema: { type: string, enum: [csv] }, description: "`csv` returns the header row itself." }
      responses:
        "200":
          description: The template, pinned to the version.
          content:
            application/json:
              schema:
                type: object
                required: [definitionId, version, activity, filename, columns, requiredEnrichment]
                properties:
                  definitionId: { type: string }
                  version: { type: integer }
                  activity: { type: string }
                  filename: { type: string }
                  columns: { type: array, items: { type: string } }
                  requiredEnrichment: { type: array, items: { type: string } }
            text/csv:
              schema: { type: string }
        "404":
          description: No such definition version.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definitions/{id}/versions/{version}/payment-handoff:
    post:
      operationId: recordPaymentHandoff
      summary: Hand pricing to a rate owner
      description: >
        Records the invitation (p3_pay): the definition is signed, nothing prices
        it yet, and that is a complete state made visible rather than an error. The
        record is a `payment-handoff` LinkedRecord; the authority itself is the
        payments service's RateOwnerAssignment (F-1), which this composes with and
        never substitutes for.
      parameters:
        - { $ref: "#/components/parameters/DefinitionID" }
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitedByPartyId]
              properties:
                invitedByPartyId: { type: string }
                invitedPartyId: { type: string, description: "Optional: a handoff can be recorded before anyone is named." }
                note: { type: string }
      responses:
        "201":
          description: The handoff record, also appended to the event log.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:linked-record:1"
        "400": { $ref: "#/components/responses/BadBody" }
        "404":
          description: No such definition version.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: The payload fails `urn:crest:schema:profiles:trusted-payments:payment-handoff:1`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/adaptors:
    get:
      operationId: listAdaptors
      summary: The adaptor catalogue, honestly
      description: >
        Built from the connector registry linked into the binary, plus named
        absences. A deployment can expose additional connector classes by
        registering their implementation. Entries the reference journey shows
        but CREST does not have say `not-implemented` rather than appearing available.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [adaptors]
                properties:
                  adaptors:
                    type: array
                    items:
                      type: object
                      required: [class, status]
                      properties:
                        ref: { type: string }
                        class: { type: string }
                        name: { type: string }
                        contentTypes: { type: array, items: { type: string } }
                        status: { type: string, enum: [available, not-implemented] }
                        note: { type: string }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definition-drafts:
    post:
      operationId: createDraft
      summary: Start a draft
      description: >
        Empty ("Define new work", p3_2) or cloned from an existing version
        ("Clone a version", p3_1). Cloning rebuilds the wizard document from the
        version and edits a copy; nothing on this path can reach the source
        version. Drafts are the one mutable object in this service, and only
        while OPEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [createdByPartyId]
              properties:
                createdByPartyId: { type: string }
                cloneFromDefinitionId: { type: string }
                cloneFromVersion: { type: integer }
                doc: { $ref: "#/components/schemas/DraftDoc" }
      responses:
        "201":
          description: The draft, OPEN.
          content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "404":
          description: The definition to clone does not exist.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`no_author` - a draft records who is authoring it."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listDrafts
      summary: List drafts
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [OPEN, SUBMITTED, DISCARDED] } }
      responses:
        "200":
          description: The drafts, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts: { type: array, items: { $ref: "#/components/schemas/Draft" } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definition-drafts/{id}:
    get:
      operationId: getDraft
      summary: Read a draft
      parameters: [{ $ref: "#/components/parameters/DraftID" }]
      responses:
        "200":
          description: The draft.
          content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } }
        "404":
          description: No such draft.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definition-drafts/{id}/sections/{section}:
    put:
      operationId: putDraftSection
      summary: Replace one wizard section
      description: >
        Whole-section writes, because that is what the wizard's Continue buttons
        mean. Sections: scope, activity, parties, evidence, validation, sources,
        cascade, extensions, payment. Refused once the draft is submitted or
        discarded - a submitted draft is the provenance of the version it produced.
      parameters:
        - { $ref: "#/components/parameters/DraftID" }
        - { name: section, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          description: The draft after the write.
          content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } }
        "404":
          description: No such draft.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`draft_closed` - the draft is no longer open."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`bad_section` - unknown section name or unparseable body."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definition-drafts/{id}/discard:
    post:
      operationId: discardDraft
      summary: Discard a draft
      parameters: [{ $ref: "#/components/parameters/DraftID" }]
      responses:
        "200": { description: Discarded. }
        "404":
          description: No such draft.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`draft_closed` - already submitted or discarded."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definition-drafts/{id}/validate:
    post:
      operationId: validateDraft
      summary: What stands between this draft and a definition?
      description: >
        Compiles the draft and reports every open question by section (p3_15,
        p3_18), plus the compiled preview. The same function submit runs, so the
        review can never disagree with the submission it precedes. Writes nothing.
      parameters: [{ $ref: "#/components/parameters/DraftID" }]
      responses:
        "200":
          description: Readiness, problems, and the compiled preview.
          content:
            application/json:
              schema:
                type: object
                required: [ready, problems]
                properties:
                  ready: { type: boolean }
                  problems: { type: array, items: { $ref: "#/components/schemas/Problem" } }
                  preview: { $ref: "urn:crest:schema:primitives:definition:1" }
        "404":
          description: No such draft.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definition-drafts/{id}/dry-run:
    post:
      operationId: dryRunDraft
      summary: Sample evidence against the draft, committing nothing
      description: >
        Runs the sample through the same CSV adapter and the same strength
        function the real pipeline uses (p3_27). Source facts come from the
        request, never the file. Nothing is written - no unit, no source, no
        queue entry - and identity resolution is deliberately not rehearsed:
        joining identifiers resolve against real registries at ingestion.
      parameters: [{ $ref: "#/components/parameters/DraftID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv, sourceClass, captureMethod]
              properties:
                csv: { type: string }
                sourceClass: { type: string }
                captureMethod: { type: string }
                systemRef: { type: string }
                mapping: { type: object }
                identityAssurance: { type: string }
      responses:
        "200":
          description: Per-row verdicts and adapter rejections; `committed` is always false.
          content: { application/json: { schema: { type: object } } }
        "404":
          description: No such draft.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: >
            `no_sample`, `no_source_facts`, `unparseable`, or `draft_not_testable` -
            the evidence rules and activity must be settled before rows can be
            judged against them.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/definition-drafts/{id}/submit:
    post:
      operationId: submitDraft
      summary: Compile the draft into the next immutable version
      description: >
        One transaction: the definitions row (state DRAFT, awaiting ratification),
        the LinkedRecords the draft implies (linked-definition cascade,
        payment-structure), the SUBMITTED event, and the draft's closure. A draft
        with open questions is refused with the list, not guessed at.
      parameters: [{ $ref: "#/components/parameters/DraftID" }]
      responses:
        "201":
          description: The definition version the draft became.
          content:
            application/json:
              schema:
                $ref: "urn:crest:schema:primitives:definition:1"
        "404":
          description: No such draft.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`draft_closed` - already submitted or discarded."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`not_ready` - the open questions are listed in `problems`."
          content: { application/json: { schema: { type: object } } }
        "500": { $ref: "#/components/responses/Internal" }

  # Every CREST service carries these two, added by pkg/httpx.Server.
  /healthz: { $ref: "#/components/pathItems/healthz" }
  /readyz: { $ref: "#/components/pathItems/readyz" }


  /internal/clock:
    get:
      operationId: readClock
      summary: What time does this service think it is?
      description: >
        Present only when CLOCK_DRIVEABLE is set, which pkg/service refuses in
        production. The confirmation window is seven days; a harness that waits
        seven days is not a harness, and one that shortens the window to a second
        is testing a different system. So outside production a service is handed
        its time. In production this path does not exist, because a clock an HTTP
        call can move is a clock that can close a worker's window early on them.
      responses:
        "200":
          description: The service's current time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
    post:
      operationId: setClock
      summary: Move this service's clock
      description: >
        Set an instant, or advance by a duration. The harness moves every service
        together: a stack where evidence is on Tuesday and confirmation is on
        Friday produces results that are nobody's design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: string, format: date-time }
                advance: { type: string, description: "A Go duration, e.g. 168h." }
      responses:
        "200":
          description: The clock after the move.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
        "400":
          description: Neither an instant nor a duration, or a duration that does not parse.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:
  parameters:
    DefinitionID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer }
    DraftID:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    Draft:
      type: object
      description: >
        The authoring document with its lifecycle facts. Mutable only while
        state is OPEN; a SUBMITTED draft is the provenance of the version it
        produced and names it in submittedVersion.
      required: [id, state, doc, createdByPartyId, createdAt, updatedAt]
      properties:
        id: { type: string }
        definitionId: { type: string }
        baseVersion: { type: integer }
        state: { type: string, enum: [OPEN, SUBMITTED, DISCARDED] }
        doc: { $ref: "#/components/schemas/DraftDoc" }
        createdByPartyId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedVersion: { type: integer }
    DraftDoc:
      type: object
      description: >
        The wizard document, one property per section (scope, activity, parties,
        evidence, validation, sources, cascade, extensions, payment). The
        authoritative shape is the Go DraftDoc in services/core/definitions;
        compile() is the one translation into the definition primitive.
    Problem:
      type: object
      description: One thing standing between a draft and a definition, named by section.
      required: [section, reason]
      properties:
        section: { type: string }
        field: { type: string }
        reason: { type: string }
    Error:
      type: object
      description: >
        The error body every CREST service returns (pkg/httpx). The message is
        written for whoever reads it, including eventually a worker being told why
        something is held.
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Per-field detail from schema validation, when there is any.

  responses:
    BadBody:
      description: >
        The body could not be read, or carried a field this service does not know.
        Unknown fields are rejected rather than dropped - a misspelled field is a
        wrong number nobody notices.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SchemaViolation:
      description: The document does not satisfy its JSON Schema; `problems` lists every failure at once.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such record.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Internal:
      description: The service logged the cause and did not leak it.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  pathItems:
    healthz:
      get:
        operationId: healthz
        tags: [health]
        summary: Liveness
        description: The process is up. Separate from readiness on purpose - a service can be alive and unable to serve.
        responses:
          "200":
            description: Alive.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ok }
                    time: { type: string, format: date-time }
    readyz:
      get:
        operationId: readyz
        tags: [health]
        summary: Readiness
        description: >
          Actually touches the database. The harness polls this instead of
          sleeping, so a readyz that always says yes turns every start-up race into
          a flaky test rather than a failed one.
        responses:
          "200":
            description: Ready to serve.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ready }
          "503":
            description: Alive but not serving; `reason` says what is unreachable.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string }
                    reason: { type: string }
