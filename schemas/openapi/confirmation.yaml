openapi: 3.1.0
info:
  title: CREST payments application — the confirmation window
  version: "1"
  description: |
    ## Who may call what (#102)

    Every service verifies bearer tokens; this section is who each surface
    answers. Four kinds of path:

    - **Party-authorized** — acts in a named party's name; the caller must be
      that party or hold act-for-party where the action is scoped
      (X-CREST-On-Behalf-Of names the party). Marked `security: bearerAuth`.
    - **Authenticated** — any signed-in caller (custodian queues, operations
      lists). Also `bearerAuth`.
    - **Open by design** — verification, status list, instance, capability
      reads by unguessable id, and the bootstrap plane; each carries a comment
      saying why.
    - **`/internal/*`** — the other services' doors, unauthenticated by the
      service-identity ruling (§16, 2026-08-25): service traffic lives on
      internal routes and fencing them to the service network is the
      deployment's job.
    The confirmation window and what comes out of it: an issuance request to
    the verification service, a payment release, and - whichever of the four
    exits was taken - the money. Since #129 these paths are served by the
    `payments` service (the payments application, one deployable); this file
    keeps its name so the surface's history stays findable, and
    payments.yaml documents the instruction side of the same service.

    Since #127 the payments service is also the process that *runs* them: the
    window's `attestation` member moved out of the `core` infrastructure
    deployable, so these window paths are now the only place in the fleet they
    exist.

    The window's length is `CONFIRMATION_WINDOW`, read in exactly one place —
    the attestation member inside this process. It is programme policy (L2):
    seven days in the CHW programme, seconds on a harness stack, and nothing in
    the infrastructure knows or enforces a number.

    Credentials and contests are referenced by the `$id` of their JSON Schema
    under `schemas/` rather than restated here. `schemas/` is the source of truth;
    a second copy of a primitive is what `schemas/README.md` exists to prevent.
servers:
  - url: http://payments:8080
    description: In-cluster address used by the other services (#129 — the payments application serves this surface).

paths:
  /v1/windows:
    get:
      operationId: listWindows
      summary: One worker's confirmation history
      description: >
        What happened to each of a worker's claims: how the window ended, whether
        the payment was released, and the credential it issued.


        `partyId` is required. A list of every window in the deployment is not a
        worker's record, it is a report, and serving one from the endpoint a
        worker's own client calls is how a bulk export gets built by accident.


        It follows merges (#100). Windows opened before a merge still name the
        party they were opened against, because that was true when they were
        opened, so this expands `partyId` to every id in the merge chain — and
        asking about an absorbed id returns the whole history for the same
        reason.
      parameters:
        - { name: partyId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The worker's windows, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  windows: { type: array, items: { $ref: "#/components/schemas/Window" } }
                  count: { type: integer }
        "400":
          description: No partyId.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: >
            The registry could not say which ids are this party, so the list would be
            incomplete without saying so. Reported rather than answered with a partial
            history the caller would believe.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: openWindow
      summary: Open a confirmation window for a claim
      description: >
        Called by evidence's outbox when a claim is created. Opening the window and
        queueing the worker's notification happen in one transaction: a window
        nobody was told about is a worker who can neither confirm nor dispute,
        which is W5–W6 broken quietly. Redelivery is safe - the second call returns
        the existing window rather than opening a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimId, unitId, partyId]
              properties:
                claimId: { type: string }
                unitId: { type: string }
                partyId: { type: string }
                contextId: { type: string }
                definitionId: { type: string }
                definitionVersion: { type: integer }
                createdAt: { type: string, format: date-time }
      responses:
        "201":
          description: The window, whether it was opened now or already existed.
          content: { application/json: { schema: { $ref: "#/components/schemas/Window" } } }
        "400": { $ref: "#/components/responses/BadBody" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/windows/{claimId}:
    get:
      operationId: getWindow
      summary: Read the window for a claim
      description: When it opened, when it closes, whether the worker was told, and how it was exited if it was.
      parameters: [{ $ref: "#/components/parameters/ClaimID" }]
      responses:
        "200":
          description: The window.
          content: { application/json: { schema: { $ref: "#/components/schemas/Window" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/claims/{claimId}/confirm:
    post:
      operationId: confirmClaim
      summary: Confirm a claim
      description: >
        The worker saying yes, or a supervisor saying it for them. Exits the window,
        issues the credential and releases payment. `auto` is not accepted here -
        that is what the sweep does - and `dispute` has its own endpoint, because
        conflating "I agree" with "I object" in one field is how a wrong record gets
        recorded as agreed.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ClaimID" }, { $ref: "#/components/parameters/OnBehalfOf" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                route: { type: string, enum: [self, assisted], default: self }
      responses:
        "401":
          description: >
            No verified caller, or a token that did not verify. This endpoint acts
            in somebody's name and will not act on an asserted party id.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: >
            The caller is authenticated and may not do this — `subject_not_enrolled`
            when no party here is bound to their identity (an ordinary state for
            somebody not yet enrolled), `party_not_proven` when the request names a
            party other than the one it authenticated as, `not_permitted_to_act_for`
            when it asks to act for somebody without the authorization.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "200":
          description: Window closed, credential issued, payment released.
          content: { application/json: { schema: { $ref: "#/components/schemas/ExitResult" } } }
        "400":
          description: A route other than self or assisted.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No window for that claim.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/claims/{claimId}/dispute:
    post:
      operationId: disputeClaim
      summary: Dispute a claim - and still release the payment
      description: >
        Records an open Contest against the claim and then exits the window by
        exactly the same path every other exit takes. Payment is released (W5–W6): a
        dispute contests the record, not the money. Withholding the money while the
        record is argued about is the failure this endpoint is shaped to prevent. A
        reason is required, because a dispute nobody can act on is not a dispute.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ClaimID" }, { $ref: "#/components/parameters/OnBehalfOf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                raisedByPartyId: { type: string }
      responses:
        "401":
          description: >
            No verified caller, or a token that did not verify. This endpoint acts
            in somebody's name and will not act on an asserted party id.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: >
            The caller is authenticated and may not do this — `subject_not_enrolled`
            when no party here is bound to their identity (an ordinary state for
            somebody not yet enrolled), `party_not_proven` when the request names a
            party other than the one it authenticated as, `not_permitted_to_act_for`
            when it asks to act for somebody without the authorization.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "200":
          description: Contest recorded, window closed, payment released like any other exit.
          content: { application/json: { schema: { $ref: "#/components/schemas/ExitResult" } } }
        "400":
          description: No reason given.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No window for that claim.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: The dispute is not a valid Contest.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/sweep:
    post:
      operationId: sweep
      summary: Auto-confirm every window whose time has run out
      description: >
        Driven by the clock and nothing else, and exposed as an endpoint so the
        harness can advance seven days and then ask for the consequences instead of
        waiting on a ticker it cannot see. One claim failing does not stop the rest:
        the others are also owed a payment, and a sweep that aborts halfway leaves
        the remainder silently unpaid.
      responses:
        "200":
          description: What was due and what was auto-confirmed. A shortfall between the two is a failure to investigate, and is visible here.
          content:
            application/json:
              schema:
                type: object
                required: [at, due, autoConfirmed]
                properties:
                  at: { type: string, format: date-time }
                  due: { type: integer }
                  autoConfirmed: { type: array, items: { type: string } }
        "500": { $ref: "#/components/responses/Internal" }

  # The credential surface — /v1/credentials*, /v1/status-list, /v1/issuer —
  # moved to the verification service with issuance itself (#137, 2026-08-27).

  /v1/unreleased:
    get:
      operationId: unreleased
      summary: Windows that closed without releasing payment
      description: >
        Should always answer zero. It exists so W5–W6 can be checked rather than
        believed - any row here is a claim that exited its window and left someone
        unpaid.
      responses:
        "200":
          description: The offending windows, and how many.
          content:
            application/json:
              schema:
                type: object
                required: [windows, count]
                properties:
                  windows: { type: array, items: { $ref: "#/components/schemas/Window" } }
                  count: { type: integer, description: Expected to be 0.}
        "500": { $ref: "#/components/responses/Internal" }

  /v1/contests:
    get:
      operationId: listContests
      summary: Where does any dispute against this target stand?
      description: >
        A dispute never revokes the credential it concerns (#58). A credential is
        a historical statement - what was asserted, by whom, and when - and
        revoking it because the worker later objected would mean a worker who
        disputes one detail loses the whole record of work they did do. That is a
        penalty for objecting, falling on the person the dispute exists to
        protect. So the credential stands and the dispute is visible beside it;
        this endpoint is that visibility.

        Returns STANDING only: never the reason, never who raised it. A dispute
        reason is ordinarily the worker speaking about their own record, and that
        is between them and the programme.

        Both parameters are required. An unscoped listing would be a search for
        disputed workers.
      parameters:
        - name: targetKind
          in: query
          required: true
          schema: { type: string, enum: [claim, credential, linked-record] }
          description: >
            Never `unit`. A contest against a Unit is not expressible, which is
            how "a disputed claim never destroys the underlying record" is
            enforced by shape rather than by review.
        - name: targetId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Every dispute against that target, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [contests, count]
                properties:
                  contests:
                    type: array
                    items:
                      type: object
                      required: [state, raisedAt]
                      properties:
                        state: { type: string, enum: [OPEN, UPHELD, REJECTED, WITHDRAWN] }
                        raisedAt: { type: string, format: date-time }
                  count: { type: integer }
        "400": { $ref: "#/components/responses/BadBody" }
        "500": { $ref: "#/components/responses/Internal" }

  # Every CREST service carries these two, added by pkg/httpx.Server.
  /healthz: { $ref: "#/components/pathItems/healthz" }
  /readyz: { $ref: "#/components/pathItems/readyz" }


  /internal/windows:
    post:
      operationId: openWindow
      summary: Open a confirmation window for a claim that was just created
      description: >
        The `claim.created` handoff, delivered from `evidence`'s outbox to
        whatever CONFIRMATION_URL names (#127). Never a public write: it carries
        the claim's authoritative party, and a caller who could post here could
        open a payment window for somebody else.


        The window's opening instant is `firstVisibleAt` — the instant the
        worker could first have seen the record, stamped by `evidence` — and
        never this process's clock at the moment the delivery lands (#221, ruled
        2026-09-08). A delivery retried through an outage therefore opens the
        window at the right time, late-arriving, rather than granting a fresh
        seven days that started when the network came back.


        The supplied instant is trusted, because the peer is authenticated with
        the service token. The disagreement between it and this process's
        arrival clock is recorded even so: past CLOCK_SKEW_ALERT (default 5m) it
        is logged at warn with both instants and counted in
        `crest_window_clock_skew_events` on /internal/metrics. That counter is
        the core↔payments clock-skew detector; a deployment whose two processes
        drift moves every worker's deadline and had no symptom anywhere before
        it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WindowRequest" }
      responses:
        "201":
          description: >
            The window, open. A redelivery of a message already handled returns
            the window that exists rather than opening a second one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Window" }
        "400": { $ref: "#/components/responses/BadBody" }

  # No /internal/clock anywhere in CREST. The driveable clock was removed on
  # 2026-09-09: every process reads real time, and every time-bound behaviour
  # is a configured duration instead — CONFIRMATION_WINDOW, SWEEP_EVERY,
  # SOURCE_MONITOR_EVERY, CLOCK_SKEW_ALERT, CREST_RECOVERY_OVERRIDE_REVIEW.
  # The harness proves each of them by bringing the same code up with the
  # duration set to seconds and waiting real time for the outcome, so there is
  # nothing left for an HTTP call to move — and therefore no route anybody
  # could be talked into enabling in a deployment, where a movable clock is a
  # way to close a worker's confirmation window early on them.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        An OIDC access token from the deployment's identity provider (#89, §4.1).
        In a deployment that is eSignet; locally it is tools/mocks/oidc, which
        mints real ES256 tokens against a real JWKS so the verification path
        under test is the production one.


        The provider's `sub` is never used directly. CREST re-salts it under a
        per-deployment key before anything stores or compares it, because #52
        and #63 are open against eSignet's pairwise subject — it partitions by
        relying party rather than by client, and derives without a
        per-deployment salt. Two deployments reading the same eSignet therefore
        cannot correlate their workers by subject.

  parameters:
    OnBehalfOf:
      name: X-CREST-On-Behalf-Of
      in: header
      required: false
      schema: { type: string }
      description: >
        The party this request acts for, when somebody is acting for somebody
        else. The assisted paths are a requirement rather than a loophole — a
        worker with no phone confirming through a supervisor is one of the four
        T=7 exits — and what makes them safe is that they are recorded as
        themselves. Refused with 403 unless the caller holds `act-for-party` in
        the context.

    ClaimID:
      name: claimId
      in: path
      required: true
      schema: { type: string }

  schemas:
    Error:
      type: object
      description: >
        The error body every CREST service returns (pkg/httpx). The message is
        written for whoever reads it, including eventually a worker being told why
        something is held.
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Per-field detail from schema validation, when there is any.

    WindowRequest:
      type: object
      description: >
        What `evidence` tells the payments application when a claim is created.
        Deliberately the facts a window needs and nothing more — no outcome, no
        provenance. Confirmation asks a worker whether a record is true; it does
        not need to be able to re-derive the record.
      required: [claimId, unitId, partyId, contextId]
      properties:
        claimId: { type: string }
        unitId: { type: string }
        partyId: { type: string }
        contextId: { type: string }
        definitionId: { type: string }
        definitionVersion: { type: integer }
        createdAt:
          type: string
          format: date-time
          description: >
            When the record this claim attaches to entered CREST. On the ingest
            path that is when the batch arrived; on the unclear-queue path it is
            still when the batch arrived, weeks before anybody worked the queue,
            which is the same instant the unit carries. Carried for
            reconciliation; it is not what the window runs from.
        firstVisibleAt:
          type: string
          format: date-time
          description: >
            When the worker could first have seen the record, and therefore when
            the window opens (#221). Equal to `createdAt` on the ingest path;
            the resolution instant on the unclear-queue path, because a worker
            cannot object to a record they were never shown. Absent only from a
            core deployed before #221, in which case the window falls back to
            the payments process's arrival clock and says so in the log — for
            exactly one deploy (see docs/DEPLOYMENT.md).

    Window:
      type: object
      description: One claim's confirmation window.
      properties:
        claimId: { type: string }
        unitId: { type: string }
        partyId: { type: string }
        contextId: { type: string }
        definitionId: { type: string }
        definitionVersion: { type: integer }
        openedAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        notifiedAt: { type: [string, "null"], format: date-time }
        exitedAt: { type: [string, "null"], format: date-time }
        route: { type: [string, "null"], enum: [self, auto, assisted, dispute, null] }
    ExitResult:
      type: object
      description: >
        What a window exit produced. Every one of the four routes produces a
        release; the route is recorded for reconciliation and never branched on
        (W5–W6).
      properties:
        claimId: { type: string }
        route: { type: string, enum: [self, auto, assisted, dispute] }
        credentialId: { type: string }
        releasedAt: { type: string, format: date-time }
  responses:
    BadBody:
      description: >
        The body could not be read, or carried a field this service does not know.
        Unknown fields are rejected rather than dropped - a misspelled field is a
        wrong number nobody notices.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SchemaViolation:
      description: The document does not satisfy its JSON Schema; `problems` lists every failure at once.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such record.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Internal:
      description: The service logged the cause and did not leak it.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  pathItems:
    healthz:
      get:
        operationId: healthz
        tags: [health]
        summary: Liveness
        description: The process is up. Separate from readiness on purpose - a service can be alive and unable to serve.
        responses:
          "200":
            description: Alive.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ok }
                    time: { type: string, format: date-time }
    readyz:
      get:
        operationId: readyz
        tags: [health]
        summary: Readiness
        description: >
          Actually touches the database. The harness polls this instead of
          sleeping, so a readyz that always says yes turns every start-up race into
          a flaky test rather than a failed one.
        responses:
          "200":
            description: Ready to serve.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string, const: ready }
          "503":
            description: Alive but not serving; `reason` says what is unreachable.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    service: { type: string }
                    status: { type: string }
                    reason: { type: string }
